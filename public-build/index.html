    --primary:#0f4f88; --primary-light:#eef7ff; --accent:#1d7fd6;
    --bg-subtle:#f0f7ff; --border-color:#e0edf7;
    --sidebar-bg:#f8fbff; --sidebar-border:#e0edf7;
    --announce-bg:linear-gradient(135deg,#dbeafe,#eff6ff);
    --announce-color:#0369a1; --announce-border:#bae6fd;
    --announce-shadow:rgba(59,130,246,0.15);
  }
  .theme-girls {
    --primary:#be185d; --primary-light:#fdf2f8; --accent:#db2777;
    --bg-subtle:#fff0f7; --border-color:#fce7f3;
    --sidebar-bg:#fff8fb; --sidebar-border:#fce7f3;
    --announce-bg:linear-gradient(135deg,#fce7f3,#fff0f7);
    --announce-color:#9d174d; --announce-border:#f9a8d4;
    --announce-shadow:rgba(219,39,119,0.15);
  }
  .theme-boys .sidebar { background:var(--sidebar-bg); border-left:1px solid var(--sidebar-border); }
  .theme-boys .sidebar-top { border-bottom:1px solid var(--sidebar-border); }
  .theme-boys .sidebar-top h1 { color:var(--primary); }
  .theme-boys .sidebar-bottom { border-top:1px solid var(--sidebar-border); }
  .theme-girls .sidebar { background:var(--sidebar-bg); border-left:1px solid var(--sidebar-border); }
  .theme-girls .sidebar-top { border-bottom:1px solid var(--sidebar-border); }
  .theme-girls .sidebar-top h1 { color:var(--primary); }
  .theme-girls .sidebar-bottom { border-top:1px solid var(--sidebar-border); }

  .user-name { font-weight:600; font-size:14px; margin:0; }
  .sidebar-announce { margin:0; }
  .sidebar-announce .line { white-space:nowrap; animation: marquee 10s linear infinite; }
  @keyframes marquee { 0%{transform:translateX(-120px);opacity:0} 8%{transform:translateX(0);opacity:1} 80%{transform:translateX(60px);opacity:1} 100%{transform:translateX(120px);opacity:0} }
  @keyframes msgPulse { 0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)} 70%{box-shadow:0 0 0 12px rgba(220,38,38,0)} 100%{box-shadow:0 0 0 0 rgba(220,38,38,0)} }
  @keyframes marqueeBar { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-90px)} }
  .notice-bar { background:linear-gradient(135deg,var(--primary,#0f4f88),var(--accent,#1d7fd6)); color:#fff; border-radius:10px; overflow:hidden; padding:9px 0; margin-bottom:12px; box-shadow:0 2px 12px rgba(0,0,0,.15); }
  .notice-bar .line { display:inline-block; white-space:nowrap; font-size:14px; font-weight:800; padding:0 16px; animation:marqueeBar 10s ease-in-out infinite; }

  @media (max-width:900px) {
    .main { padding:14px; }
  }
  @media (max-width:560px) {
    .main { padding:12px; }
    .grid { gap:10px; }
    .grid-3, .grid-4, .grid-5, .grid-6 { grid-template-columns:repeat(2,1fr) !important; }
    .card { padding:12px; }
    .section-title { font-size:15px; margin:16px 0 10px; }
    .stat-icon { font-size:22px; }
    .stat-value { font-size:19px; }
    .notice-bar { padding:9px 0; margin-bottom:10px; }
    .notice-bar .line { font-size:14px; }

    .page-title { font-size:20px; }
    .modal-overlay { padding:14px 10px; }
    .modal-box { padding:14px; }

  @media (max-width:820px){
    body { overflow-x:hidden; }
    .topbar-inner { padding:8px 12px 10px; }
    .demo-banner { font-size:12px; padding:8px 12px; }
    .welcome-banner { padding:12px; }
    .school-dash { padding:20px 14px; }
    .school-dash-header h1 { font-size:22px; }
    .school-panel { padding:18px; }

    .page-title { font-size:18px; }
    .login-card h1 { font-size:20px; }
    .att-stats { width:100%; }
    .att-stat { flex:1 1 45%; justify-content:center; }

  }
  .announce-boys { background:var(--announce-bg); color:var(--announce-color); text-align:center; padding:24px 16px; border-radius:12px; overflow:hidden; position:relative; border:2px solid var(--announce-border); font-size:18px; font-weight:700; box-shadow:0 4px 12px var(--announce-shadow); }
  .announce-girls { background:var(--announce-bg); color:var(--announce-color); text-align:center; padding:24px 16px; border-radius:12px; overflow:hidden; position:relative; border:2px solid var(--announce-border); font-size:18px; font-weight:700; box-shadow:0 4px 12px var(--announce-shadow); }
  .announce-dash .scroll-text { display:inline-block; white-space:nowrap; animation: scrollAnnounce 14s linear infinite; }

  @media (max-width:700px) { .school-dash-grid { grid-template-columns:1fr; } }

  .school-panel:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.1); }
  .school-panel.boys { background:#eff6ff; border-color:#bfdbfe; }

  .school-panel.girls { background:#fdf2f8; border-color:#fbcfe8; }

  .school-panel.girls .school-enter-btn { background:#be185d; color:#fff; }
  .school-panel.girls .school-enter-btn:hover { background:#9d174d; }
  .school-logout-link { text-align:center; margin-top:24px; }
  .school-logout-link a { color:#6b7280; font-size:13px; cursor:pointer; text-decoration:underline; }
  .school-badge { display:inline-block; padding:3px 12px; border-radius:999px; font-size:12px; font-weight:700; margin-right:8px; vertical-align:middle; }

  .tt-tab:hover { border-color:#1d7fd6; color:#1d7fd6; }

  /* ===== واجهة المدير التنفيذية — التصميم الجديد ===== */
  .layout { --navy:#0f4678; --blue:#1672c4; --light:#f4f8fc; --line:#e4edf5; --text:#17324d; --muted:#7b8b9c; --green:#16a34a; --red:#ef4444; --orange:#f59e0b; --cyan:#06a6c7; --purple:#8b5cf6; }
  .layout .layout-body { max-width:1320px; align-items:stretch; }
  .layout .main { max-width:1320px; padding:18px 20px; align-self:stretch; }
  .layout .topbar { background:#fff; border-bottom:1px solid var(--line); box-shadow:0 1px 8px rgba(15,70,120,.07); }
  .layout .topbar-inner { max-width:1320px; padding:9px 20px; }

  .topbar-search input::placeholder { color:#9fb0c1; }

  .layout .sidebar { width:250px; background:linear-gradient(180deg,#123f6c 0%,#0d3154 100%); border-left:none; align-self:stretch; min-height:auto; }
  .layout .sidebar nav.menu { padding:6px 10px; display:flex; flex-direction:column; gap:1px; }
  .layout .sidebar .nav-link { display:flex; align-items:center; gap:10px; min-height:34px; padding:6px 11px; border-radius:8px; color:rgba(255,255,255,.90); font-size:13.5px; font-weight:500; white-space:nowrap; }

  .menu-icon { width:20px; min-width:20px; display:flex; align-items:center; justify-content:center; font-size:16px; }

  /* بطاقات لوحة المدير */

  .att-legend { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text); min-width:0; }
  .att-legend .row { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .att-legend .swatch { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .att-legend b { margin-inline-start:auto; font-weight:800; }
  .att-report-btn { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; border:none; background:transparent; color:#2563eb; font-size:12px; font-weight:700; cursor:pointer; padding:10px 16px; border-top:1px solid var(--line); font-family:inherit; grid-column:1 / -1; }
  .att-report-btn:hover { color:#1d4ed8; background:var(--light); }
  .dash-tabs { display:flex; gap:6px; background:var(--light); border-radius:10px; padding:4px; }
  .dash-tab { flex:1; border:none; background:transparent; border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:800; color:var(--muted); cursor:pointer; font-family:inherit; }

  .dash-leader-row:last-child { border-bottom:none; }
  .dash-leader-medal { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
  .dash-leader-name { font-weight:700; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dash-leader-meta { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .dash-leader-pts { margin-inline-start:auto; font-weight:800; font-size:13px; flex-shrink:0; }
  .app-footer { background:#fff; border-top:1px solid var(--line); padding:10px 16px; text-align:center; font-size:11px; color:var(--muted); }
  @media (max-width:1180px){ .dash-stats { grid-template-columns:repeat(3,1fr); } .dash-bottom { grid-template-columns:1fr; } }
  @media (max-width:900px){ .topbar-search { display:none; } }
  @media (max-width:820px){ .dash-hero { grid-template-columns:1fr; } .dash-grid2 { grid-template-columns:1fr; } .dash-bottom { grid-template-columns:1fr; } .dash-mid { grid-template-columns:1fr; } }
  @media (max-width:560px){ .dash-stats { grid-template-columns:repeat(2,1fr); } .att-card { grid-template-columns:1fr; } .att-group + .att-group { border-inline-start:none; border-top:1px solid var(--line); } }

    --announce-color:#0369a1; --announce-border:#bae6fd;
    --announce-shadow:rgba(59,130,246,0.15);
  }
  .theme-girls {
    --primary:#be185d; --primary-light:#fdf2f8; --accent:#db2777;
    --bg-subtle:#fff0f7; --border-color:#fce7f3;
    --sidebar-bg:#fff8fb; --sidebar-border:#fce7f3;
    --announce-bg:linear-gradient(135deg,#fce7f3,#fff0f7);
    --announce-color:#9d174d; --announce-border:#f9a8d4;
    --announce-shadow:rgba(219,39,119,0.15);
  }
  .theme-boys .sidebar { background:var(--sidebar-bg); border-left:1px solid var(--sidebar-border); }
  .theme-boys .sidebar-top { border-bottom:1px solid var(--sidebar-border); }
  .theme-boys .sidebar-top h1 { color:var(--primary); }
  .theme-boys .sidebar-bottom { border-top:1px solid var(--sidebar-border); }
  .theme-girls .sidebar { background:var(--sidebar-bg); border-left:1px solid var(--sidebar-border); }
  .theme-girls .sidebar-top { border-bottom:1px solid var(--sidebar-border); }
  .theme-girls .sidebar-top h1 { color:var(--primary); }
  .theme-girls .sidebar-bottom { border-top:1px solid var(--sidebar-border); }

  .user-name { font-weight:600; font-size:14px; margin:0; }
  .sidebar-announce { margin:0; }
  .sidebar-announce .line { white-space:nowrap; animation: marquee 10s linear infinite; }
  @keyframes marquee { 0%{transform:translateX(-120px);opacity:0} 8%{transform:translateX(0);opacity:1} 80%{transform:translateX(60px);opacity:1} 100%{transform:translateX(120px);opacity:0} }
  @keyframes msgPulse { 0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)} 70%{box-shadow:0 0 0 12px rgba(220,38,38,0)} 100%{box-shadow:0 0 0 0 rgba(220,38,38,0)} }
  @keyframes marqueeBar { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-90px)} }
  .notice-bar { background:linear-gradient(135deg,var(--primary,#0f4f88),var(--accent,#1d7fd6)); color:#fff; border-radius:10px; overflow:hidden; padding:9px 0; margin-bottom:12px; box-shadow:0 2px 12px rgba(0,0,0,.15); }
  .notice-bar .line { display:inline-block; white-space:nowrap; font-size:14px; font-weight:800; padding:0 16px; animation:marqueeBar 10s ease-in-out infinite; }

  @media (max-width:900px) {
    .main { padding:14px; }
  }
  @media (max-width:560px) {
    .main { padding:12px; }
    .grid { gap:10px; }
    .grid-3, .grid-4, .grid-5, .grid-6 { grid-template-columns:repeat(2,1fr) !important; }
    .card { padding:12px; }
    .section-title { font-size:15px; margin:16px 0 10px; }
    .stat-icon { font-size:22px; }
    .stat-value { font-size:19px; }
    .notice-bar { padding:9px 0; margin-bottom:10px; }
    .notice-bar .line { font-size:14px; }
    table.data-table th, table.data-table td { padding:10px 8px; font-size:13px; }
    table.data-table td { word-break:break-word; }
    .page-title { font-size:20px; }
    .modal-overlay { padding:14px 10px; }
    .modal-box { padding:14px; }
    .tt-row { flex-wrap:wrap; gap:8px; }
    .tt-badge { min-width:88px; font-size:12px; }
    .form-inline > div { flex:1 1 100%; }
    .form-inline select.input, .form-inline input.input { width:100%; min-width:0 !important; }
  }
  @media (max-width:820px){
    body { overflow-x:hidden; }
    .topbar-inner { padding:8px 12px 10px; }
    .demo-banner { font-size:12px; padding:8px 12px; }
    .welcome-banner { padding:12px; }
    .school-dash { padding:20px 14px; }
    .school-dash-header h1 { font-size:22px; }
    .school-panel { padding:18px; }
    .header-row { align-items:stretch; }
    .header-row .page-title { font-size:20px; }
    .btn-group { width:100%; }
    .btn-group .btn-primary, .btn-group .btn-secondary, .btn-group .file-btn { flex:1 1 auto; justify-content:center; text-align:center; }
    .stat-hero { padding:12px 14px; }
    .stat-hero .stat-icon { width:44px; height:44px; font-size:22px; }
  }
  @media (max-width:480px){
    .grid-2 { grid-template-columns:1fr; }
    .topbar-brand h1 { font-size:14px; }
    .topbar-actions { gap:8px; }
    .topbar-user-name { font-size:12px; }
    .page-title { font-size:18px; }
    .login-card h1 { font-size:20px; }
    .att-stats { width:100%; }
    .att-stat { flex:1 1 45%; justify-content:center; }
    .tt-tabs .tt-tab { padding:6px 12px; font-size:13px; }
    .modal-box .dl-item { flex-wrap:wrap; }
  }
  .announce-boys { background:var(--announce-bg); color:var(--announce-color); text-align:center; padding:24px 16px; border-radius:12px; overflow:hidden; position:relative; border:2px solid var(--announce-border); font-size:18px; font-weight:700; box-shadow:0 4px 12px var(--announce-shadow); }
  .announce-girls { background:var(--announce-bg); color:var(--announce-color); text-align:center; padding:24px 16px; border-radius:12px; overflow:hidden; position:relative; border:2px solid var(--announce-border); font-size:18px; font-weight:700; box-shadow:0 4px 12px var(--announce-shadow); }
  .announce-dash .scroll-text { display:inline-block; white-space:nowrap; animation: scrollAnnounce 14s linear infinite; }
  @keyframes scrollAnnounce { 0%{transform:translateX(-120%)} 100%{transform:translateX(120%)} }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(#eef7ff,#fff); padding:16px; }
  .login-card { width:100%; max-width:360px; text-align:center; }
  .school-logo { width:86px; height:86px; border-radius:50%; object-fit:cover; border:2px solid var(--primary,#0f4f88); background:#fff; margin:0 auto 10px; box-shadow:0 2px 10px rgba(15,79,136,.15); }
  .login-card h1 { color:#0f4f88; font-size:26px; margin:0 0 4px; }
  .login-card label { display:block; text-align:right; font-size:13px; font-weight:600; margin:14px 0 4px; }
  .error-box { background:#fef2f2; color:#dc2626; font-size:13px; border-radius:8px; padding:8px 12px; margin-top:12px; }
  .hint { font-size:12px; color:#9ca3af; margin-top:14px; }
  .toggle-btn { font-size:13px; padding:6px 12px; border-radius:8px; font-weight:600; border:1px solid #e5e7eb; background:#fff; color:#6b7280; cursor:pointer; }
  .toggle-btn.active { background:#1d7fd6; color:#fff; border-color:#1d7fd6; }
  .school-dash { min-height:100vh; background:linear-gradient(#eef7ff,#fff); padding:40px; }
  .school-dash-header { text-align:center; margin-bottom:32px; }
  .school-dash-header h1 { color:#0f4f88; font-size:28px; margin:0 0 4px; }
  .school-dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:900px; margin:0 auto; }
  @media (max-width:700px) { .school-dash-grid { grid-template-columns:1fr; } }
  .school-panel { border-radius:16px; padding:24px; cursor:pointer; transition:all .2s; border:2px solid transparent; }
  .school-panel:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.1); }
  .school-panel.boys { background:#eff6ff; border-color:#bfdbfe; }
  .school-panel.boys:hover { border-color:#1d4ed8; }
  .school-panel.girls { background:#fdf2f8; border-color:#fbcfe8; }
  .school-panel.girls:hover { border-color:#be185d; }
  .school-panel-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .school-panel-icon { font-size:36px; }
  .school-panel-title { font-size:20px; font-weight:800; margin:0; }
  .school-panel.boys .school-panel-title { color:#1d4ed8; }
  .school-panel.girls .school-panel-title { color:#be185d; }
  .school-panel-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .school-stat-box { background:rgba(255,255,255,.7); border-radius:10px; padding:10px 12px; text-align:center; }
  .school-stat-box .num { font-size:22px; font-weight:800; display:block; }
  .school-stat-box .lbl { font-size:11px; color:#6b7280; font-weight:600; }
  .school-panel.boys .school-stat-box .num { color:#1d4ed8; }
  .school-panel.girls .school-stat-box .num { color:#be185d; }
  .school-enter-btn { display:block; width:100%; padding:10px; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer; text-align:center; }
  .school-panel.boys .school-enter-btn { background:#1d4ed8; color:#fff; }
  .school-panel.boys .school-enter-btn:hover { background:#1e40af; }
  .school-panel.girls .school-enter-btn { background:#be185d; color:#fff; }
  .school-panel.girls .school-enter-btn:hover { background:#9d174d; }
  .school-logout-link { text-align:center; margin-top:24px; }
  .school-logout-link a { color:#6b7280; font-size:13px; cursor:pointer; text-decoration:underline; }
  .school-badge { display:inline-block; padding:3px 12px; border-radius:999px; font-size:12px; font-weight:700; margin-right:8px; vertical-align:middle; }
  .school-badge.boys { background:#eff6ff; color:#1d4ed8; }
  .school-badge.girls { background:#fdf2f8; color:#be185d; }
  .tt-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .tt-tab { padding:8px 16px; border-radius:999px; border:1px solid #e5e7eb; background:#fff; color:#374151; font-size:14px; font-weight:700; cursor:pointer; transition:all .15s; }
  .tt-tab:hover { border-color:#1d7fd6; color:#1d7fd6; }
  .tt-tab.active { background:#1d7fd6; color:#fff; border-color:#1d7fd6; }
  .tt-row { display:flex; align-items:center; gap:14px; padding:12px 16px; }
  .tt-row.tt-empty { border-style:dashed; opacity:.85; }
  .tt-badge { min-width:118px; text-align:center; padding:6px 10px; border-radius:10px; background:#eff6ff; color:#1d4ed8; font-size:13px; font-weight:800; }
  .theme-girls .tt-badge { background:#fdf2f8; color:#be185d; }
  .tt-row.tt-empty .tt-badge { background:#f3f4f6; color:#9ca3af; }
  .tt-info { flex:1; min-width:0; }
  .tt-subject { font-size:15px; font-weight:800; color:#111827; }
  .tt-actions { display:flex; gap:6px; align-items:center; }
  .tt-add { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; background:#16a34a; color:#fff; font-size:18px; font-weight:800; }
</style>

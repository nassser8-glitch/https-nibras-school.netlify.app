});
function removeInstallHint(){
  var el = document.getElementById('installHintBar');
  if(el && el.parentNode) el.parentNode.removeChild(el);
}
function dismissInstallHint(){
  removeInstallHint();
  try{ localStorage.setItem('nibrasInstallHintDismissed', '1'); }catch(err){}
}
function doInstallApp(){
  if(__deferredInstallPrompt){
    __deferredInstallPrompt.prompt();
    __deferredInstallPrompt.userChoice.then(function(){ __deferredInstallPrompt = null; });
  } else {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if(isIOS){ openInstallGuide(); }
    else { alert('لا يمكن التثبيت من هذا المتصفح — استخدم Google Chrome أو Edge على الجوال.'); }
  }
}
function openInstallGuide(){
  if(!document.body){ setTimeout(openInstallGuide, 300); return; }
  removeInstallHint();
  var ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.alignItems = 'center';
  var step = function(n, t, d){ return '<div style="display:flex;gap:12px;align-items:flex-start;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px"><div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:linear-gradient(135deg,#0f4f88,#1d7fd6);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px">'+n+'</div><div><div style="font-weight:700;font-size:13.5px;color:#111827">'+t+'</div><div style="font-size:12.5px;color:#6b7280;margin-top:3px;line-height:1.6">'+d+'</div></div></div>'; };
  var html = '';
  if(isIOS){
    html = '<div class="modal-head"><h3>📲 إضافة نبراس إلى شاشة الآيفون</h3><button class="modal-close" onclick="closeInstallGuide()">✕</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «مشاركة» ⬆', 'في المتصفح (سفاري) أسفل الشاشة تجد زر المشاركة على شكل مربع مع سهم لأعلى — اضغط عليه.') +
      step('2', 'اختر «إضافة إلى الشاشة الرئيسية»', 'من القائمة المنبثقة ابحث عن خيار «إضافة إلى الشاشة الرئيسية» (Add to Home Screen) واضغط عليه.') +
      step('3', 'اضغط «إضافة»', 'سيُطلب منك تأكيد الاسم — اضغط «إضافة» أعلى اليمين، وستجد الأيقونة على شاشتك الرئيسية.') +
      '</div>';
  } else {
    html = '<div class="modal-head"><h3>📲 تثبيت نبراس على جهازك</h3><button class="modal-close" onclick="closeInstallGuide()">✕</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «تثبيت» أدناه', 'سيعرض المتصفح نافذة تأكيد التثبيت.') +
      step('2', 'اضغط «تثبيت» في النافذة', 'ستضاف أيقونة نبراس إلى الشاشة الرئيسية.') +
      '<button class="btn-primary" style="margin-top:4px" onclick="doInstallApp()">⬇ تثبيت التطبيق الآن</button>' +
      '</div>';
  }
  overlay.innerHTML = '<div class="modal-box" style="max-width:460px">' + html + '</div>';
  overlay.onclick = function(e){ if(e.target === overlay) closeInstallGuide(); };
  document.body.appendChild(overlay);
}
function closeInstallGuide(){
  var ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
}
function maybeShowInstallHint(force){
  try{
    if(!force && localStorage.getItem('nibrasInstallHintDismissed')) return;
    var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(standalone) return;
    if(!document.body){ setTimeout(function(){ maybeShowInstallHint(force); }, 300); return; }
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isAndroid = /Android/.test(navigator.userAgent);
    var canInstall = __deferredInstallPrompt || isIOS || isAndroid;
    if(!canInstall) return;
    removeInstallHint();
    var d = document.createElement('div');
    d.id = 'installHintBar';
    d.className = 'install-hint';
    var tip = isIOS
      ? 'اضغط زر «مشاركة» ⬆ في المتصفح ثم «إضافة إلى الشاشة الرئيسية»'
      : 'ثبّت التطبيق على جهازك لفتحه من الشاشة الرئيسية';
    d.innerHTML = '<span style="font-size:20px">📲</span><span>' + tip + '</span><button class="btn-primary" style="padding:6px 14px;font-size:13px;flex-shrink:0" onclick="' + (isIOS ? 'openInstallGuide()' : 'doInstallApp()') + '">' + (isIOS ? 'كيف أثبّت؟' : 'تثبيت') + '</button><button class="close" title="إغلاق" onclick="dismissInstallHint()">✕</button>';
    document.body.appendChild(d);
  }catch(e){}
}
setTimeout(function(){ maybeShowInstallHint(false); }, 1200);
</script>
</body>
</html>

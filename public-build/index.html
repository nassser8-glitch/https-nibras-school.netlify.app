    --announce-shadow:rgba(59,130,246,0.15);
  }
  .theme-girls {
    --primary:#be185d; --primary-light:#fdf2f8; --accent:#db2777;
    --bg-subtle:#fff0f7; --border-color:#fce7f3;
    --sidebar-bg:#fff8fb; --sidebar-border:#fce7f3;
    --announce-bg:linear-gradient(135deg,#fce7f3,#fff0f7);
    --announce-color:#9d174d; --announce-border:#f9a8d4;
    --announce-shadow:rgba(219,39,119,0.15);

  .theme-boys .sidebar { background:var(--sidebar-bg); border-left:1px solid var(--sidebar-border); }
  .theme-boys .sidebar-top { border-bottom:1px solid var(--sidebar-border); }

  .theme-boys .sidebar-bottom { border-top:1px solid var(--sidebar-border); }
  .theme-girls .sidebar { background:var(--sidebar-bg); border-left:1px solid var(--sidebar-border); }
  .theme-girls .sidebar-top { border-bottom:1px solid var(--sidebar-border); }

  .user-name { font-weight:600; font-size:14px; margin:0; }
  .sidebar-announce { margin:0; }
  .sidebar-announce .line { white-space:nowrap; animation: marquee 10s linear infinite; }
  @keyframes marquee { 0%{transform:translateX(-120px);opacity:0} 8%{transform:translateX(0);opacity:1} 80%{transform:translateX(60px);opacity:1} 100%{transform:translateX(120px);opacity:0} }
  @keyframes msgPulse { 0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)} 70%{box-shadow:0 0 0 12px rgba(220,38,38,0)} 100%{box-shadow:0 0 0 0 rgba(220,38,38,0)} }

  .notice-bar { background:linear-gradient(135deg,var(--primary,#0f4f88),var(--accent,#1d7fd6)); color:#fff; border-radius:10px; overflow:hidden; padding:9px 0; margin-bottom:12px; box-shadow:0 2px 12px rgba(0,0,0,.15); }
  .notice-bar .line { display:inline-block; white-space:nowrap; font-size:14px; font-weight:800; padding:0 16px; animation:marqueeBar 10s ease-in-out infinite; }

  @media (max-width:900px) {
    .main { padding:14px; }
  }

  }
  .announce-boys { background:var(--announce-bg); color:var(--announce-color); text-align:center; padding:24px 16px; border-radius:12px; overflow:hidden; position:relative; border:2px solid var(--announce-border); font-size:18px; font-weight:700; box-shadow:0 4px 12px var(--announce-shadow); }
  .announce-girls { background:var(--announce-bg); color:var(--announce-color); text-align:center; padding:24px 16px; border-radius:12px; overflow:hidden; position:relative; border:2px solid var(--announce-border); font-size:18px; font-weight:700; box-shadow:0 4px 12px var(--announce-shadow); }

  /* ===== واجهة المدير التنفيذية — التصميم الجديد ===== */
  .layout { --navy:#0f4678; --blue:#1672c4; --light:#f4f8fc; --line:#e4edf5; --text:#17324d; --muted:#7b8b9c; --green:#16a34a; --red:#ef4444; --orange:#f59e0b; --cyan:#06a6c7; --purple:#8b5cf6; }
  .layout .layout-body { max-width:1320px; }

  @media (max-width:900px){ .topbar-search { display:none; } }
  @media (max-width:820px){ .dash-hero { grid-template-columns:1fr; } .dash-grid2 { grid-template-columns:1fr; } .dash-bottom { grid-template-columns:1fr; } }

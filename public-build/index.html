    --bg-subtle:#f0f7ff; --border-color:#e0edf7;
    --sidebar-bg:#f8fbff; --sidebar-border:#e0edf7;
    --announce-bg:linear-gradient(135deg,#dbeafe,#eff6ff);
    --announce-color:#0369a1; --announce-border:#bae6fd;
    --announce-shadow:rgba(59,130,246,0.15);
  }
  .theme-girls {
    --primary:#be185d; --primary-light:#fdf2f8; --accent:#db2777;
    --bg-subtle:#fff0f7; --border-color:#fce7f3;
    --sidebar-bg:#fff8fb; --sidebar-border:#fce7f3;
    --announce-bg:linear-gradient(135deg,#fce7f3,#fff0f7);
    --announce-color:#9d174d; --announce-border:#f9a8d4;
    --announce-shadow:rgba(219,39,119,0.15);
  }
  .theme-boys .sidebar { background:var(--sidebar-bg); border-left:1px solid var(--sidebar-border); }
  .theme-boys .sidebar-top { border-bottom:1px solid var(--sidebar-border); }
  .theme-boys .sidebar-top h1 { color:var(--primary); }
  .theme-boys .sidebar-bottom { border-top:1px solid var(--sidebar-border); }
  .theme-girls .sidebar { background:var(--sidebar-bg); border-left:1px solid var(--sidebar-border); }
  .theme-girls .sidebar-top { border-bottom:1px solid var(--sidebar-border); }
  .theme-girls .sidebar-top h1 { color:var(--primary); }
  .theme-girls .sidebar-bottom { border-top:1px solid var(--sidebar-border); }

  .user-name { font-weight:600; font-size:14px; margin:0; }
  .sidebar-announce { margin:0; }
  .sidebar-announce .line { white-space:nowrap; animation: marquee 10s linear infinite; }
  @keyframes marquee { 0%{transform:translateX(-120px);opacity:0} 8%{transform:translateX(0);opacity:1} 80%{transform:translateX(60px);opacity:1} 100%{transform:translateX(120px);opacity:0} }
  @keyframes msgPulse { 0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)} 70%{box-shadow:0 0 0 12px rgba(220,38,38,0)} 100%{box-shadow:0 0 0 0 rgba(220,38,38,0)} }
  @keyframes marqueeBar { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-90px)} }
  .notice-bar { background:linear-gradient(135deg,var(--primary,#0f4f88),var(--accent,#1d7fd6)); color:#fff; border-radius:10px; overflow:hidden; padding:9px 0; margin-bottom:12px; box-shadow:0 2px 12px rgba(0,0,0,.15); }
  .notice-bar .line { display:inline-block; white-space:nowrap; font-size:14px; font-weight:800; padding:0 16px; animation:marqueeBar 10s ease-in-out infinite; }

  @media (max-width:900px) {
    .main { padding:14px; }
  }
  @media (max-width:560px) {
    .main { padding:12px; }
    .grid { gap:10px; }
    .grid-3, .grid-4, .grid-5, .grid-6 { grid-template-columns:repeat(2,1fr) !important; }
    .card { padding:12px; }
    .section-title { font-size:15px; margin:16px 0 10px; }
    .stat-icon { font-size:22px; }
    .stat-value { font-size:19px; }
    .notice-bar { padding:9px 0; margin-bottom:10px; }
    .notice-bar .line { font-size:14px; }
    table.data-table th, table.data-table td { padding:10px 8px; font-size:13px; }
    table.data-table td { word-break:break-word; }
    .page-title { font-size:20px; }
    .modal-overlay { padding:14px 10px; }
    .modal-box { padding:14px; }
    .tt-row { flex-wrap:wrap; gap:8px; }
    .tt-badge { min-width:88px; font-size:12px; }
    .form-inline > div { flex:1 1 100%; }
    .form-inline select.input, .form-inline input.input { width:100%; min-width:0 !important; }
  }
  @media (max-width:820px){
    body { overflow-x:hidden; }
    .topbar-inner { padding:8px 12px 10px; }
    .demo-banner { font-size:12px; padding:8px 12px; }
    .welcome-banner { padding:12px; }
    .school-dash { padding:20px 14px; }
    .school-dash-header h1 { font-size:22px; }
    .school-panel { padding:18px; }
    .header-row { align-items:stretch; }
    .header-row .page-title { font-size:20px; }
    .btn-group { width:100%; }
    .btn-group .btn-primary, .btn-group .btn-secondary, .btn-group .file-btn { flex:1 1 auto; justify-content:center; text-align:center; }
    .stat-hero { padding:12px 14px; }
    .stat-hero .stat-icon { width:44px; height:44px; font-size:22px; }
  }
  @media (max-width:480px){
    .grid-2 { grid-template-columns:1fr; }
    .topbar-brand h1 { font-size:14px; }
    .topbar-actions { gap:8px; }
    .topbar-user-name { font-size:12px; }
    .page-title { font-size:18px; }
    .login-card h1 { font-size:20px; }
    .att-stats { width:100%; }
    .att-stat { flex:1 1 45%; justify-content:center; }
    .tt-tabs .tt-tab { padding:6px 12px; font-size:13px; }
    .modal-box .dl-item { flex-wrap:wrap; }
  }
  .announce-boys { background:var(--announce-bg); color:var(--announce-color); text-align:center; padding:24px 16px; border-radius:12px; overflow:hidden; position:relative; border:2px solid var(--announce-border); font-size:18px; font-weight:700; box-shadow:0 4px 12px var(--announce-shadow); }
  .announce-girls { background:var(--announce-bg); color:var(--announce-color); text-align:center; padding:24px 16px; border-radius:12px; overflow:hidden; position:relative; border:2px solid var(--announce-border); font-size:18px; font-weight:700; box-shadow:0 4px 12px var(--announce-shadow); }
  .announce-dash .scroll-text { display:inline-block; white-space:nowrap; animation: scrollAnnounce 14s linear infinite; }
  @keyframes scrollAnnounce { 0%{transform:translateX(-120%)} 100%{transform:translateX(120%)} }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(#eef7ff,#fff); padding:16px; }
  .install-hint { position:fixed; bottom:max(env(safe-area-inset-bottom),10px); left:50%; transform:translateX(-50%); z-index:2000; background:#0f4f88; color:#fff; border-radius:12px; padding:10px 14px; font-size:13px; box-shadow:0 6px 20px rgba(15,79,136,.35); display:flex; align-items:center; gap:10px; max-width:94%; }
  .install-hint .close { background:transparent; color:#cfe4ff; border:none; font-size:14px; cursor:pointer; padding:2px 6px; }
  .login-card { width:100%; max-width:360px; text-align:center; }
  .school-logo { width:86px; height:86px; border-radius:50%; object-fit:cover; border:2px solid var(--primary,#0f4f88); background:#fff; margin:0 auto 10px; box-shadow:0 2px 10px rgba(15,79,136,.15); }
  .login-card h1 { color:#0f4f88; font-size:26px; margin:0 0 4px; }
  .login-card label { display:block; text-align:right; font-size:13px; font-weight:600; margin:14px 0 4px; }
  .error-box { background:#fef2f2; color:#dc2626; font-size:13px; border-radius:8px; padding:8px 12px; margin-top:12px; }
  .hint { font-size:12px; color:#9ca3af; margin-top:14px; }
  .toggle-btn { font-size:13px; padding:6px 12px; border-radius:8px; font-weight:600; border:1px solid #e5e7eb; background:#fff; color:#6b7280; cursor:pointer; }
  .toggle-btn.active { background:#1d7fd6; color:#fff; border-color:#1d7fd6; }
  .school-dash { min-height:100vh; background:linear-gradient(#eef7ff,#fff); padding:40px; }
  .school-dash-header { text-align:center; margin-bottom:32px; }
  .school-dash-header h1 { color:#0f4f88; font-size:28px; margin:0 0 4px; }
  .school-dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:900px; margin:0 auto; }
  @media (max-width:700px) { .school-dash-grid { grid-template-columns:1fr; } }
  .school-panel { border-radius:16px; padding:24px; cursor:pointer; transition:all .2s; border:2px solid transparent; }
  .school-panel:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.1); }
  .school-panel.boys { background:#eff6ff; border-color:#bfdbfe; }
  .school-panel.boys:hover { border-color:#1d4ed8; }
  .school-panel.girls { background:#fdf2f8; border-color:#fbcfe8; }
  .school-panel.girls:hover { border-color:#be185d; }
  .school-panel-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .school-panel-icon { font-size:36px; }
  .school-panel-title { font-size:20px; font-weight:800; margin:0; }
  .school-panel.boys .school-panel-title { color:#1d4ed8; }
  .school-panel.girls .school-panel-title { color:#be185d; }
  .school-panel-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .school-stat-box { background:rgba(255,255,255,.7); border-radius:10px; padding:10px 12px; text-align:center; }
  .school-stat-box .num { font-size:22px; font-weight:800; display:block; }
  .school-stat-box .lbl { font-size:11px; color:#6b7280; font-weight:600; }
  .school-panel.boys .school-stat-box .num { color:#1d4ed8; }
  .school-panel.girls .school-stat-box .num { color:#be185d; }
  .school-enter-btn { display:block; width:100%; padding:10px; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer; text-align:center; }
  .school-panel.boys .school-enter-btn { background:#1d4ed8; color:#fff; }
  .school-panel.boys .school-enter-btn:hover { background:#1e40af; }
  .school-panel.girls .school-enter-btn { background:#be185d; color:#fff; }
  .school-panel.girls .school-enter-btn:hover { background:#9d174d; }
  .school-logout-link { text-align:center; margin-top:24px; }
  .school-logout-link a { color:#6b7280; font-size:13px; cursor:pointer; text-decoration:underline; }
  .school-badge { display:inline-block; padding:3px 12px; border-radius:999px; font-size:12px; font-weight:700; margin-right:8px; vertical-align:middle; }
  .school-badge.boys { background:#eff6ff; color:#1d4ed8; }
  .school-badge.girls { background:#fdf2f8; color:#be185d; }
  .tt-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .tt-tab { padding:8px 16px; border-radius:999px; border:1px solid #e5e7eb; background:#fff; color:#374151; font-size:14px; font-weight:700; cursor:pointer; transition:all .15s; }
  .tt-tab:hover { border-color:#1d7fd6; color:#1d7fd6; }
  .tt-tab.active { background:#1d7fd6; color:#fff; border-color:#1d7fd6; }
  .tt-row { display:flex; align-items:center; gap:14px; padding:12px 16px; }
  .tt-row.tt-empty { border-style:dashed; opacity:.85; }
  .tt-badge { min-width:118px; text-align:center; padding:6px 10px; border-radius:10px; background:#eff6ff; color:#1d4ed8; font-size:13px; font-weight:800; }
  .theme-girls .tt-badge { background:#fdf2f8; color:#be185d; }
  .tt-row.tt-empty .tt-badge { background:#f3f4f6; color:#9ca3af; }
  .tt-info { flex:1; min-width:0; }
  .tt-subject { font-size:15px; font-weight:800; color:#111827; }
  .tt-actions { display:flex; gap:6px; align-items:center; }
  .tt-add { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; background:#16a34a; color:#fff; font-size:18px; font-weight:800; }

  /* ===== واجهة المدير التنفيذية — التصميم الجديد ===== */
  .layout { --navy:#0f4678; --blue:#1672c4; --light:#f4f8fc; --line:#e4edf5; --text:#17324d; --muted:#7b8b9c; --green:#16a34a; --red:#ef4444; --orange:#f59e0b; --cyan:#06a6c7; --purple:#8b5cf6; }
  .layout .layout-body { max-width:1320px; }
  .layout .main { max-width:1320px; padding:18px 20px; }
  .layout .topbar { background:#fff; border-bottom:1px solid var(--line); box-shadow:0 1px 8px rgba(15,70,120,.07); }
  .layout .topbar-inner { max-width:1320px; padding:9px 20px; }
  .layout .topbar-brand h1 { color:var(--navy); font-size:16px; }
  .layout .topbar-logo { border-color:var(--navy); }
  .topbar-search { display:flex; align-items:center; gap:8px; background:var(--light); border:1px solid var(--line); border-radius:999px; padding:8px 14px; width:min(390px,100%); flex:0 1 390px; min-width:140px; }
  .topbar-search input { border:none; outline:none; background:transparent; font-family:inherit; font-size:13px; color:var(--text); width:100%; }
  .topbar-search input::placeholder { color:#9fb0c1; }
  .layout .topbar .notif-btn { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:#fff; display:inline-flex; align-items:center; justify-content:center; padding:0; font-size:16px; }
  .layout .sidebar { width:250px; background:linear-gradient(180deg,#123f6c 0%,#0d3154 100%); border-left:none; }
  .brand { text-align:center; padding:20px 10px 18px; border-bottom:1px solid rgba(255,255,255,.15); }
  .brand-mark { width:58px; height:58px; margin:0 auto 8px; border-radius:18px; background:rgba(255,255,255,.10); display:flex; align-items:center; justify-content:center; font-size:30px; }
  .brand h1 { margin:0; font-size:22px; font-weight:700; color:#fff; }
  .brand small { display:block; margin-top:3px; font-size:10px; letter-spacing:1.5px; opacity:.75; color:#fff; }
  .layout .sidebar nav.menu { padding:12px 10px; display:flex; flex-direction:column; gap:5px; }
  .layout .sidebar .nav-link { display:flex; align-items:center; gap:12px; min-height:44px; padding:10px 13px; border-radius:10px; color:rgba(255,255,255,.90); font-size:14px; font-weight:500; white-space:nowrap; }
  .layout .sidebar .nav-link:hover { background:rgba(255,255,255,.10); color:#fff; transform:translateX(-2px); }
  .layout .sidebar .nav-link.active { background:#2377bf; color:#fff; font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.14); }
  .menu-icon { width:24px; min-width:24px; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .group-title { color:rgba(255,255,255,.55); font-size:11px; font-weight:700; padding:13px 13px 2px; }
  .layout .sidebar .nav-link .msg-badge { background:#ef4444; margin-inline-start:auto; }
  .profile { display:flex; align-items:center; gap:10px; padding:11px; margin:14px 4px 2px; border:1px solid rgba(255,255,255,.35); border-radius:11px; background:rgba(255,255,255,.04); }
  .avatar { width:42px; height:42px; min-width:42px; border-radius:50%; background:#fff; color:#60758a; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .profile-info { min-width:0; }
  .profile-info strong { display:block; font-size:13px; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .profile-info span { display:block; margin-top:2px; font-size:11px; color:rgba(255,255,255,.70); }
  .layout .sidebar-widgets { border-top:1px solid rgba(255,255,255,.10); }
  .layout .sidebar-widgets .info-card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); border-top:2px solid var(--blue); color:#fff; }
  .layout .sidebar-widgets .msg-day-center { border-top:1px dashed rgba(255,255,255,.15); }
  .layout .sidebar-widgets .dash-welcome-label { color:#fff; }
  .layout .sidebar-widgets .msg-static { color:#eaf2fb; }
  .layout .sidebar-widgets .msg-sender { color:rgba(255,255,255,.55); }
  .layout .sidebar-widgets .muted { color:rgba(255,255,255,.55); }

  /* بطاقات لوحة المدير */
  .dash-hero { display:grid; grid-template-columns:1.6fr 1fr; gap:12px; margin-bottom:14px; }
  .dash-greet { background:linear-gradient(135deg,var(--light),#fff); border:1px solid var(--line); border-radius:16px; padding:16px 18px; display:flex; align-items:center; gap:14px; }
  .dash-greet-icon { width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg,var(--blue),var(--navy)); color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px -6px rgba(22,114,196,.5); flex-shrink:0; }
  .dash-greet-title { font-size:18px; font-weight:800; color:var(--text); margin:0; }
  .dash-greet-sub { font-size:12px; color:var(--muted); margin-top:3px; }
  .dash-status { border-radius:16px; padding:16px 18px; display:flex; align-items:center; gap:14px; border:1px solid #bbf7d0; background:linear-gradient(135deg,#f0fdf4,#fff); }
  .dash-status.warn { border-color:#fde68a; background:linear-gradient(135deg,#fffbeb,#fff); }
  .dash-status-icon { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; background:#dcfce7; flex-shrink:0; }
  .dash-status.warn .dash-status-icon { background:#fef3c7; }
  .dash-status-title { font-size:14px; font-weight:800; color:#166534; margin:0; }
  .dash-status.warn .dash-status-title { color:#92400e; }
  .dash-status-sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .dash-stats { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:14px; }
  .dash-stat { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 12px; text-align:center; transition:transform .12s, box-shadow .12s; }
  .dash-stat.clickable { cursor:pointer; }
  .dash-stat:hover { transform:translateY(-2px); box-shadow:0 8px 20px -10px rgba(15,70,120,.25); }
  .dash-stat-circle { width:44px; height:44px; margin:0 auto 8px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; box-shadow:0 4px 10px -4px rgba(15,70,120,.4); }
  .dash-stat-val { font-size:22px; font-weight:800; color:var(--text); margin:0; }
  .dash-stat-lbl { font-size:11.5px; color:var(--muted); font-weight:700; margin:2px 0 0; }
  .dash-stat-sub { font-size:10px; color:var(--muted); margin-top:2px; }
  .dash-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .dash-panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
  .dash-panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
  .dash-panel-title { font-size:14px; font-weight:800; color:var(--text); margin:0; display:flex; align-items:center; gap:7px; }
  .dash-panel-more { font-size:11.5px; color:var(--blue); font-weight:700; white-space:nowrap; }
  .dash-needs-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer; transition:background .1s; }
  .dash-needs-item:hover { background:var(--light); }
  .dash-needs-ico { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .dash-needs-txt { flex:1; min-width:0; }
  .dash-needs-name { font-size:12.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dash-needs-meta { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .dash-needs-num { font-size:15px; font-weight:800; flex-shrink:0; }
  .dash-activity-item { display:flex; align-items:center; gap:10px; padding:7px 6px; border-radius:10px; cursor:pointer; }
  .dash-activity-item:hover { background:var(--light); }
  .dash-activity-ico { width:38px; height:38px; border-radius:12px; background:var(--light); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .dash-activity-name { font-size:13px; font-weight:700; color:var(--text); }
  .dash-activity-meta { font-size:11px; color:var(--muted); margin-top:1px; }
  .dash-bottom { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px; }
  .dash-donut-wrap { display:flex; align-items:center; gap:16px; }
  .dash-donut { width:128px; height:128px; border-radius:50%; position:relative; flex-shrink:0; }
  .dash-donut::after { content:''; position:absolute; inset:22px; background:#fff; border-radius:50%; box-shadow:0 0 0 1px var(--line); }
  .dash-donut-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1; }
  .dash-donut-center b { font-size:20px; color:var(--text); }
  .dash-donut-center span { font-size:10px; color:var(--muted); }
  .dash-legend { display:flex; flex-direction:column; gap:7px; font-size:12px; color:var(--text); min-width:0; }
  .dash-legend .row { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .dash-legend .swatch { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .dash-legend b { margin-inline-start:auto; font-weight:800; }
  .dash-tabs { display:flex; gap:6px; background:var(--light); border-radius:10px; padding:4px; }
  .dash-tab { flex:1; border:none; background:transparent; border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:800; color:var(--muted); cursor:pointer; font-family:inherit; }
  .dash-tab.active { background:#fff; color:var(--navy); box-shadow:0 2px 6px rgba(15,70,120,.12); }
  .dash-leader-row { display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px dashed var(--line); }
  .dash-leader-row:last-child { border-bottom:none; }
  .dash-leader-medal { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
  .dash-leader-name { font-weight:700; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dash-leader-meta { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .dash-leader-pts { margin-inline-start:auto; font-weight:800; font-size:13px; flex-shrink:0; }
  .app-footer { background:#fff; border-top:1px solid var(--line); padding:10px 16px; text-align:center; font-size:11px; color:var(--muted); }

  .dash-activity-meta { font-size:11px; color:var(--muted); margin-top:1px; }
  .dash-bottom { display:grid; grid-template-columns:1fr 1.6fr; gap:12px; margin-bottom:14px; }
  .dash-mid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .dash-donut-wrap { display:flex; align-items:center; gap:16px; }
  .dash-donut { width:128px; height:128px; border-radius:50%; position:relative; flex-shrink:0; }
  .dash-donut::after { content:''; position:absolute; inset:22px; background:#fff; border-radius:50%; box-shadow:0 0 0 1px var(--line); }
  .dash-donut-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1; }
  .dash-donut-center b { font-size:20px; color:var(--text); }
  .dash-donut-center span { font-size:10px; color:var(--muted); }
  .act-flex { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .act-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .act-block { border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
  .dash-legend { display:flex; flex-direction:column; gap:7px; font-size:12px; color:var(--text); min-width:0; }
  .dash-legend .row { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .dash-legend .swatch { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .dash-legend b { margin-inline-start:auto; font-weight:800; }
  .att-card { padding:0; display:grid; grid-template-columns:1fr 1fr; }
  .att-group { padding:14px 16px 16px; min-width:0; }
  .att-group + .att-group { border-inline-start:1px solid var(--line); }
  .att-group-title { font-weight:800; font-size:13px; color:var(--text); margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  .att-flex { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .att-pct { display:flex; flex-direction:column; align-items:center; min-width:66px; cursor:pointer; }
  .att-pct b { font-size:26px; font-weight:800; color:#059669; line-height:1; }
  .att-pct span { font-size:10px; color:var(--muted); margin-top:3px; }
  .att-legend { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text); min-width:0; }
  .att-legend .row { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .att-legend .swatch { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .att-legend b { margin-inline-start:auto; font-weight:800; }
  .att-report-btn { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; border:none; background:transparent; color:#2563eb; font-size:12px; font-weight:700; cursor:pointer; padding:10px 16px; border-top:1px solid var(--line); font-family:inherit; grid-column:1 / -1; }
  .att-report-btn:hover { color:#1d4ed8; background:var(--light); }
  .dash-tabs { display:flex; gap:6px; background:var(--light); border-radius:10px; padding:4px; }
  .dash-tab { flex:1; border:none; background:transparent; border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:800; color:var(--muted); cursor:pointer; font-family:inherit; }
  .dash-tab.active { background:#fff; color:var(--navy); box-shadow:0 2px 6px rgba(15,70,120,.12); }
  .dash-leader-row { display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px dashed var(--line); }
  .dash-leader-row:last-child { border-bottom:none; }
  .dash-leader-medal { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
  .dash-leader-name { font-weight:700; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dash-leader-meta { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .dash-leader-pts { margin-inline-start:auto; font-weight:800; font-size:13px; flex-shrink:0; }
  .app-footer { background:#fff; border-top:1px solid var(--line); padding:10px 16px; text-align:center; font-size:11px; color:var(--muted); }
  @media (max-width:1180px){ .dash-stats { grid-template-columns:repeat(3,1fr); } .dash-bottom { grid-template-columns:1fr; } }
  @media (max-width:900px){ .topbar-search { display:none; } }
  @media (max-width:820px){ .dash-hero { grid-template-columns:1fr; } .dash-grid2 { grid-template-columns:1fr; } .dash-bottom { grid-template-columns:1fr; } .dash-mid { grid-template-columns:1fr; } }
  @media (max-width:700px){ .layout .main { padding:12px; } .dash-greet { flex-wrap:wrap; } .dash-status { flex-wrap:wrap; } .topbar-actions { gap:8px; } .topbar-brand p { display:none; } }
  @media (max-width:560px){ .dash-stats { grid-template-columns:repeat(2,1fr); } .att-card { grid-template-columns:1fr; } .att-group + .att-group { border-inline-start:none; border-top:1px solid var(--line); } .topbar-brand h1 { font-size:13px; } .topbar-logo { width:36px; height:36px; } .topbar-actions .btn-secondary { padding:6px 9px; font-size:12px; } .topbar-user-name { font-size:12px; } .topbar-user-role { font-size:10.5px; } .act-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (max-width:380px){ .topbar-brand h1 { font-size:12px; } .topbar-actions .topbar-user-block { display:none; } }
  .pw-wrap { position:relative; display:block; }
  .pw-wrap .pw-toggle { position:absolute; top:50%; inset-inline-end:8px; transform:translateY(-50%); border:none; background:transparent; cursor:pointer; font-size:16px; line-height:1; color:var(--muted); padding:4px; z-index:2; }
  .pw-wrap .pw-toggle:hover { color:var(--text); }
  .pw-wrap input.input { padding-inline-end:38px !important; }
</style>
</head>

      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «مشاركة» ⬆', 'في المتصفح (سفاري) أسفل الشاشة تجد زر المشاركة على شكل مربع مع سهم لأعلى — اضغط عليه.') +
      step('2', 'اختر «إضافة إلى الشاشة الرئيسية»', 'من القائمة المنبثقة ابحث عن خيار «إضافة إلى الشاشة الرئيسية» (Add to Home Screen) واضغط عليه.') +
      step('3', 'اضغط «إضافة»', 'سيُطلب منك تأكيد الاسم — اضغط «إضافة» أعلى اليمين، وستجد الأيقونة على شاشتك الرئيسية.') +
      '</div>';
  } else {
    html = '<div class="modal-head"><h3>📲 تثبيت نبراس على جهازك</h3><button class="modal-close" onclick="closeInstallGuide()">✕</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «تثبيت» أدناه', 'سيعرض المتصفح نافذة تأكيد التثبيت.') +
      step('2', 'اضغط «تثبيت» في النافذة', 'ستضاف أيقونة نبراس إلى الشاشة الرئيسية.') +
      '<button class="btn-primary" style="margin-top:4px" onclick="doInstallApp()">⬇ تثبيت التطبيق الآن</button>' +
      '</div>';
  }
  overlay.innerHTML = '<div class="modal-box" style="max-width:460px">' + html + '</div>';
  overlay.onclick = function(e){ if(e.target === overlay) closeInstallGuide(); };
  document.body.appendChild(overlay);
}
function closeInstallGuide(){
  var ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
}
function maybeShowInstallHint(force){
  try{
    if(!force && localStorage.getItem('nibrasInstallHintDismissed')) return;
    var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(standalone) return;
    if(!document.body){ setTimeout(function(){ maybeShowInstallHint(force); }, 300); return; }
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isAndroid = /Android/.test(navigator.userAgent);
    var canInstall = __deferredInstallPrompt || isIOS || isAndroid;
    if(!canInstall) return;
    removeInstallHint();
    var d = document.createElement('div');
    d.id = 'installHintBar';
    d.className = 'install-hint';
    var tip = isIOS
      ? 'اضغط زر «مشاركة» ⬆ في المتصفح ثم «إضافة إلى الشاشة الرئيسية»'
      : 'ثبّت التطبيق على جهازك لفتحه من الشاشة الرئيسية';
    d.innerHTML = '<span style="font-size:20px">📲</span><span>' + tip + '</span><button class="btn-primary" style="padding:6px 14px;font-size:13px;flex-shrink:0" onclick="' + (isIOS ? 'openInstallGuide()' : 'doInstallApp()') + '">' + (isIOS ? 'كيف أثبّت؟' : 'تثبيت') + '</button><button class="close" title="إغلاق" onclick="dismissInstallHint()">✕</button>';
    document.body.appendChild(d);
  }catch(e){}
}
setTimeout(function(){ maybeShowInstallHint(false); }, 1200);
</script>
</body>
</html>

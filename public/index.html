  .app-footer { background:#fff; border-top:1px solid var(--line); padding:10px 16px; text-align:center; font-size:11px; color:var(--muted); }
  @media (max-width:1180px){ .dash-stats { grid-template-columns:repeat(3,1fr); } .dash-bottom { grid-template-columns:1fr; } }
  @media (max-width:900px){ .topbar-search { display:none; } }
  @media (max-width:820px){ .dash-hero { grid-template-columns:1fr; } .dash-grid2 { grid-template-columns:1fr; } .dash-bottom { grid-template-columns:1fr; } .dash-mid { grid-template-columns:1fr; } }
  @media (max-width:700px){ .layout .main { padding:12px; } .dash-greet { flex-wrap:wrap; } .dash-status { flex-wrap:wrap; } .topbar-actions { gap:8px; } .topbar-brand p { display:none; } }
  @media (max-width:560px){ .dash-stats { grid-template-columns:repeat(2,1fr); } .att-card { grid-template-columns:1fr; } .att-group + .att-group { border-inline-start:none; border-top:1px solid var(--line); } .topbar-brand h1 { font-size:13px; } .topbar-logo { width:36px; height:36px; } .topbar-actions .btn-secondary { padding:6px 9px; font-size:12px; } .topbar-user-name { font-size:12px; } .topbar-user-role { font-size:10.5px; } .act-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }

<body>
<div id="app"></div>
<div class="wm" aria-hidden="true">© 2026 ناصر العتيبي — جميع الحقوق محفوظة</div>

<script>
/* ============ طبقة المصادقة والجلسة (خادم آمن) ============ */
const LOCAL_SESSION_KEY = 'nibras_session_v1';
const SCHOOL_KEY = 'nibras_school_v1';
const ANNOUNCEMENT_KEY = s => 'nibras_announcement_'+s+'_v1';
const ANNOUNCEMENT_SENDER_KEY = s => 'nibras_announcement_sender_'+s+'_v1';
function firstNameOf(name){ return String(name || '').trim().split(/\s+/)[0] || ''; }
const ADMIN_MSGS_KEY = s => 'nibras_adminmsgs_'+s+'_v1';
const SESS_MIRROR_KEY = 'nibras_secure_session_v1';
const AUTH_API = '/api/auth/';
const SYNC_API = '/api/db/';
const SETTINGS_API = '/api/settings/';
const SYNC_INTERVAL = 20000;
const __origSetItem = localStorage.setItem.bind(localStorage);
let __sessionUser = null; // المستخدم الحالي (من الخادم) — المرجع الوحيد للصلاحيات
let __syncTimers = {};

// وضع الخادم = الجلسة الحقيقية وبيانات قاعدة البيانات؛ وضع العرض/المحلي = نسخة المتصفح فقط
function __serverEnabled(){ return !DEMO_MODE && location.protocol.indexOf('http') === 0; }
// مرآة غير موثوقة (واجهة فقط) للاحتفاظ بالمستخدم عند إعادة التحميل حتى يرد الخادم
function __mirrorSet(u){ try{ sessionStorage.setItem(SESS_MIRROR_KEY, JSON.stringify(u)); }catch(e){} }
function __mirrorGet(){ try{ const j = JSON.parse(sessionStorage.getItem(SESS_MIRROR_KEY) || 'null'); return j || null; }catch(e){ return null; } }
function __mirrorClear(){ try{ sessionStorage.removeItem(SESS_MIRROR_KEY); }catch(e){} }

async function __api(method, path, body){
  const opt = { method, headers: {} };
  if(body){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const resp = await fetch(AUTH_API + path, opt);
  let j = null;
  try{ j = await resp.json(); }catch(e){}
  return { status: resp.status, ok: resp.ok, j };
}
function __handleAuthError(resp){
  if(resp && resp.status === 401){
    __sessionUser = null; __mirrorClear();
    if(location.hash !== '#/login') location.hash = '#/login';
  }
}
async function __restoreSession(){
  if(!__serverEnabled()) return false;
  try{
    const r = await __api('GET', 'me');
    if(r.status === 200 && r.j && r.j.user){ __sessionUser = r.j.user; __mirrorSet(r.j.user); return true; }
    __handleAuthError(r);
  }catch(e){}
  return false;
}

/* ===== إعدادات مشتركة (بداية العام الدراسي) ===== */
const __schoolSettingsCache = {};
async function __getSchoolSettings(school){
  if(!__serverEnabled()) return {};
  if(__schoolSettingsCache[school]) return __schoolSettingsCache[school];
  try{
    const resp = await fetch(SETTINGS_API + school);
    if(resp.status === 401){ __handleAuthError(resp); return {}; }
    if(!resp.ok) return {};
    const j = await resp.json();
    const data = (j && j.data) ? j.data : {};
    __schoolSettingsCache[school] = data;
    return data;
  }catch(e){ return {}; }
}
async function __putSchoolSettings(school, data){
  if(!__serverEnabled()) return false;
  try{
    const resp = await fetch(SETTINGS_API + school, { method:'PUT', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ data }) });
    if(resp.status === 200){ __schoolSettingsCache[school] = data; return true; }
  }catch(e){}
  return false;
}

/* ============ مزامنة الخادم (جلسة آمنة — لا SYNC_KEY) ============ */
function __syncEnabled(){ return !DEMO_MODE && location.protocol.indexOf('http') === 0; }
function __syncTS(obj){ return (obj && typeof obj === 'object' && obj._ts) || 0; }
/* حالة الرفع المعلّق لكل قسم: تمنع أن تسحب نسخة الخادم الأقدم فتختفي تعديلاتٌ لم تُرفع بعد */
const __pushPending = {};
function __uiDirty(){ try { return !!document.querySelector('.modal-overlay') || (document.getElementById('noteForm') && document.getElementById('noteForm').style.display !== 'none'); } catch(e){ return false; } }
function __pushState(school){
  return (__pushPending[school] = __pushPending[school] || { attempts:0, lastFail:0, running:false });
}
function __uiToast(txt, isErr){
  try{
    let el = document.getElementById('__syncToast');
    if(!el){
      el = document.createElement('div');
      el.id = '__syncToast';
      el.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99999;background:#065f46;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92%;text-align:center;display:none;font-family:inherit';
      document.body.appendChild(el);
    }
    el.textContent = txt;
    el.style.background = isErr ? '#b91c1c' : '#065f46';
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 6500);
  }catch(e){}
}
function __syncSchedule(school, ms){
  if(!__syncEnabled()) return;
  clearTimeout(__syncTimers[school]);
  __syncTimers[school] = setTimeout(() => __syncPush(school), (ms === undefined) ? 700 : ms);
}
async function __syncPush(school){
  if(!__syncEnabled()) return;
  const key = 'nibras_'+school+'_db_v1';
  const pendKey = 'nibras_'+school+'_pending_v1';
  const st = __pushState(school);
  if(st.running) return;
  st.running = true;
  try{
    let raw = null;
    try{ raw = localStorage.getItem(key); }catch(e){}
    if(!raw) return;
    let obj = null;
    try{ obj = JSON.parse(raw); }catch(e){}
    if(!obj) return;
    // إذا وُجدت نسخة احتياطية لتعديلات لم تُرفع بعد (فشل سابق)، نفضّلها إن كانت أحدث
    // حتى لا تُفقد تعديلات المعلم إذا أُغلِق التطبيق قبل نجاح الرفع ثم أعيد فتحه.
    try{
      const pendRaw = localStorage.getItem(pendKey);
      if(pendRaw){
        const pobj = JSON.parse(pendRaw);
        if(pobj && __syncTS(pobj) > __syncTS(obj)) obj = pobj;
      }
    }catch(e){}
    // حماية: لا ندفع بذرة فارغة (متصفح جديد بلا طلاب/فصول) لئلا تمحو بيانات القسم المشتركة.
    // لكن بدل تجاهل الحفظ كلياً (فيعتقد المعلم أن تعديله «نُقلّع» ولم يُحفظ)، نجلب نسخة الخادم
    // وندمج عليها تعديلات هذا الجهاز (الجدول/الغياب) ثم ندفعها.
    const isEmptySeed = Array.isArray(obj.classes) && obj.classes.length === 0 && Array.isArray(obj.students) && obj.students.length === 0;
    if(isEmptySeed){
      try{
        const resp = await fetch(SYNC_API + school);
        if(resp.status === 401){ __handleAuthError(resp); return; }
        if(!resp.ok) return;
        const j = await resp.json();
        const serverHasData = j && j.data && ((j.data.students && j.data.students.length > 0) || (j.data.classes && j.data.classes.length > 0));
        if(serverHasData){
          const sd = JSON.parse(JSON.stringify(j.data));
          sd.timetable = Object.assign({}, sd.timetable);
          for(const tid in obj.timetable) sd.timetable[tid] = JSON.parse(JSON.stringify(obj.timetable[tid]));
          if(Array.isArray(obj.attendance) && obj.attendance.length){
            sd.attendance = Array.isArray(sd.attendance) ? sd.attendance.slice() : [];
            for(const rec of obj.attendance){
              if(!sd.attendance.some(x => x.studentId === rec.studentId && x.date === rec.date)) sd.attendance.push(rec);
            }
          }
          obj = sd;
          try{ __origSetItem(key, JSON.stringify(obj)); }catch(e){}
        }
      }catch(e){}
      const stillEmpty = Array.isArray(obj.classes) && obj.classes.length === 0 && Array.isArray(obj.students) && obj.students.length === 0;
      if(stillEmpty) return;
    }
    let attempt = 0;
    const respOf = await (async () => {
      for(; attempt < 3; attempt++){
        let resp = null;
        try{
          resp = await fetch(SYNC_API + school, {
            method:'PUT',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ ts: __syncTS(obj) || Date.now(), data: obj })
          });
        }catch(e){ resp = null; }
        if(!resp){ await new Promise(res => setTimeout(res, 1000 * (attempt + 1))); continue; }
        if(resp.status === 401 || resp.status === 403){ __handleAuthError(resp); return null; }
        if(resp.status === 200) return resp;
        if(resp.status === 429){ await new Promise(res => setTimeout(res, 2000 * (attempt + 1))); continue; }
        await new Promise(res => setTimeout(res, 1000 * (attempt + 1)));
      }
      return null;
    })();
    if(respOf){
      try{
        const j = await respOf.json();
        if(j && j.ts && obj && typeof obj === 'object') obj._ts = j.ts;
      }catch(e){}
      try{ __origSetItem(key, JSON.stringify(obj)); }catch(e){}
      try{ localStorage.removeItem(pendKey); }catch(e){}
      const recovered = st.attempts > 0;
      st.attempts = 0;
      st.lastFail = 0;
      if(recovered) __uiToast('✅ عاد الاتصال — حُفظ ما لم يكن قد رُفع.');
      return;
    }
    // فشل الرفع نهائياً: نحتفظ بالتعديلات في نسخة احتياطية محلية ونعيد المحاولة لاحقاً
    st.attempts++;
    st.lastFail = Date.now();
    try{ localStorage.setItem(pendKey, JSON.stringify(obj)); }catch(e){}
    __syncTimers[school] = setTimeout(() => __syncPush(school), 15000);
    __uiToast('⚠️ تعذّر رفع حفظك للخادم الآن — سأعيد المحاولة تلقائياً ولا تختفي بياناتك.', true);
  }catch(e){} finally {
    st.running = false;
  }
}
async function __syncPull(school){
  if(!__syncEnabled()) return;
  const st = __pushState(school);
  // تعديلات لم تُرفع بعد (فشل رفع سابق أو جارٍ الرفع): لا تكتب فوقها نسخة الخادم الأقدم
  // — نعيد محاولة الرفع فوراً بدل محوها، حتى لا «يختفي» حفظ المعلم بعد إعادة الفتح.
  const hasPending = (st && st.lastFail > 0 && (Date.now() - st.lastFail) < 60000);
  if(hasPending){
    __syncSchedule(school, 0);
    return;
  }
  try{
    const resid = await fetch(SYNC_API + school);
    if(resid.status === 401){ __handleAuthError(resid); return; }
    if(!resid.ok) return;
    const j = await resid.json();
    if(!j || !j.data || !j.ts) return;
    const key = 'nibras_'+school+'_db_v1';
    const pendKey = 'nibras_'+school+'_pending_v1';
    let local = null;
    try{ local = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){}
    // يوجد احتياطي تعديلات لم تُرفع: لا نبدّل نسخة الجهاز ببيانات الخادم (قد تمسحها)؛
    // ندفع الاحتياطي أولاً ثم نعود للجلب لاحقاً.
    let pendExists = false;
    try{ pendExists = !!localStorage.getItem(pendKey); }catch(e){}
    const localIsEmptySeed = local && Array.isArray(local.classes) && local.classes.length === 0 && Array.isArray(local.students) && local.students.length === 0;
    const serverHasData = (j.data.students && j.data.students.length > 0) || (j.data.classes && j.data.classes.length > 0);
    if(pendExists){
      __syncSchedule(school, 0);
      return;
    }
    const server = j.data;
    // دمج آمن: نبدأ من نسخة الخادم (مصدر الحقيقة لأحدث بيانات الزملاء/المشرفين) ونحفظ فوقها
    // تعديلات هذا الجهاز المحلية التي لم تصل بعد للخادم (ملاحظات/غياب جديدة بوقت أحدث) —
    // حتى لا يختفي عملُ المعلم ولا تغيب عنه بيانات زملائه في الفصول المشتركة.
    if(!local || localIsEmptySeed || !(serverHasData)){
      __origSetItem(key, JSON.stringify(server));
    } else {
      const merged = JSON.parse(JSON.stringify(server));
      merged.timetable = Object.assign({}, merged.timetable);
      if(local.timetable) for(const tid in local.timetable) merged.timetable[tid] = JSON.parse(JSON.stringify(local.timetable[tid]));
      // غياب محلي جديد (أحدث من نظيره في الخادم) يحفظ فوقه
      if(Array.isArray(local.attendance)){
        merged.attendance = Array.isArray(merged.attendance) ? merged.attendance.slice() : [];
        const tOf = r => (r && typeof r === 'object' && typeof r._t === 'number') ? r._t : 0;
        const bySD = new Map(merged.attendance.map(r => [ (r.studentId||'')+'|'+(r.date||''), r ]));
        for(const r of local.attendance){
          const sd = (r.studentId||'')+'|'+(r.date||'');
          const ex = bySD.get(sd);
          if(!ex) { bySD.set(sd, r); merged.attendance.push(r); }
          else if(tOf(r) > tOf(ex)){ merged.attendance = merged.attendance.map(x => (x===ex)?r:x); bySD.set(sd, r); }
        }
      }
      // ملاحظات محلية جديدة (لم تُرفع) نضمن بقاءها
      if(Array.isArray(local.notes)){
        merged.notes = Array.isArray(merged.notes) ? merged.notes.slice() : [];
        const nMap = new Map(merged.notes.map(n => [n.id, n]));
        for(const n of local.notes){ if(!nMap.has(n.id)){ nMap.set(n.id,n); merged.notes.push(n); } }
      }
      merged._ts = Math.max(__syncTS(server), __syncTS(local), Date.now());
      __origSetItem(key, JSON.stringify(merged));
    }
  }catch(e){}
}
async function syncPullAll(){
  if(!__serverEnabled()) return;
  const user = currentUser();
  if(!user) return;
  const schools = user.role === 'ADMIN' ? ['BOYS','GIRLS'] : [user.school];
  await Promise.all(schools.map(s => __syncPull(s)));
  await Promise.all(schools.filter(Boolean).map(s => __getSchoolSettings(s)));
}
// إعادة جلب نسخة القسم من الخادم بعد أي عملية حساب (أول دخول، إنشاء مستخدم، إعادة تعيين...)
async function __refreshSchool(school){
  if(!__serverEnabled() || !school) return;
  try{
    const resp = await fetch(SYNC_API + school);
    if(!resp.ok) return;
    const j = await resp.json();
    if(j && j.data){
      const key = 'nibras_'+school+'_db_v1';
      __origSetItem(key, JSON.stringify(j.data));
    }
  }catch(e){}
}
// غلاف حفظ: كل كتابة لقاعدة بيانات أي قسم تُختم بزمن وتُرفع تلقائياً — وفي وضع الخادم تُحذف بيانات الاعتماد من النسخة المحلية
localStorage.setItem = function(k, v){
  const m = /^nibras_(BOYS|GIRLS)_db_v1$/.exec(k);
  if(m && __syncEnabled()){
    try{
      const obj = JSON.parse(v);
      if(obj && typeof obj === 'object'){
        obj._ts = Date.now();
        if(__serverEnabled() && Array.isArray(obj.users)){
          obj.users.forEach(u => { ['password','secret','initialSecret','resetCode','resetExpires'].forEach(f => delete u[f]); });
        }
        v = JSON.stringify(obj);
      }
    }catch(e){}
    __origSetItem(k, v);
    __syncSchedule(m[1]);
    return;
  }
  __origSetItem(k, v);
};

/* ============ وضع التشغيل ============ */
// النسخة الحقيقية (هذا الملف): DEMO_MODE=false تحفظ فعلياً في المتصفح — والنسخة التجريبية تُبنى منه عبر build_demo.js (تدمج DEMO_SEED وتفعّل DEMO_MODE)
const DEMO_MODE = false; // true = نسخة العرض التجريبي
const DEMO_SEED = null;  // { BOYS:{...}, GIRLS:{...} } — يُملأ في نسخة العرض التجريبي فقط
const DEMO_ANCHOR = null; // تاريخ مرجعي (آخر يوم دراسة عند البناء) لتحديث تواريخ العرض التجريبي تلقائياً
const PERSIST_FIRST_SEED = true; // أول تشغيل فقط: زرع البيانات المتوفرة (DEMO_SEED إن وُجد) في التخزين الحقيقي
function __demoYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function __demoIsSchool(d){ const w = d.getDay(); return w>=1 && w<=5; }
function __demoShiftDate(ymd, delta){
  const d = new Date(ymd+'T12:00:00');
  d.setDate(d.getDate()+delta);
  while(!__demoIsSchool(d)) d.setDate(d.getDate()+1);
  return __demoYmd(d);
}
function __demoShiftIso(isoStr, delta){
  const d = new Date(isoStr);
  if(isNaN(d.getTime())) return isoStr;
  d.setDate(d.getDate()+delta);
  return d.toISOString();
}
function __demoResolve(obj, delta){
  if(Array.isArray(obj)){ obj.forEach(x => __demoResolve(x, delta)); return; }
  if(obj && typeof obj === 'object'){
    Object.keys(obj).forEach(k => {
      const v = obj[k];
      if(typeof v === 'string'){
        if(/^\d{4}-\d{2}-\d{2}$/.test(v)) obj[k] = __demoShiftDate(v, delta);
        else if(/^\d{4}-\d{2}-\d{2}T/.test(v)) obj[k] = __demoShiftIso(v, delta);
      } else if(v && typeof v === 'object'){ __demoResolve(v, delta); }
    });
  }
}
function seedPersistentData(){
  // زرع البيانات المتوفرة في التخزين الحقيقي للقسمين (مرة واحدة عند أول تشغيل أو بعد مسح البيانات)
  let __delta = 0;
  if(DEMO_ANCHOR){
    const __ref = new Date(DEMO_ANCHOR+'T12:00:00');
    if(!isNaN(__ref.getTime())){
      let __now = new Date();
      while(!__demoIsSchool(__now)) __now.setDate(__now.getDate()-1);
      __delta = Math.round((__now - __ref)/86400000);
    }
  }
  Object.keys(DEMO_SEED || {}).forEach(school => {
    const key = 'nibras_'+school+'_db_v1';
    if(!localStorage.getItem(key)){
      const d = JSON.parse(JSON.stringify(DEMO_SEED[school]));
      if(__delta !== 0) __demoResolve(d, __delta);
      localStorage.setItem(key, JSON.stringify(d));
    }
  });
}

/* تنظيف تلقائي: إزالة حسابات المعلمين المكررة بالاسم (يبقى الحساب الرسمي @nibras.local أو صاحب الفصول) مع دمج فصوله وجدوله وملاحظاته — يعمل في النسخ المحلية فقط */
function __normName(s){ return String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim(); }
function dedupeTeacherAccounts(){
  if(__serverEnabled()) return;
  let changedAny = false;
  ['BOYS','GIRLS'].forEach(school => {
    const key = 'nibras_'+school+'_db_v1';
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){}
    if(!d || !Array.isArray(d.users)) return;
    const groups = {};
    (d.users||[]).forEach(u => { if(u && u.role === 'TEACHER'){ const n = __normName(u.name); (groups[n] = groups[n] || []).push(u); } });
    const dupNames = Object.keys(groups).filter(n => groups[n].length > 1);
    if(!dupNames.length) return;
    const removed = [];
    dupNames.forEach(n => {
      const list = groups[n];
      const score = u =>
        (u.email && /@nibras\.local$/i.test(u.email) ? 4 : 0) +
        (u.active !== false ? 2 : 0) +
        ((d.classes||[]).some(c => (c.teacherIds||[]).includes(u.id)) ? 3 : 0) +
        ((d.timetable||{})[u.id] ? 2 : 0) +
        ((d.notes||[]).some(x => x.createdBy === u.id) ? 1 : 0);
      list.sort((a,b) => (score(b)-score(a)) || (a.id < b.id ? 1 : -1));
      const keep = list[0];
      list.slice(1).forEach(dup => {
        (d.classes||[]).forEach(c => {
          if(!Array.isArray(c.teacherIds)) return;
          const before = c.teacherIds;
          c.teacherIds = before.map(t => t === dup.id ? keep.id : t);
          if(c.teacherIds.some((t,i) => t === keep.id && before[i] === dup.id)) c.teacherIds = [...new Set(c.teacherIds)];
        });
        if(d.timetable && d.timetable[dup.id]){
          d.timetable[keep.id] = d.timetable[keep.id] || {};
          for(const day of Object.keys(d.timetable[dup.id])) d.timetable[keep.id][day] = Object.assign(d.timetable[keep.id][day] || {}, d.timetable[dup.id][day]);
          delete d.timetable[dup.id];
        }
        (d.notes||[]).forEach(x => { if(x.createdBy === dup.id) x.createdBy = keep.id; });
        removed.push(dup.id);
      });
    });
    if(!removed.length) return;
    d.users = d.users.filter(u => !removed.includes(u.id));
    __origSetItem(key, JSON.stringify(d));
    changedAny = true;
  });
  return changedAny;
}
if(!__serverEnabled()) dedupeTeacherAccounts();

function attendancePoints(status, lateMins){
  if(status === 'ABSENT') return -2; // الغياب
  if(status === 'LATE'){
    var m = parseInt(lateMins, 10) || 0;
    if(m <= 15) return -1;
    if(m <= 30) return -2;
    if(m <= 60) return -3;
    return -4;
  }
  return 0;
}

/* تحميل بيانات قسم محدد دون تغيير القسم النشط (للمدير: رؤية القسمين معًا) */
function loadSchoolDB(school){
  const oldKey = localStorage.getItem(SCHOOL_KEY);
  localStorage.setItem(SCHOOL_KEY, school);
  const d = loadDB();
  if(oldKey) localStorage.setItem(SCHOOL_KEY, oldKey); else localStorage.removeItem(SCHOOL_KEY);
  return d;
}
function loadDB(){
  let raw = localStorage.getItem(dbKey());
  if(!raw){ const d = seedDB(); saveDB(d); return d; }
  const d = JSON.parse(raw);
  // ترقية: تحويل teacherId المفرد إلى teacherIds متعدد (عدة معلمين لكل فصل)
  if(Array.isArray(d.classes)){
    d.classes.forEach(c => {
      if(!Array.isArray(c.teacherIds)){
        c.teacherIds = c.teacherId ? [c.teacherId] : [];
        delete c.teacherId;
      }
    });
  }
  // تنظيف تلقائي: سجل حضور واحد لكل طالب في اليوم (حذف المكرر)
  let cleaned = false;
  if(Array.isArray(d.attendance) && d.attendance.length > 1){
    const seen = new Set();
    const uniq = [];
    d.attendance.forEach(a => {
      const key = a.studentId + '|' + a.date;
      if(seen.has(key)){ cleaned = true; return; }
      seen.add(key); uniq.push(a);
    });
    if(cleaned) d.attendance = uniq;
  }
  // تنظيف تلقائي: حذف كل الإدخالات في أيام العطلة (الأحد والسبت) — الدراسة الاثنين-الجمعة فقط
  if(Array.isArray(d.attendance)) d.attendance = d.attendance.filter(a => isSchoolDay(a.date));
  if(Array.isArray(d.users)){
    d.users.forEach(u => {
      if(Array.isArray(u.absences)) u.absences = u.absences.filter(isSchoolDay);
      if(Array.isArray(u.markedLate)) u.markedLate = u.markedLate.filter(isSchoolDay);
      if(u.lateMinutes && typeof u.lateMinutes === 'object'){
        Object.keys(u.lateMinutes).forEach(k => { if(!isSchoolDay(k)) delete u.lateMinutes[k]; });
      }
      if(u.lateType && typeof u.lateType === 'object'){
        Object.keys(u.lateType).forEach(k => { if(!isSchoolDay(k)) delete u.lateType[k]; });
      }
    });
  }
  if(Array.isArray(d.students)){
    d.students.forEach(s => {
      if(s.lateMinutes && typeof s.lateMinutes === 'object'){
        Object.keys(s.lateMinutes).forEach(k => { if(!isSchoolDay(k)) delete s.lateMinutes[k]; });
      }
      if(s.lateType && typeof s.lateType === 'object'){
        Object.keys(s.lateType).forEach(k => { if(!isSchoolDay(k)) delete s.lateType[k]; });
      }
    });
  }
  // تنظيف تلقائي: ملاحظات متطابقة مكررة خلال دقيقتين (ضغط مزدوج على زر الحفظ)
  if(Array.isArray(d.notes) && d.notes.length > 1){
    const seenNotes = new Map();
    const uniqNotes = [];
    d.notes.forEach(n => {
      const key = n.studentId + '|' + n.type + '|' + n.category + '|' + (n.description||'') + '|' + n.createdBy + '|' + (n.points ?? '');
      const t = n.createdAt ? new Date(n.createdAt).getTime() : 0;
      const prev = seenNotes.get(key);
      if(prev !== undefined && Math.abs(t - prev) < 120000){ cleaned = true; return; }
      seenNotes.set(key, prev !== undefined ? Math.min(prev, t) : t);
      uniqNotes.push(n);
    });
    if(cleaned) d.notes = uniqNotes;
  }
  // تنظيف تلقائي: بيانات دخول المعلمين — لا رقم سري؛ من لا كلمة مرور له يُجبر على تعيينها عند أول دخول
  if(Array.isArray(d.users)){
    d.users.forEach(u => {
      if(u.role === 'TEACHER'){
        if(u.whatsapp === undefined){ u.whatsapp = ''; cleaned = true; }
        if(u.email === undefined && !u.email){ u.email = ''; cleaned = true; }
        if(u.secret !== undefined || u.initialSecret !== undefined){ delete u.secret; delete u.initialSecret; cleaned = true; }
        if(!u.password){ u.firstLogin = true; cleaned = true; }
      }
    });
  }
  // ترقية: بلاغات الصيانة
  if(!Array.isArray(d.maintenance)){ d.maintenance = []; cleaned = true; }
  // أسافين الحذف للتكليفات: لا تُعرض المحذوفة في أي شاشة، لكن نُبقيها في التخزين المحلي
  // كما هي (دون إعادة حفظ) حتى يرفعها المتصفح للخادم وتنشر الحذف فعلياً.
  if(Array.isArray(d.assignments)){
    d.assignments = d.assignments.filter(a => !(a && a.deleted));
  }
  if(cleaned) saveDB(d);
  return d;
}
function saveDB(d){
  if(DEMO_MODE && !window.__demoLSOverridden) return; // حماية احتياطية: لا حفظ في نسخة العرض
  localStorage.setItem(dbKey(), JSON.stringify(d));
}

function currentUser(){
  if(__serverEnabled()){
    if(__sessionUser) return __sessionUser;
    const u = __mirrorGet();
    return (u && u.active !== false) ? u : null;
  }
  // النسخة المحلية (عرض/ملف مباشر)
  const id = localStorage.getItem(LOCAL_SESSION_KEY);
  if(!id) return null;
  const school = getActiveSchool();
  if(school){
    const d = loadDB();
    const u = d.users.find(u => u.id === id && u.active);
    if(u) return u;
  }
  for(const s of ['BOYS','GIRLS']){
    if(s === school) continue;
    localStorage.setItem(SCHOOL_KEY, s);
    const d = loadDB();
    const u = d.users.find(u => u.id === id && u.active);
    if(u) return u;
  }
  return null;
}
async function login(login, password){
  if(__serverEnabled()){
    try{
      const r = await __api('POST', 'login', { login, password });
      if(r.status === 200 && r.j && r.j.user){
        __sessionUser = r.j.user;
        __mirrorSet(r.j.user);
        if(r.j.user.role === 'ADMIN'){
          localStorage.removeItem(SCHOOL_KEY);
        } else {
          localStorage.setItem(SCHOOL_KEY, r.j.user.school);
        }
        return { ok:true };
      }
      if(r.status === 429) return { ok:false, error:'rate_limited' };
      if(r.status === 403 && r.j && r.j.error === 'not_granted') return { ok:false, error:'not_granted' };
      return { ok:false };
    }catch(e){}
    return { ok:false };
  }
  // النسخة المحلية
  const SCHOOLS = ['BOYS','GIRLS'];
  for(const s of SCHOOLS){
    localStorage.setItem(SCHOOL_KEY, s);
    const d = loadDB();
    const l = login.trim().toLowerCase();
    const u = d.users.find(u => ((u.username && u.username.toLowerCase() === l) || u.email === l) && u.password === password && u.active);
    if(u){
      u.lastLogin = new Date().toISOString();
      u.loginCount = (u.loginCount || 0) + 1;
      u.loginHistory = u.loginHistory || [];
      u.loginHistory.push(new Date().toISOString());
      if(u.loginHistory.length > 300) u.loginHistory = u.loginHistory.slice(-300);
      saveDB(d);
      localStorage.setItem(LOCAL_SESSION_KEY, u.id);
      if(u.role === 'ADMIN'){
        localStorage.removeItem(SCHOOL_KEY);
      } else {
        localStorage.setItem(SCHOOL_KEY, s);
      }
      return { ok:true };
    }
  }
  return { ok:false };
}
function logout(){
  if(__serverEnabled()){
    fetch(AUTH_API + 'logout', { method:'POST' }).catch(() => {});
    __sessionUser = null;
    __mirrorClear();
    localStorage.removeItem(SCHOOL_KEY);
    // الخادم هو مصدر البيانات: لا تُترك نسخة من بيانات المدرسة في المتصفح بعد الخروج
    ['BOYS','GIRLS'].forEach(s => { try{ localStorage.removeItem(dbKeyFor(s)); }catch(e){} });
    location.hash = '#/login';
    renderApp();

  }
  const user = currentUser();

  location.hash = '#/login';
  renderApp();
}

function getClassesSorted(){
  const d = loadDB();
  const user = currentUser();
  let classes = d.classes;
  // المعلم يرى فقط الفصول المسندة إليه (المدير والوكيل يريان الكل)
  if(user && !isManager(user)){
    classes = classes.filter(c => (c.teacherIds||[]).includes(user.id));
  }
  return classes.slice().sort((a,b) => {
    const ga = gradeById(a.gradeId), gb = gradeById(b.gradeId);
    return ((ga?.order??0) - (gb?.order??0)) || a.name.localeCompare(b.name,'ar');
  });
}
function getVisibleStudents(){
  const d = loadDB();
  const user = currentUser();
  let students = d.students.filter(s => s.active);
  if(user && !isManager(user)){
    const classIds = getClassesSorted().map(c => c.id);
    students = students.filter(s => s.classId && classIds.includes(s.classId));
  }
  return students.sort((a,b) => a.fullName.localeCompare(b.fullName,'ar'));
}

function __togglePw(btn){
  const wrap = btn.closest('.pw-wrap');
  if(!wrap) return;

  if(!input) return;

function setupPasswordToggles(){
  const scan = (el) => {
    if(!el || !el.querySelectorAll) return;
    el.querySelectorAll('input[type="password"]').forEach((inp) => {
      if(inp.closest('.pw-wrap')) return;
      const wrap = document.createElement('span');
      wrap.className = 'pw-wrap';
      inp.parentNode.insertBefore(wrap, inp);
      wrap.appendChild(inp);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pw-toggle';
      btn.textContent = '👁';
      btn.setAttribute('aria-label', 'إظهار/إخفاء كلمة المرور');
      btn.setAttribute('tabindex', '-1');
      btn.onclick = function(e){ e.preventDefault(); e.stopPropagation(); __togglePw(this); };
      wrap.appendChild(btn);
    });
  };
  scan(document.body);
  if(window.__pwObserver) return;
  try{
    window.__pwObserver = new MutationObserver((muts) => {
      for(const m of muts){
        if(m.type === 'childList'){
          for(const n of m.addedNodes){ if(n.nodeType === 1) scan(n); }
        }
      }
    });
    window.__pwObserver.observe(document.body, { childList:true, subtree:true });
  }catch(e){}
}

const maleToFemaleFirst = {

  'وائل':'وئام','نبيل':'نبيلة','جابر':'جابرة','مطلق':'مطلقة','شاكر':'شاكرة','فاضل':'فاضلة',

function pickFemaleName(index){
  return femaleNames[index % femaleNames.length];
}
function feminizeName(name){
  if(!name) return name;
  const parts = name.trim().split(/\s+/);
  if(parts.length === 0) return name;
  const first = parts[0];
  const mapped = maleToFemaleFirst[first] || pickFemaleName(first.charCodeAt(0) % femaleNames.length);
  parts[0] = mapped;
  return parts.join(' ');
}
function feminizeText(text){
  if(!text) return text;
  let t = text;
  t = t.replace(/الطالب\b/g, 'الطالبة');
  t = t.replace(/المعلم\b/g, 'المعلمة');
  t = t.replace(/الوكيل\b/g, 'الوكيلة');
  t = t.replace(/الموجه\b/g, 'الموجهة');
  t = t.replace(/ابن\b/g, 'ابنة');
  t = t.replace(/أخ\b/g, 'أخت');
  t = t.replace(/هو\b/g, 'هي');
  t = t.replace(/تم\s+تحويله/g, 'تم تحويلها');
  t = t.replace(/أضيفت\s+له/g, 'أضيفت لها');
  t = t.replace(/مسؤول\b/g, 'مسؤولة');
  return t;

function donutChart(present, absent, late){
  const total = present + absent + late;
  const r = 36, circ = 2 * Math.PI * r, cx = 50, cy = 50;
  if(total === 0){
    return `<svg width="120" height="120" viewBox="0 0 100 100"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="14"/><text x="50" y="52" text-anchor="middle" fill="#9ca3af" font-size="9">لا توجد بيانات</text></svg>`;
  }
  const segs = [
    { v: present, c: '#16a34a' },
    { v: absent, c: '#dc2626' },
    { v: late, c: '#d97706' },
  ];
  let off = 0, arcs = '';
  segs.forEach(s => {
    if(s.v === 0) return;
    const d = (s.v / total) * circ;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="14" stroke-dasharray="${d} ${circ - d}" stroke-dashoffset="${-off}"/>`;
    off += d;
  });
  return `<svg width="120" height="120" viewBox="0 0 100 100"><g transform="rotate(-90 ${cx} ${cy})"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f3f4f6" stroke-width="14"/>${arcs}</g><text x="50" y="46" text-anchor="middle" fill="#1f2937" font-size="20" font-weight="800">${present+absent}</text><text x="50" y="58" text-anchor="middle" fill="#6b7280" font-size="9">حضور</text></svg>`;
}
function barMeter(value, max, color){
  const pct = max > 0 ? Math.min(value / max * 100, 100) : 0;
  return `<div style="background:#f3f4f6;border-radius:6px;height:8px;overflow:hidden;margin-top:4px"><div style="width:${pct}%;height:100%;background:${color};border-radius:6px;transition:width .3s"></div></div>`;
}

function ensureUserInDB(school, sessionId){
  setActiveSchool(school);
  const d = loadDB();
  if(sessionId && !d.users.find(u => u.id === sessionId)){
    const other = school === 'BOYS' ? 'GIRLS' : 'BOYS';
    const prevKey = localStorage.getItem(SCHOOL_KEY);
    localStorage.setItem(SCHOOL_KEY, other);
    const otherDB = loadDB();
    const existing = otherDB.users.find(u => u.id === sessionId);
    if(existing){ d.users.push({ ...existing }); }
    localStorage.setItem(SCHOOL_KEY, school);
    saveDB(d);
  }
}
function enterSchool(school){
  setActiveSchool(school);
  const d = loadDB();
  const sessionId = localStorage.getItem(LOCAL_SESSION_KEY);
  // إن كانت البنات فارغة والبنين فيها بيانات → نسخ تلقائي
  if(school === 'GIRLS' && d.students.length === 0 && d.grades.length === 0){
    const prevKey = localStorage.getItem(SCHOOL_KEY);
    localStorage.setItem(SCHOOL_KEY, 'BOYS');
    const boysDB = loadDB();
    localStorage.setItem(SCHOOL_KEY, school);
    if(boysDB.students.length > 0){
      copyBoysToGirls();
      ensureUserInDB('GIRLS', sessionId);
      setActiveSchool('GIRLS');
      location.hash = '#/';
      renderApp();
      return;
    }
  }
  ensureUserInDB(school, sessionId);
  if(d.classes.length === 0 && d.grades.length === 0 && d.students.length === 0){
    stages.forEach(stage => {
      let grade = d.grades.find(g => g.name === stage.name);
      if(!grade){ grade = { id:uid(), name:stage.name, order:stage.order }; d.grades.push(grade); }
      if(!d.classes.some(c => c.gradeId===grade.id && c.name==='أ')){
        d.classes.push({ id:uid(), gradeId:grade.id, name:'أ', campus:school, capacity:null, teacherIds:[] });
      }
    });
    saveDB(d);
    ensureUserInDB(school, sessionId);
  }
  location.hash = '#/';
  renderApp();
}

/* عرض أسماء من دخلوا ومن لم يدخلوا حساباتهم (الطلاب أو المعلمون) لنطاق معيّن */
function showActNames(gkey, grp){
  const isStaffRole = r => r !== 'STUDENT' && r !== 'ADMIN';
  const isAdmin = currentUser()?.role === 'ADMIN';
  if(!isAdmin) return;
  const hasLoggedIn = u => !!(u && (u.lastLogin || (u.loginCount || 0) > 0));
  const sdDate = v => { if(!v) return ''; const d = new Date(v); return (!isNaN(d) ? d.toLocaleDateString('ar') + ' ' + d.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}) : ''); };
  const schools = gkey === 'ALL' ? ['BOYS','GIRLS'] : (gkey === 'BOYS' ? ['BOYS'] : ['GIRLS']);
  const multi = schools.length > 1;
  const actNames = [], pendNames = [];
  const tag = school => multi ? (school === 'BOYS' ? ' (بنين)' : ' (بنات)') : '';
  for(const school of schools){
    const sd = loadSchoolDB(school);
    const userMap = new Map((sd.users||[]).map(u => [u.id, u]));
    if(grp === 'students'){
      for(const s of (sd.students||[])){
        if(!s.active) continue;
        const u = userMap.get(s.id);
        if(!u || u.role !== 'STUDENT') continue;
        const nm = (s.fullName || s.name) + tag(school);
        if(hasLoggedIn(u)) actNames.push(nm + (u.lastLogin ? ' — دخل: ' + sdDate(u.lastLogin) : '')); else pendNames.push(nm);
      }
    } else {
      for(const u of (sd.users||[])){
        if(u.active === false) continue;
        if(grp === 'teachers'){ if(u.role !== 'TEACHER') continue; }
        else { if(!isStaffRole(u.role) || u.role === 'TEACHER') continue; }
        const nm = (u.name || u.username) + tag(school);
        if(hasLoggedIn(u)) actNames.push(nm + (u.lastLogin ? ' — دخل: ' + sdDate(u.lastLogin) : '')); else pendNames.push(nm);
      }
    }
  }
  const roleLabel = grp === 'students' ? 'الطلاب' : (grp === 'teachers' ? 'المعلمون' : 'الإداريون والوكلاء والموجهون');
  const rangeLabel = gkey === 'ALL' ? 'المدرستين' : (gkey === 'BOYS' ? 'بنين' : 'بنات');
  const li = arr => arr.length ? arr.sort((a,b)=>a.localeCompare(b,'ar')).map(n => `<li>${escapeHtml(n)}</li>`).join('') : '<li class="muted">لا يوجد</li>';
  openDetails('تفعيل الحسابات — ' + roleLabel + ' (' + rangeLabel + ')',
    `<li style="font-weight:800;color:#16a34a">✅ دخلوا حسابهم (${actNames.length})</li>${li(actNames)}<li style="font-weight:800;color:#9ca3af;margin-top:6px">⏳ لم يدخلوا بعد (${pendNames.length})</li>${li(pendNames)}`);
}

/* ============ الإشعارات: وميض + صوت (صيانة / مشاركة أنشطة) ============ */
const NOTIF_SEEN_KEY = 'nibras_notif_seen_';
let __notifLastPoll = 0;      // أعلى طابع زمني لوحظ في هذه الجلسة (يمنع تكرار الصوت)
let __notifSoundLock = true;  // أول جولة بعد الدخول: تحديث صامت
let __audioCtx = null;
function ensureAudio(){
  try{
    if(!__audioCtx) __audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(__audioCtx && __audioCtx.state === 'suspended') __audioCtx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown', ensureAudio, { once:true });
document.addEventListener('keydown', ensureAudio, { once:true });
function playNotifSound(){
  try{
    ensureAudio();
    if(!__audioCtx) return;
    const t = __audioCtx.currentTime;
    [[880,0],[660,0.18]].forEach(([f,d]) => {
      const o = __audioCtx.createOscillator(), g = __audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.25);
      o.connect(g); g.connect(__audioCtx.destination);
      o.start(t + d); o.stop(t + d + 0.3);
    });
  }catch(e){}
}
function notifItemsFor(user){
  if(!user) return [];
  const d = loadDB();
  const items = [];
  const isMgr = user.role === 'ADMIN' || user.role === 'AGENT';
  const seesMaint = isMgr || user.role === 'ADMINISTRATIVE' || user.role === 'COUNSELOR';
  if(seesMaint){
    (d.maintenance || []).forEach(m => {
      if(m.status === 'جديد'){
        items.push({ kind:'maint', href:'#/maintenance', title:'🛠️ بلاغ صيانة جديد', text:(m.createdByName || '—') + ' · ' + (m.description || 'بدون وصف'), ts: Date.parse(m.createdAt) || 0, key:'maint-' + m.id });
      }
      if(m.status === 'بانتظار اعتماد الوكيل' && user.role === 'AGENT'){
        items.push({ kind:'maint', href:'#/maintenance', title:'🛠️ بلاغ صيانة بانتظار اعتمادك', text:(m.createdByName || '—') + ' · ' + (m.description || ''), ts: Date.parse(m.forwardedAt || m.createdAt) || 0, key:'maintf-' + m.id });
      }
    });
  }
  if(isMgr){
    (d.activities || []).forEach(a => {
      (a.requests || []).forEach(r => {
        if(r.status === 'PENDING'){
          items.push({ kind:'part', href:'#/activities/' + a.id, title:'✋ طلب مشاركة في نشاط', text:(r.teacherName || '—') + ' · ' + (a.name || ''), ts: Date.parse(r.createdAt) || 0, key:'part-' + a.id + '-' + r.id });
        }
      });
    });
  }
  // أي رسالة موجهة للمدير مباشرةً → تنبيه على الجرس (يرى رسائل القسمين معًا)
  if(user.role === 'ADMIN'){
    const adminIds = {};
    ['BOYS','GIRLS'].forEach(s => {
      try{
        const db = JSON.parse(localStorage.getItem('nibras_'+s+'_db_v1') || 'null');
        const adm = db && db.users && db.users.find(u => u.role === 'ADMIN' && u.active);
        adminIds[s] = adm ? adm.id : null;
      }catch(e){ adminIds[s] = null; }
    });
    ['BOYS','GIRLS'].forEach(s => {
      const adminId = adminIds[s];
      if(!adminId) return;
      (loadAdminMsgsFor(s) || []).forEach(m => {
        if(m.teacherId === adminId && !m.dismissed && !m.revealed){
          items.push({ kind:'adminmsg', href:'#/guide-msgs', title:'📨 رسالة موجهة إليك', text:(m.teacherName || '') + ' · ' + (m.text || ''), ts: Date.parse(m.createdAt) || 0, key:'adminmsg-' + s + '-' + m.id });
        }
      });
    });
  }
  return items.sort((x,y) => y.ts - x.ts);
}
function notifSeenStamp(user){
  try{ return parseInt(localStorage.getItem(NOTIF_SEEN_KEY + (user ? user.id : '')) || '0', 10) || 0; }catch(e){ return 0; }
}
function setNotifSeenStamp(user, ts){
  try{ localStorage.setItem(NOTIF_SEEN_KEY + (user ? user.id : ''), String(ts || Date.now())); }catch(e){}
}
function renderNotifState(user){
  if(!user || user.role === 'STUDENT') return '';
  const items = notifItemsFor(user);
  const seen = notifSeenStamp(user);
  const unread = items.filter(x => x.ts > seen);
  const badge = unread.length ? `<span class="notif-badge">${Math.min(unread.length, 99)}</span>` : '';
  const blink = unread.length ? ' notif-blink' : '';
  return `<span style="position:relative">
    <button class="notif-btn${blink}" id="notifBell" onclick="toggleNotifDrop()" title="${unread.length ? 'لديك إشعارات جديدة' : 'الإشعارات'}">🔔${badge}</button>
    <div class="notif-drop" id="notifDrop" style="display:none"></div>
  </span>`;
}
function renderNotifDropHTML(user){
  const items = notifItemsFor(user);
  const seen = notifSeenStamp(user);
  return (items.length ? items.map(it => {
    const isNew = it.ts > seen;
    return `<a class="notif-item" href="${it.href}" onclick="closeNotifDrop()">${it.title}${isNew ? ' <span style="color:#dc2626;font-size:10px">●</span>' : ''}<div class="small muted" style="font-weight:400">${escapeHtml(it.text)}</div></a>`;
  }).join('') : '<div class="small muted" style="padding:8px 12px">لا توجد إشعارات</div>');
}
function refreshNotifBell(){
  const u = currentUser();
  const bell = document.getElementById('notifBell');
  if(!u || !bell) return;
  const items = notifItemsFor(u);
  const seen = notifSeenStamp(u);
  const unread = items.filter(x => x.ts > seen);
  let badge = bell.querySelector('.notif-badge');
  if(unread.length){
    if(badge) badge.textContent = String(Math.min(unread.length, 99));
    else bell.insertAdjacentHTML('afterbegin', `<span class="notif-badge">${Math.min(unread.length, 99)}</span>`);
    bell.classList.add('notif-blink');
    bell.title = 'لديك إشعارات جديدة';
  } else {
    if(badge) badge.remove();
    bell.classList.remove('notif-blink');
    bell.title = 'الإشعارات';
  }
}
function toggleNotifDrop(){
  const d = document.getElementById('notifDrop');
  if(!d) return;
  if(d.style.display !== 'none'){ closeNotifDrop(); return; }
  const u = currentUser();
  markAllNotifRead();
  d.innerHTML = renderNotifDropHTML(u);
  d.style.display = 'block';
}
function closeNotifDrop(){
  const d = document.getElementById('notifDrop');
  if(d) d.style.display = 'none';
}
function markAllNotifRead(){
  const u = currentUser();
  if(!u) return;
  setNotifSeenStamp(u, Date.now());
  refreshNotifBell();
}
function checkNotifications(){
  const u = currentUser();
  if(!u || u.role === 'STUDENT'){ __notifSoundLock = false; return; }
  const items = notifItemsFor(u);
  const fresh = items.filter(x => x.ts > __notifLastPoll);
  if(fresh.length){
    const maxTs = Math.max(...fresh.map(x => x.ts));
    if(__notifLastPoll > 0 && !__notifSoundLock) playNotifSound();
    __notifLastPoll = maxTs;
    refreshNotifBell();
  }
  __notifSoundLock = false;
}

function unreadForSchool(school, email){
  try{
    const d = JSON.parse(localStorage.getItem('nibras_' + school + '_db_v1') || 'null');
    const u = d && d.users.find(x => x.email === email);
    if(!u) return 0;

function msgMonitorBadge(user){
  if(!user) return 0;
  const g = unreadForSchool('GIRLS', 'counselor_girls@nibras.local');
  const b = unreadForSchool('BOYS', 'wakil@nibras.local');
  const gh = unreadForSchool('GIRLS', 'wakilah@nibras.local');
  if(user.role === 'ADMIN') return g + b + gh;
  if(user.role === 'AGENT') return g;
  if(user.role === 'COUNSELOR') return b + gh;
  return 0;
}
function adminMsgsFor(teacherId){
  const order = { ADMIN:0, AGENT:1, COUNSELOR:2, TRANSFER:3 };
  return loadAdminMsgs()
    .filter(m => m.teacherId === teacherId || m.teacherId === 'ALL')
    .sort((a,b) => ((order[a.senderRole] ?? 4) - (order[b.senderRole] ?? 4)) || b.createdAt.localeCompare(a.createdAt));
}
function sendAdminMsg(){
  const text = (document.getElementById('admMsgText')?.value || '').trim();
  if(!text){ alert('اكتب نص الرسالة أولاً'); return; }
  const rawTarget = document.getElementById('admMsgTarget')?.value;
  if(!rawTarget){ alert('اختر المعلم أو "' + tl('جميع المعلمين') + '"'); return; }
  // القيمة قد تكون "school:teacherId" (المدير يختار معلمًا من أي قسم)
  let targetSchool = getActiveSchool();
  let target = rawTarget;
  if(rawTarget.includes(':')){
    const parts = rawTarget.split(':');
    targetSchool = parts[0];
    target = parts.slice(1).join(':');
  }
  const d = loadSchoolDB(targetSchool);
  const tName = target === 'ALL' ? tl('جميع المعلمين') : (d.users.find(u => u.id === target)?.name || '—');
  const sender = currentUser();
  const arr = loadAdminMsgsFor(targetSchool);
  arr.push({ id: uid(), teacherId: target, teacherName: tName, text, createdAt: new Date().toISOString(), read:false, dismissed:false, views:0, senderRole: sender?.role, senderName: sender?.name, senderId: sender?.id });
  saveAdminMsgsFor(targetSchool, arr);
  renderApp();
  const color = sender?.role === 'AGENT' ? 'بالبرتقالي' : (sender?.role === 'COUNSELOR' ? 'بالأخضر' : 'بالأحمر');
  alert('تم إرسال الرسالة ✅ ستظهر للمعلم ' + color + ' عند دخوله، وسيُثبت اطلاعه تلقائيًا');
}
function dismissAdminMsg(id){
  const found = findAdminMsgAcross(id);
  if(!found) return;
  const { school, arr, m } = found;
  m.dismissed = true;
  m.dismissedAt = new Date().toISOString();
  m.dismissedBy = currentUser()?.name || '';
  saveAdminMsgsFor(school, arr);
  renderApp();
}
function revealAdminMsg(id){
  const found = findAdminMsgAcross(id);
  if(!found) return;
  const { school, arr, m } = found;
  const u = currentUser();
  m.seenBy = m.seenBy || {};
  if(!(u.id in m.seenBy)){
    m.seenBy[u.id] = new Date().toISOString();
    if(!m.firstViewAt){ m.firstViewAt = new Date().toISOString(); m.firstViewByName = u.name || ''; m.firstViewBy = u.id; }
  }
  m.lastViewAt = new Date().toISOString();
  m.lastViewByName = u.name || '';
  m.lastViewBy = u.id;
  m.revealed = true;
  m.revealedBy = u.name || '';
  m.read = true;
  saveAdminMsgsFor(school, arr);
  renderApp();
}
function deleteAdminMsg(id){
  const found = findAdminMsgAcross(id);
  if(!found) return;
  const { school, arr } = found;
  if(!confirm('حذف هذه الرسالة؟')) return;
  saveAdminMsgsFor(school, arr.filter(x => x.id !== id));
  renderApp();
}
function editAdminMsg(id){
  const found = findAdminMsgAcross(id);
  if(!found) return;
  const { school, arr, m } = found;
  const newText = prompt('تعديل نص الرسالة:', m.text);
  if(newText === null || newText === undefined) return;
  const text = String(newText).trim();
  if(!text){ alert('نص الرسالة لا يمكن أن يكون فارغاً'); return; }
  m.text = text;
  m.editedAt = new Date().toISOString();
  m.editedBy = currentUser()?.name || '';
  saveAdminMsgsFor(school, arr);
  renderApp();
}

/* تنبيه صوتي مستمر حتى فتح الرسالة */
function checkMsgBeep(){
  const user = currentUser();
  if(!user || user.role === 'ADMIN') return;
  const msgs = adminMsgsFor(user.id).filter(m => !m.dismissed && !m.revealed && m.senderRole !== 'TRANSFER');
  if(msgs.length){
    try { playMsgAlert(); }catch(e){}
    return;
  }
  // تنبيه هروب من الحصة (من قاعدة البيانات المتزامنة) — يقرع الجرس للوكيل على أي جهاز
  if(user.role === 'AGENT'){
    try{
      const d = loadDB();
      const pending = (d.escapeAlerts||[]).some(a => a.date === todayStr() && a.type === 'ESCAPE' && !a.dismissed);
      if(pending){ try { playMsgAlert(); }catch(e){} }
    }catch(e){}
  }
}
function startMsgBeepLoop(){
  if(window.__msgBeepTimer) return;
  checkMsgBeep();
  window.__msgBeepTimer = setInterval(checkMsgBeep, 3000);
}
function unlockMsgAudio(){
  try {
    if(window.__audioCtx && window.__audioCtx.state === 'suspended') window.__audioCtx.resume();
    if(window.__pendingMsgBeep){ window.__pendingMsgBeep = false; playMsgAlert(); }
  }catch(e){}
}
function playMsgAlert(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!window.__audioCtx) window.__audioCtx = new AC();
    const ctx = window.__audioCtx;
    if(ctx.state === 'suspended'){ ctx.resume(); window.__pendingMsgBeep = true; }
    const t0 = ctx.currentTime;
    [0, 0.3, 0.6].forEach((off, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i % 2 ? 'triangle' : 'square';
      osc.frequency.setValueAtTime(i % 2 ? 990 : 880, t0 + off);
      gain.gain.setValueAtTime(0.0001, t0 + off);
      gain.gain.exponentialRampToValueAtTime(0.2, t0 + off + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.16);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0 + off);
      osc.stop(t0 + off + 0.2);
    });
  }catch(e){}
}
window.addEventListener('pointerdown', unlockMsgAudio);
window.addEventListener('keydown', unlockMsgAudio);
/* تنبيهات حمراء من المدير تظهر للمعلم أعلى لوحة التحكم مباشرة */
function renderAdminMsgAlerts(){
  const user = currentUser();
  if(!user) return '';
  const isAdmin = user.role === 'ADMIN';
  const school = getActiveSchool();
  // المدير يرى إشعارات تحويل القسمين (بنين وبنات) معًا
  const combinedMsgs = (dismissed) => {
    if(isAdmin){
      return ['BOYS','GIRLS'].map(s => loadAdminMsgsFor(s).map(m => ({ ...m, _school: s })))
        .flat().filter(m => m.senderRole === 'TRANSFER' && !m.dismissed && adminSeesTransferMsg(m))
        .sort((a,b) => String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
    }
    let arr = adminMsgsFor(user.id).filter(m => !m.dismissed);
    if(user.role !== 'TEACHER') arr = arr.filter(m => m.teacherId !== 'ALL');
    return arr;
  };
  let msgs = combinedMsgs();
  if(msgs.length === 0) return '';
  // إثبات الاطلاع: يُحتسب لكل معلم مرة واحدة فقط (بمعرّفه)، فلا تتضخم الأرقام
  // بمرّات فتح الصفحة المتكررة. كل معلم = اطلاع واحد مهما فتح رسالته عدة مرات.
  const now = Date.now();
  if(now - (window.__msgViewAt || 0) > 3000){
    window.__msgViewAt = now;
    const userName = user.name;
    const uid = user.id;
    const touched = {};
    msgs.forEach(m => {
      const key = m._school || school;
      touched[key] = touched[key] || loadAdminMsgsFor(key);
      const rec = touched[key].find(x => x.id === m.id);
      if(rec){
        rec.seenBy = rec.seenBy || {};
        if(uid && !(uid in rec.seenBy)){
          rec.seenBy[uid] = new Date().toISOString();
          if(!rec.firstViewAt || rec.firstViewBy !== uid){ rec.firstViewAt = new Date().toISOString(); rec.firstViewByName = userName; rec.firstViewBy = uid; }
        }
        if(uid) rec.lastViewAt = new Date().toISOString();
        if(uid) rec.lastViewByName = userName;
        rec.read = true;
      }
    });
    Object.keys(touched).forEach(k => { try { localStorage.setItem(ADMIN_MSGS_KEY(k), JSON.stringify(touched[k])); } catch(e){} });
    msgs = combinedMsgs();
  }
  startMsgBeepLoop();
  const flexW = (m) => m.senderRole === 'ADMIN' ? 2.2 : (m.senderRole === 'AGENT' ? 1.5 : (m.senderRole === 'COUNSELOR' ? 1.1 : 1));
  return `
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    ${msgs.map(m => {
      // المدير: أحمر — الوكيل/الوكيلة: برتقالي — الموجه/الموجهة: أخضر — تحويل: بنفسجي — هروب من الحصة: أحمر مع جرس
      const fromTransfer = m.senderRole === 'TRANSFER';
      const fromCounselor = m.senderRole === 'COUNSELOR';
      const fromAgent = m.senderRole === 'AGENT';
      const fromEscape = m.senderRole === 'ESCAPE';
      const col = fromEscape ? '#dc2626' : (fromTransfer ? '#7c3aed' : (fromCounselor ? '#16a34a' : (fromAgent ? '#ea580c' : '#dc2626')));
      const colDark = fromEscape ? '#991b1b' : (fromTransfer ? '#6d28d9' : (fromCounselor ? '#15803d' : (fromAgent ? '#c2410c' : '#b91c1c')));
      const colText = fromEscape ? '#7f1d1d' : (fromTransfer ? '#4c1d95' : (fromCounselor ? '#14532d' : (fromAgent ? '#9a3412' : '#7f1d1d')));
      const bg = fromEscape ? 'linear-gradient(135deg,#fef2f2,#fecaca)' : (fromTransfer ? 'linear-gradient(135deg,#f5f3ff,#ede9fe)' : (fromCounselor ? 'linear-gradient(135deg,#f0fdf4,#dcfce7)' : (fromAgent ? 'linear-gradient(135deg,#fff7ed,#ffedd5)' : 'linear-gradient(135deg,#fef2f2,#fee2e2)')));
      const senderLabel = fromEscape ? '🔔 تنبيه هروب من الحصة' : (fromTransfer ? '📨 إشعار تحويل' : (fromCounselor ? ('💬 رسالة من ' + tl(targetLabels.COUNSELOR)) : (fromAgent ? ('🚨 رسالة من ' + tl(targetLabels.AGENT)) : '🚨 رسالة مهمة من المدير')));
      const badgeLabel = fromEscape ? 'عاجل' : (fromTransfer ? (m._school ? (m._school === 'BOYS' ? 'تحويل بنين' : 'تحويل بنات') : 'تحويل') : (fromCounselor ? tl(targetLabels.COUNSELOR) : (fromAgent ? tl(targetLabels.AGENT) : 'مهمة')));
      if(!m.revealed && !(user.role === 'ADMIN' && m.senderRole === 'TRANSFER')){
        return `
        <div style="flex:${flexW(m)} 1 0;min-width:200px;background:${bg};border:2px solid ${col};border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(220,38,38,.2);animation:msgPulse 1.5s infinite;display:flex;flex-direction:column">
          <div style="font-size:12px;font-weight:900;color:${col}">${senderLabel} <span style="background:${col};color:#fff;font-size:10px;padding:1px 7px;border-radius:999px">${badgeLabel}</span></div>
          <div style="font-size:11px;color:${colDark};margin-top:4px">🕐 ${fmtTime(m.createdAt)}</div>
          <div style="font-size:13px;font-weight:700;color:${colDark};margin-top:8px;letter-spacing:2px;background:#fff;border:1px dashed ${col};border-radius:8px;padding:6px 8px;text-align:center">🔒 محتوى مخفي (${Object.keys(m.seenBy||{}).length||0} معلم اطّلع)</div>
          <button class="btn-primary" style="margin-top:auto;background:${col};border-color:${col};width:100%;padding:6px 8px;font-size:12px" onclick="revealAdminMsg('${m.id}')">🔓 الاطلاع على المحتوى</button>
        </div>`;
      }
      return `
      <div style="flex:${flexW(m)} 1 0;min-width:200px;background:${bg};border:2px solid ${col};border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(220,38,38,.2);display:flex;flex-direction:column">
        <div style="font-size:12px;font-weight:900;color:${col}">${senderLabel} <span style="background:${col};color:#fff;font-size:10px;padding:1px 7px;border-radius:999px">${badgeLabel}</span></div>
        <div style="font-size:11px;color:${colDark};margin-top:4px">🕐 ${fmtTime(m.createdAt)}</div>
        <div style="font-size:14px;line-height:1.7;font-weight:700;color:${colText};margin-top:8px;white-space:pre-wrap">${escapeHtml(m.text)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px">
          <span style="font-size:11px;font-weight:800;color:${colDark}">${(m.seenBy && user.id && (user.id in m.seenBy)) ? '✓ تم اطلاعك' : ('👁 ' + (Object.keys(m.seenBy||{}).length||0) + ' معلم اطّلع')}</span>
          <button class="btn-primary" style="background:${col};border-color:${col};padding:5px 10px;font-size:12px" onclick="dismissAdminMsg('${m.id}')">✓ تم الاطلاع</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function dismissEscapeAlert(id){

function toggleAssignmentDone(aid){
  const d = loadDB();
  const user = currentUser();
  if(!user) return;
  const a = (d.assignments||[]).find(x => x.id === aid);
  if(!a) return;
  if(!a.completedBy) a.completedBy = [];
  const idx = a.completedBy.indexOf(user.id);
  if(idx >= 0) a.completedBy.splice(idx, 1); else a.completedBy.push(user.id);
  saveDB(d);
  renderApp();
}
function renderStudentDashboard(){
  const d = loadDB();
  const user = currentUser();
  if(!user || user.role !== 'STUDENT') return renderDashboard();
  const split = studentPointsSplit();
  const sp = split[user.id] || {pos:0, neg:0};
  const pts = (sp.pos || 0) + (sp.neg || 0);
  const myStudent = (d.students||[]).find(s => s.id === user.id);
  const cls = myStudent && myStudent.classId ? (d.classes||[]).find(c => c.id === myStudent.classId) : null;
  const grade = cls ? (d.grades||[]).find(g => g.id === cls.gradeId) : null;
  const classLabel = grade ? grade.name + ' — الفصل ' + cls.name : '—';
  const assignments = (d.assignments||[]).filter(a => myStudent && a.classId === myStudent.classId);

        if(hasLoggedIn(u)){ teachers.activated++; teachers.actNames.push(nm); } else { teachers.pendNames.push(nm); }
      }
      // الإداريون والوكلاء والموجهون (بقية الأدوار عدا الطالب والمعلم والأدمن)
      const admins = acc();
      for(const u of (sd.users||[])){
        if(u.active === false) continue;
        if(!isStaffRole(u.role) || u.role === 'TEACHER') continue;
        const nm = (u.name || u.username) + (school === 'BOYS' ? ' (بنين)' : ' (بنات)');
        admins.total++;
        if(hasLoggedIn(u)){ admins.activated++; admins.actNames.push(nm); } else { admins.pendNames.push(nm); }
      }
      return {
        key: school, school: school === 'BOYS' ? 'بنين' : 'بنات',
        students: st, teachers, admins
      };
    });
    const mergeAcc = (arr, f) => {
      const r = acc();
      arr.forEach(x => { r.activated += x[f].activated; r.total += x[f].total; r.actNames.push(...x[f].actNames); r.pendNames.push(...x[f].pendNames); });
      return r;
    };
    const comb = key => ({
      key,
      school: key === 'ALL' ? 'الكل' : (key === 'BOYS' ? 'بنين' : 'بنات'),
      students: mergeAcc(schoolActs, 'students'),
      teachers: mergeAcc(schoolActs, 'teachers'),
      admins: mergeAcc(schoolActs, 'admins')
    });
    const all = comb('ALL');
    const groups = [all, ...schoolActs.map(x => ({ key: x.key, school: x.school, students: x.students, teachers: x.teachers, admins: x.admins }))];
    const miniDonut = (label, g, gkey, grp) => {
      const pct = g.total ? Math.round((g.activated / g.total) * 100) : 0;
      const pend = g.total - g.activated;
      const donutBg = g.total ? `conic-gradient(#22c55e 0 ${pct}%, #eef2f7 ${pct}% 100%)` : 'conic-gradient(#e4edf5 0 100%)';
      return `
        <div class="act-block">
          <div style="font-weight:800;font-size:14px;color:#0f172a;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:5px" onclick="showActNames('${gkey}','${grp}')" title="اضغط لعرض أسماء من دخلوا ومن لم يدخلوا">${label}: ${g.activated}/${g.total} <span style="font-size:11px;color:#2563eb">📋</span></div>
          <div class="act-flex">
            <div class="dash-donut" style="width:116px;height:116px;background:${donutBg};cursor:pointer" onclick="showActNames('${gkey}','${grp}')" title="اضغط لعرض الأسماء">
              <div class="dash-donut-center"><b>${pct}%</b><span>فعّلوا</span></div>
            </div>
            <div class="att-legend">
              <div class="row" style="cursor:pointer" onclick="showActNames('${gkey}','${grp}')"><span class="swatch" style="background:#22c55e"></span>دخلوا الحساب <b>${g.activated}</b></div>
              <div class="row" style="cursor:pointer" onclick="showActNames('${gkey}','${grp}')"><span class="swatch" style="background:#eef2f7"></span>لم يدخلوا بعد <b>${pend}</b></div>
            </div>
          </div>
        </div>`;
    };
    const actTab = (g) => `
      <div class="act-grid">
        ${miniDonut('👨‍🎓 الطلاب', g.students, g.key, 'students')}
        ${miniDonut('👨‍🏫 المعلمون', g.teachers, g.key, 'teachers')}
        ${miniDonut('🛡 الإداريون والوكلاء والموجهون', g.admins, g.key, 'admins')}
      </div>`;
    return `
    <div class="dash-panel" style="margin-bottom:14px">
      <div class="dash-panel-head">
        <p class="dash-panel-title">🔑 نسبة تفعيل الحسابات</p>
        <span class="dash-panel-more" style="cursor:default">آخر تحديث عند فتح اللوحة</span>
      </div>
      <div class="dash-tabs" style="margin-bottom:12px">
        ${groups.map((g,i) => `<button class="dash-tab ${i===0?'active':''}" data-act="${g.key}" onclick="switchActTab('${g.key}')">${g.school}</button>`).join('')}
      </div>
      ${groups.map(g => `<div class="act-pane" data-act="${g.key}" style="${g.key==='ALL'?'':'display:none'}">${actTab(g)}</div>`).join('')}
      <p class="muted small" style="margin:10px 0 0">يُحتسب من دخل حسابَه لأول مرة (فعّل حسابه) — وليس مجرد إنشاء الحساب. اضغط على الرقم أو الدائرة لعرض الأسماء.</p>
    </div>`;
  })();

  // لوحة الأوائل — المراحل (ابتدائي/متوسط/ثانوي)
  const ptsMap = studentPointsMap();
  const medals = ['🥇','🥈','🥉'];
  const classLabelOf = s => { const c = s.classId ? classById(s.classId) : null; return c ? classLabel(c) : '—'; };
  const stageGroups = [
    { tab:'pri', label:'ابتدائي', min:0, max:5 },
    { tab:'mid', label:'متوسط', min:6, max:8 },
    { tab:'sec', label:'ثانوي', min:9, max:11 },
  ];
  const stageLeaders = g => {
    const gradeIds = new Set(d.grades.filter(x => x.order >= g.min && x.order <= g.max).map(x => x.id));
    const classIds = new Set(d.classes.filter(c => gradeIds.has(c.gradeId)).map(c => c.id));
    const studs = students.filter(s => s.classId && classIds.has(s.classId));
    // نعرض طلاب المرحلة (فصول المعلم) بترتيب النقاط تنازلياً — حتى من له 0 نقاط يظهر،
    // فلا تبقى مرحلة «فارغة» لدى المعلم ما دام يدرّس طلاباً فيها.
    const withPts = studs.map(s => ({ s, pts: ptsMap[s.id] || 0 })).sort((a,b) => b.pts - a.pts || String(a.s.fullName).localeCompare(String(b.s.fullName),'ar'));
    if(withPts.length === 0) return '<p class="muted small" style="margin:4px 0">لا توجد طلاب مسندون إليك في هذه المرحلة</p>';
    return withPts.slice(0,3).map((x,i) => `
    <div class="dash-leader-row">
      <span class="dash-leader-medal">${medals[i] || '•'}</span>
      <div style="min-width:0">
        <div class="dash-leader-name">${studentNameLink(x.s)}</div>
        <div class="dash-leader-meta">${escapeHtml(classLabelOf(x.s))}</div>
      </div>
      <span class="dash-leader-pts" style="color:#16a34a">+${x.pts}</span>
    </div>`).join('');
  };

  const leadersHTML = `
    <div class="dash-panel" style="padding:0">
      <div class="dash-panel-head" style="padding:14px 16px 10px">
        <p class="dash-panel-title" style="margin:0">🏆 لوحة الأوائل</p>
        <span class="dash-panel-more" onclick="location.hash='#/students'" style="cursor:pointer">عرض الكل</span>
      </div>
      <div style="padding:0 12px 12px">
        <div class="dash-tabs">
          ${stageGroups.map((g,i) => `<button class="dash-tab ${i===0?'active':''}" data-tab="${g.tab}" onclick="switchLeadersTab('${g.tab}')">${g.label}</button>`).join('')}
        </div>
        ${stageGroups.map((g,i) => `<div class="dash-leader-pane" data-tab="${g.tab}" style="margin-top:10px;${i===0?'':'display:none'}">${stageLeaders(g)}</div>`).join('')}
      </div>
    </div>`;

  const bottom = `
  <div class="dash-bottom">
    <div class="dash-panel">
      <div class="dash-panel-head">
        <p class="dash-panel-title">🎉 الأنشطة القادمة</p>
        <span class="dash-panel-more" onclick="location.hash='#/activities'" style="cursor:pointer">عرض الكل</span>
      </div>
      ${upcomingHTML}
    </div>
    <div class="dash-mid">
      ${leadersHTML}
      ${isTeacher ? renderTeacherWeekTT(d, true) : `
      <div class="dash-panel">
        <div class="dash-panel-head">
          <p class="dash-panel-title">📌 يحتاج إلى متابعتك</p>
          <span class="dash-panel-more" onclick="showPendingTransfers()" style="cursor:pointer">عرض التفاصيل</span>
        </div>
        ${needsHTML}
      </div>`}
    </div>
  </div>`;

  return `
  ${renderEscapeAlerts()}
  ${renderAdminMsgAlerts()}
  ${hero}
  ${isTeacher ? teacherQuickCards : ''}
  ${attPanel}
  ${activationPanel}
  ${isTeacher ? (() => {
    const tst = teacherStats(user);
    // عدد أيام الدراسة المنقضية (الاثنين–الجمعة) منذ بداية السنة الدراسية
    const nowd = new Date();
    const y = nowd.getFullYear(), mo = nowd.getMonth();
    const yearStart = (mo>=8 ? new Date(y,8,1) : new Date(y-1,8,1));
    yearStart.setHours(0,0,0,0);
    const today0 = new Date(); today0.setHours(0,0,0,0);
    let worked = 0;
    const walk = new Date(yearStart);
    while(walk <= today0){ const dow = walk.getDay(); if(dow>=1 && dow<=5) worked++; walk.setDate(walk.getDate()+1); }
    const attPct = worked>0 ? Math.max(0, Math.round((Math.max(0, worked - tst.absent))/worked*100)) : 100;
    const grade = attPct>=95 ? {t:'ممتاز',c:'#16a34a'} : attPct>=85 ? {t:'جيد جدًا',c:'#1d7fd6'} : attPct>=75 ? {t:'جيد',c:'#0f766e'} : attPct>=50 ? {t:'مقبول',c:'#d97706'} : {t:'يحتاج تحسين',c:'#dc2626'};
    return `
    <div style="margin:0 0 14px;border-radius:18px;padding:0;background:#fff;border:1px solid #e6edf5;box-shadow:0 6px 20px rgba(15,79,136,.08);overflow:hidden">
      <div style="background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">⏱</div>
        <div style="flex:1">
          <div style="font-weight:800;font-size:16px">الالتزام بالدوام (${y})</div>
          <div style="font-size:12px;opacity:.92">بطاقة تقييم حضورك في السنة الدراسية الحالية</div>
        </div>
        <span style="background:${grade.c};color:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:12.5px;white-space:nowrap">${grade.t}</span>
      </div>
      <div style="display:flex;gap:18px;padding:20px 18px;align-items:center;flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0">
          <div style="width:132px;height:132px;border-radius:50%;background:conic-gradient(${grade.c} 0 ${attPct}%, #eef2f7 ${attPct}% 100%);display:flex;align-items:center;justify-content:center;position:relative">
            <div style="position:absolute;inset:9px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">
              <div style="font-size:30px;font-weight:900;color:${grade.c};line-height:1">${attPct}%</div>
              <div style="font-size:10px;color:#9ca3af;margin-top:2px">نسبة الحضور</div>
            </div>
          </div>
          <div style="font-size:12px;color:#6b7280">من ${worked} ${worked===1?'يوم عمل':'أيام عمل'}</div>
        </div>
        <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:12px">
          ${kpiPill('❌','أيام الغياب', tst.absent, '#ef4444', "openTeacherDetail('ABSENT','"+user.id+"')")}
          ${kpiPill('🕐','دقائق التأخر', tst.lateMin, '#b45309', "openTeacherDetail('LATE','"+user.id+"')")}
        </div>
      </div>
      <div style="padding:0 18px 18px">
        <div style="height:10px;border-radius:999px;background:#eef2f7;overflow:hidden"><div style="height:100%;width:${attPct}%;background:${grade.c};border-radius:999px;transition:width .4s"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:#6b7280">
          <span>✅ الحضور: ${Math.max(0, worked - tst.absent)}</span>
          <span>❌ الغياب: ${tst.absent}</span>
          <span>${tst.absent===0 ? '🎉 مداوم مثالي' : ''}</span>
        </div>
      </div>
    </div>`;
    function kpiPill(ico, lbl, val, color, click){
      return `<div style="display:flex;align-items:center;gap:12px;background:${color}12;border:1px solid ${color}33;border-radius:14px;padding:10px 14px;cursor:${click?'pointer':'default'};transition:transform .15s" ${click?`onclick="${click}"`:'title="ظهر عند أول دخول لك اليوم"'} data-tip="اضغط للتفاصيل">
        <span style="width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0">${ico}</span>
        <div style="flex:1">
          <div style="font-size:12.5px;color:#374151;font-weight:700">${lbl}</div>
          <div style="font-size:18px;font-weight:900;color:${color};line-height:1.1">${val}</div>
        </div>
      </div>`;
    }
  })() : ''}
  ${bottom}
  ${isTeacher && myClasses.length ? `
  <h2 class="section-title">📊 ${tl('إحصائيات فصولي')}</h2>
  <div class="grid grid-6">${myClassCards}</div>
  ` : ''}
  ${isMgr ? renderCharts(d) : ''}
  ${todayAtt.length===0 ? `<div class="card mt"><p class="muted">لم يُسجَّل حضور اليوم بعد — انتقل إلى صفحة <a href="#/attendance" class="link">الحضور</a> لتسجيله.</p></div>` : ''}
  `;
}

  const card = a => {

    return `<div class="card" style="cursor:pointer" onclick="location.hash='#/activity/${a.id}'" title="فتح النشاط وتسجيل المشاركين">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:22px">${t.icon}</span>
        <div style="min-width:0">
          <div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(a.name)}</div>
          <div class="muted small">${t.label} · ${fmtDateOnly(a.date)}</div>
          <div class="small" style="color:#6b7280;margin-top:2px">👥 ${n} مشارك</div>
        </div>

  return `
  <h2 class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <span>🎉 الأنشطة والفعاليات (آخر 3)</span>
    <span style="display:flex;gap:8px;align-items:center;font-size:12px;font-weight:400">${addBtn}<a href="#/activities" class="link">عرض الكل</a></span>

  ${acts.length ? `<div class="grid grid-3">${acts.map(card).join('')}</div>`

}

/* ============ الثواب والعقاب (النقاط) ============ */
function renderPointsSection(){
  const students = getVisibleStudents();
  const visibleIds = new Set(students.map(s => s.id));
  const d = loadDB();
  const items = pointItems(d).filter(it => visibleIds.has(it.studentId));
  let posTotal = 0, negTotal = 0;
  const per = {};
  items.forEach(it => {
    if(it.points >= 0) posTotal += it.points; else negTotal += it.points;
    per[it.studentId] = (per[it.studentId]||0) + it.points;
  });
  const leaderboard = Object.entries(per)
    .filter(([,p]) => p !== 0)
    .sort((a,b) => b[1]-a[1])
    .slice(0,5)
    .map(([sid, pts], i) => {
      const s = students.find(x => x.id === sid);
      const medals = ['🥇','🥈','🥉',''];
      return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px">
        <span style="width:24px;text-align:center">${medals[i]||'•'}</span>
        <span style="font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${studentNameLink(s)}</span>
        <span style="font-weight:800;color:${pts>=0?'#16a34a':'#dc2626'}">${pts>0?'+':''}${pts}</span>
      </div>`;
    }).join('');
  return `
  <h2 class="section-title">🏆 الثواب والعقاب (النقاط)</h2>
  <div class="grid grid-3">
    <div class="card"><p class="muted">🟢 نقاط الثواب</p><p class="stat-value green">+${posTotal}</p></div>
    <div class="card"><p class="muted">🔴 نقاط العقاب</p><p class="stat-value red">${negTotal}</p></div>
    <div class="card"><p class="muted">⭐ صافي النقاط</p><p class="stat-value" style="color:${(posTotal+negTotal)>=0?'#16a34a':'#dc2626'}">${(posTotal+negTotal)>0?'+':''}${posTotal+negTotal}</p></div>
  </div>
  <div class="card mt">
    <p class="card-label">🏅 أعلى 5 طلاب نقاطًا</p>
    ${leaderboard ? leaderboard : '<p class="muted small">لا توجد نقاط بعد — سجّل ملاحظات إيجابية أو سلبية</p>'}
  </div>`;
}

/* ============ لوحة الأوائل: أعلى المعلمين + أعلى طالب في كل مرحلة (للمدير) ============ */
function renderStageLeaders(d){
  const stageGroups = [
    { label:'🎓 الابتدائي', min:0, max:5 },
    { label:'🎓 المتوسط', min:6, max:8 },
    { label:'🎓 الثانوي', min:9, max:11 },
  ];
  const ptsMap = studentPointsMap();
  const studentCol = g => {
    const gradeIds = new Set(d.grades.filter(x => x.order >= g.min && x.order <= g.max).map(x => x.id));
    const classIds = new Set(d.classes.filter(c => gradeIds.has(c.gradeId)).map(c => c.id));
    const studs = d.students.filter(s => s.classId && classIds.has(s.classId));
    const withPts = studs.map(s => ({ s, pts: ptsMap[s.id] || 0 })).filter(x => x.pts !== 0)
      .sort((a,b) => b.pts - a.pts || String(a.s.fullName).localeCompare(String(b.s.fullName),'ar'));
    const clsOf = s => { const c = classById(s.classId); return c ? classLabel(c) : '—'; };
    if(withPts.length === 0) return `<div style="min-width:0"><div style="font-size:12px;font-weight:700;margin-bottom:6px">${g.label}</div><p class="muted small">لا توجد نقاط</p></div>`;
    const medals = ['🥇','🥈','🥉'];
    return `<div style="min-width:0">
      <div style="font-size:12px;font-weight:700;margin-bottom:6px">${g.label}</div>
      ${withPts.slice(0,3).map((x,i) => `
      <div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--border-color,#eef2f7)">
        <span style="font-size:12px">${medals[i]}</span>
        <span style="font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${studentNameLink(x.s)}</span>
        <span class="muted small" style="flex-shrink:0">${escapeHtml(clsOf(x.s))}</span>
        <span style="margin-inline-start:auto;font-weight:800;font-size:13px;color:#16a34a">${x.pts>0?'+':''}${x.pts}</span>
      </div>`).join('')}
    </div>`;
  };
  const teachers = d.users.filter(u => u.role === 'TEACHER' && u.active);
  const actionsOf = id => {
    const att = d.attendance.filter(a => a.createdBy === id).length;
    const notes = d.notes.filter(n => n.createdBy === id).length;
    const trans = d.transfers.filter(t => t.createdBy === id).length;
    return { att, notes, trans, total: att + notes + trans };
  };
  const ranked = teachers.map(t => ({ t, a: actionsOf(t.id) }))
    .sort((x,y) => y.a.total - x.a.total || String(x.t.lastLogin||'').localeCompare(String(y.t.lastLogin||'')));
  const medals = ['🥇','🥈','🥉'];
  const teacherCol = ranked.length===0
    ? '<p class="muted small">لا يوجد معلمون</p>'
    : ranked.slice(0,3).map((r,i) => `
      <a href="#/teacher/${r.t.id}" style="display:flex;align-items:center;gap:6px;padding:3px 0;text-decoration:none;border-bottom:1px dashed var(--border-color,#eef2f7)" title="متابعة المعلم ورسائله">
        <span style="font-size:12px">${medals[i]}</span>
        <span style="font-weight:600;font-size:12px;color:#2563eb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.t.name)}</span>
        <span style="font-weight:800;font-size:13px;color:#16a34a;margin-inline-start:auto">${r.a.total}</span>
      </a>`).join('');
  return `
  <h2 class="section-title">🏆 ${tl('لوحة الأوائل')}</h2>
  <div class="card" style="padding:12px">
    <div class="grid grid-4" style="gap:10px">
      <div style="min-width:0">
        <div style="font-size:12px;font-weight:700;margin-bottom:4px">👨‍🏫 ${tl('الأعلى تفاعلًا — المعلمون')}</div>
        ${teacherCol}
      </div>
      ${stageGroups.map(studentCol).join('')}
    </div>
  </div>`;
}

/* ============ قائمة حضور اليوم (عند الضغط على نسبة الحضور) ============ */
function showTodayAttendance(){
  const d = loadDB();
  const students = getVisibleStudents();
  const visibleIds = new Set(students.map(s => s.id));
  const today = todayStr();
  const recs = d.attendance.filter(a => a.date === today && visibleIds.has(a.studentId));
  const order = { PRESENT:0, LATE:1, ABSENT:2 };
  recs.sort((a,b) => (order[a.status]||0) - (order[b.status]||0));
  const ptsMapAttList = studentPointsMap();
  const statusBadge = { PRESENT:['حاضر','#16a34a'], LATE:['متأخر','#d97706'], ABSENT:['غائب','#dc2626'] };
  const absTypeLabel = t => t === 'EXCUSED' ? 'مستأذن' : (t === 'ESCAPE' ? 'هارب من الحصة' : 'غائب');
  const absTypeColor = t => t === 'EXCUSED' ? '#1d4ed8' : (t === 'ESCAPE' ? '#b91c1c' : '#dc2626');

      const cls = s?.classId ? classById(s.classId) : null;

      const [label, color] = isAbs ? [absTypeLabel(a.absenceType), absTypeColor(a.absenceType)] : (statusBadge[a.status] || ['—','#6b7280']);

        <td>${studentNameLink(s, s ? (ptsMapAttList[s.id] || 0) : undefined)}</td>

        <td>${cls ? escapeHtml(classLabel(cls)) : '—'}</td>
        <td style="font-weight:800;color:${color}">${label}${isAbs && a.absenceType ? (a.absenceType === 'EXCUSED' ? ' 🔵' : ' 🚨') : ''}</td>
      </tr>`;
    }).join('');
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="card" style="width:min(560px,100%);max-height:86vh;overflow:auto;padding:20px">
      <div class="header-row">
        <h3 style="margin:0">✅ حضور اليوم <span class="muted small">(${recs.length} طالب)</span></h3>

  document.body.appendChild(overlay);
}

function openRoleInbox(uid){
  const me = currentUser();
  if(!me || me.role !== 'ADMIN') return;
  const d = loadDB();
  const u = d.users.find(x => x.id === uid);
  if(!u) return;
  const sources = ['BOYS','GIRLS'].map(s => ({ school: s, d: loadSchoolDB(s) }));
  const pending = [];
  const msgs = [];
  sources.forEach(({ school, d }) => {
    d.transfers.filter(t => t.status === 'PENDING' && transferForMe(t) && (t.target === u.role || t.createdBy === u.id)).forEach(t => pending.push({ t, school, d }));
    loadAdminMsgsFor(school).filter(m => m.senderRole === 'TRANSFER' && m.teacherId === uid && !m.dismissed).forEach(m => msgs.push({ m, school }));
  });
  pending.sort((a,b) => (b.t.createdAt||'').localeCompare(a.t.createdAt||''));
  msgs.sort((a,b) => (b.m.createdAt||'').localeCompare(a.m.createdAt||''));
  const priorityColor = { LOW:'#6b7280', MEDIUM:'#1d4ed8', HIGH:'#d97706', URGENT:'#dc2626' };
  const schoolBadge = (school) => `<span class="badge ${school === 'BOYS' ? 'badge-boys' : 'badge-girls'}" style="margin-left:6px">${campusLabels[school] || school}</span>`;
  const pendRows = pending.length === 0 ? `<tr><td colspan="4" style="text-align:center;padding:18px;color:#9ca3af">لا توجد تحويلات معلّقة</td></tr>` :

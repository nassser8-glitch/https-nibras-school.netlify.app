        ${isAdm ? `<button class="btn-secondary danger" style="padding:3px 10px;font-size:12px;flex-shrink:0" onclick="deleteVideo('${v.id}')" title="حذف الفيديو">🗑</button>` : ''}
      </div>
    </div>`;
  };
  return `
  <div class="header-row"><h1 class="page-title">🎬 الفيديوهات والإعلانات</h1>${isAdm ? '<button class="btn-primary" onclick="openVideoForm()">+ إضافة فيديو</button>' : ''}</div>
  ${isAdm ? `<div id="videoForm" class="card mb" style="display:${videoFormOpen ? '' : 'none'}">
    <div style="font-size:14px;font-weight:700;margin-bottom:10px">➕ فيديو جديد</div>
    <div class="form-grid-3">
      <div>
        <label class="small" style="display:block;font-weight:600;margin-bottom:4px">العنوان</label>
        <input id="vidTitle" class="input" placeholder="مثال: إذاعة اليوم الوطني" />
      </div>
      <div style="grid-column:span 2">
        <label class="small" style="display:block;font-weight:600;margin-bottom:4px">الرابط — كود تضمين (iframe) أو رابط فيديو مباشر</label>
        <input id="vidEmbed" class="input" placeholder="الصق كود التضمين أو رابط الفيديو هنا" />
      </div>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-primary" onclick="saveVideo()">💾 حفظ</button>
      <button class="btn-secondary" onclick="closeVideoForm()">إلغاء</button>
    </div>
  </div>` : ''}
  ${vids.length ? `<div class="grid grid-2">${vids.map(card).join('')}</div>` : `<div class="card"><p class="muted small">لا توجد فيديوهات بعد${isAdm ? ' — أضف فيديو من زر (+ إضافة فيديو)' : ''}</p></div>`}`;
}
function openVideoForm(){
  videoFormOpen = true;
  renderApp();
  setTimeout(() => { const f = document.getElementById('videoForm'); if(f){ f.scrollIntoView({behavior:'smooth'}); document.getElementById('vidTitle').focus(); } }, 30);
}
function closeVideoForm(){
  videoFormOpen = false;
  renderApp();
}
function saveVideo(){
  const title = document.getElementById('vidTitle').value.trim();
  const raw = document.getElementById('vidEmbed').value.trim();
  if(!title){ alert('اكتب عنوان الفيديو'); return; }
  const src = parseEmbedSrc(raw);
  if(!src){ alert('الصق كود تضمين iframe أو رابط فيديو صحيح'); return; }
  const d = loadDB();
  d.videos = d.videos || [];
  d.videos.push({ id: uid(), title, src: normalizeEmbedUrl(src), createdBy: currentUser()?.id, createdAt: new Date().toISOString() });
  saveDB(d);
  videoFormOpen = false;
  renderApp();
}
function deleteVideo(id){
  const d = loadDB();
  if(!(d.videos || []).some(v => v.id === id)) return;
  if(!confirm('حذف هذا الفيديو؟')) return;
  d.videos = (d.videos || []).filter(v => v.id !== id);
  saveDB(d);
  renderApp();
}
/* ============ الصيانة (بلاغات المدرسة) ============ */
/* الصلاحيات: المعلم يرفع بلاغًا، المساعد الإداري يتابع (رفع للوكيل/تنفيذ)، الوكيل يتخذ القرار (اعتماد/رفض) */
const MAINT_LOCATIONS = {
  'المبنى': {
    'الدور الأرضي': ['مكتب المدير','مكتب الوكيل','مكتب الموجه','مكتب المساعد الإداري','مكتب المحاسب','مكتب الوكيلة','مكتب الموجهة الطلابية','مكتب المساعدة الإدارية','مكتب إداري','مكتب التسجيل','دورات المياه','فصل','ممر','أخرى'],
    'الدور الأول': ['معمل حاسب 1','معمل حاسب 2','معمل كيمياء','معمل رياضيات','معمل قرآن','معمل فيزياء','المكتبة','دورات المياه','فصل','ممر','أخرى'],
    'الدور الثاني': ['معمل حاسب 1','معمل حاسب 2','معمل كيمياء','معمل رياضيات','معمل قرآن','معمل فيزياء','المكتبة','دورات المياه','فصل','ممر','أخرى'],
    'الدور الثالث': ['معمل حاسب 1','معمل حاسب 2','معمل كيمياء','معمل رياضيات','معمل قرآن','معمل فيزياء','المكتبة','دورات المياه','فصل','ممر','أخرى']
  },
  'القبو': { 'القبو': ['المطبخ','دورات المياه','مستودع','ممر','غرفة','أخرى'] },
  'الفناء والحوش': { 'الفناء والحوش': ['المطبخ','المقصف','دورات المياه الخارجية','الخيمة','الساحة','البوابة','مستودع','أخرى'] }
};
const MAINT_STATUS_COLORS = {
  'جديد':'#1d4ed8', 'بانتظار اعتماد الوكيل':'#b45309', 'معتمد':'#15803d', 'قيد التنفيذ':'#4338ca', 'مكتمل':'#047857', 'مرفوض':'#dc2626'
};
const MAINT_PRIORITY_COLORS = { 'عادي':'#1d4ed8', 'متوسط':'#4338ca', 'عاجل':'#b45309', 'طارئ':'#dc2626' };
const MAINT_STATUS_ORDER = ['جديد','بانتظار اعتماد الوكيل','معتمد','قيد التنفيذ','مكتمل'];
let maintFilter = { status:'', type:'', category:'', search:'', mine:false };
let maintEditId = null;
let maintImageData = null;

function maintReports(){ const d = loadDB(); d.maintenance = d.maintenance || []; return d.maintenance; }
function maintById(id){ return maintReports().find(x => x.id === id); }
function maintNextId(){ let max = 0; maintReports().forEach(x => { const m = /^PM-(\d+)$/.exec(String(x.id || '')); if(m) max = Math.max(max, parseInt(m[1], 10)); }); return 'PM-' + String(max + 1).padStart(4, '0'); }
function maintCanCreate(u){ return !!u && u.role !== 'STUDENT'; }
function maintCanFollow(u){ return !!u && (u.role === 'ADMIN' || u.role === 'AGENT' || u.role === 'ADMINISTRATIVE'); }
function maintCanDecide(u){ return !!u && (u.role === 'ADMIN' || u.role === 'AGENT'); }
function maintCanSeeStats(u){ return !!u && (u.role === 'ADMIN' || u.role === 'AGENT' || u.role === 'ADMINISTRATIVE'); }
function maintCanEdit(report, u){ return !!u && (u.role === 'ADMIN' || u.id === report.createdBy) && (report.status === 'جديد' || report.status === 'مرفوض'); }
function maintCanDelete(report, u){ if(!u) return false; if(u.role === 'ADMIN') return true; return u.id === report.createdBy && (report.status === 'جديد' || report.status === 'مرفوض'); }
function maintStatusBadge(status){ return `<span class="badge" style="background:${MAINT_STATUS_COLORS[status] || '#6b7280'};color:#fff">${escapeHtml(status)}</span>`; }
function maintPriorityBadge(prio){ return `<span class="badge" style="background:${MAINT_PRIORITY_COLORS[prio] || '#6b7280'};color:#fff">${escapeHtml(prio)}</span>`; }
function maintCost(x){ return Number(x.cost || 0).toLocaleString('ar-SA'); }

function maintActionsFor(report, user){
  const acts = [];
  if(report.status === 'جديد'){
    if(maintCanFollow(user)) acts.push(`<button class="btn-primary" style="padding:4px 10px;font-size:12px" onclick="maintAction('${report.id}','forward')">رفع للوكيل</button>`);
    if(maintCanEdit(report, user)) acts.push(`<button class="btn-secondary" style="padding:4px 10px;font-size:12px" onclick="openMaintForm('${report.id}')">تعديل</button>`);
  } else if(report.status === 'بانتظار اعتماد الوكيل'){
    if(maintCanDecide(user)){
      acts.push(`<button class="btn-primary" style="padding:4px 10px;font-size:12px" onclick="maintAction('${report.id}','approve')">اعتماد</button>`);
      acts.push(`<button class="btn-secondary danger" style="padding:4px 10px;font-size:12px" onclick="maintAction('${report.id}','reject')">رفض</button>`);
    }
  } else if(report.status === 'مرفوض'){
    if(maintCanFollow(user)) acts.push(`<button class="btn-primary" style="padding:4px 10px;font-size:12px" onclick="maintAction('${report.id}','forward')">إعادة رفع للوكيل</button>`);
    if(maintCanEdit(report, user)) acts.push(`<button class="btn-secondary" style="padding:4px 10px;font-size:12px" onclick="openMaintForm('${report.id}')">تعديل</button>`);
  } else if(report.status === 'معتمد'){
    if(maintCanFollow(user)) acts.push(`<button class="btn-primary" style="padding:4px 10px;font-size:12px" onclick="maintAction('${report.id}','start')">بدء التنفيذ</button>`);
  } else if(report.status === 'قيد التنفيذ'){
    if(maintCanFollow(user)) acts.push(`<button class="btn-primary" style="padding:4px 10px;font-size:12px" onclick="maintAction('${report.id}','complete')">إكمال وإدخال التكلفة</button>`);
  }
  if(maintCanDelete(report, user)) acts.push(`<button class="btn-secondary danger" style="padding:4px 10px;font-size:12px" onclick="maintDelete('${report.id}')">حذف</button>`);
  return acts.join(' ');
}

function maintAction(id, action){
  const d = loadDB();
  const r = (d.maintenance = d.maintenance || []).find(x => x.id === id);
  if(!r) return;
  const user = currentUser();
  if(action === 'forward'){ if(!maintCanFollow(user)) return; r.status = 'بانتظار اعتماد الوكيل'; r.forwardedAt = todayStr(); r.forwardedBy = user.id; }
  else if(action === 'approve'){ if(!maintCanDecide(user)) return; r.status = 'معتمد'; r.approvedAt = todayStr(); r.approvedBy = user.id; r.rejectReason = undefined; }
  else if(action === 'reject'){ if(!maintCanDecide(user)) return; const why = prompt('سبب الرفض:'); if(why === null) return; r.status = 'مرفوض'; r.rejectReason = String(why).trim(); r.rejectedAt = todayStr(); r.rejectedBy = user.id; }
  else if(action === 'start'){ if(!maintCanFollow(user)) return; r.status = 'قيد التنفيذ'; r.startedAt = todayStr(); }
  else if(action === 'complete'){ if(!maintCanFollow(user)) return; const raw = prompt('تكلفة الصيانة (بالروبية):', '0'); if(raw === null) return; r.cost = Math.max(0, Number(String(raw).replace(/,/g, '')) || 0); r.status = 'مكتمل'; r.completedAt = todayStr(); }
  else return;
  saveDB(d);
  renderApp();
}
function maintDelete(id){
  const d = loadDB();
  const r = (d.maintenance = d.maintenance || []).find(x => x.id === id);
  if(!r) return;
  if(!maintCanDelete(r, currentUser())) return;
  if(!confirm('حذف البلاغ ' + id + ' نهائيًا؟')) return;
  d.maintenance = d.maintenance.filter(x => x.id !== id);
  saveDB(d);
  renderApp();
}
function maintSetFilter(k, v){ maintFilter[k] = v; renderApp(); }

function renderMaintenance(){
  const d = loadDB();
  const user = currentUser();
  const canCreate = maintCanCreate(user);
  d.maintenance = d.maintenance || [];
  const me = user ? user.id : null;

  const rows = d.maintenance.slice().sort((a, b) => String(b.createdAt || b.date || '').localeCompare(String(a.createdAt || a.date || '')));
  const f = maintFilter;
  const mineOnly = !!(user && user.role === 'TEACHER') || f.mine;
  const filtered = rows.filter(r => {
    const ms = !f.status || r.status === f.status;
    const mt = !f.type || r.type === f.type;
    const mc = !f.category || r.category === f.category;
    const mq = !f.search || (r.id + ' ' + (r.location || '') + ' ' + (r.description || '')).toLowerCase().includes(f.search.toLowerCase());
    const mm = !mineOnly || r.createdBy === me;
    return ms && mt && mc && mq && mm;
  });

  const statusCount = s => d.maintenance.filter(x => x.status === s).length;
  const totalCost = d.maintenance.reduce((s, x) => s + Number(x.cost || 0), 0);
  const stat = (label, num, color, tip) => `<div class="card" style="padding:14px 16px;margin:0;text-align:center" title="${escapeHtml(tip || '')}"><div style="font-size:12px;color:#64748b;font-weight:700">${label}</div><div style="font-size:24px;font-weight:800;color:${color};margin-top:6px">${num}</div></div>`;
  const showMgmtView = maintCanSeeStats(user); // الفلاتر/البحث/الإحصائيات: المدير والوكيلان والمساعدون الإداريون فقط

  const filterRow = showMgmtView ? `
    <div class="card mb">
      <div class="form-grid-3">
        <select id="maintFilterStatus" class="input" onchange="maintSetFilter('status', this.value)">
          <option value="">كل الحالات</option>
          ${MAINT_STATUS_ORDER.map(s => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${s}</option>`).join('')}
          <option value="مرفوض" ${f.status === 'مرفوض' ? 'selected' : ''}>مرفوض</option>
        </select>
        <select id="maintFilterType" class="input" onchange="maintSetFilter('type', this.value)">
          <option value="">كل أنواع الطلبات</option>
          <option value="عطل" ${f.type === 'عطل' ? 'selected' : ''}>عطل</option>
          <option value="تغيير حبر" ${f.type === 'تغيير حبر' ? 'selected' : ''}>تغيير حبر</option>
          <option value="صيانة دورية" ${f.type === 'صيانة دورية' ? 'selected' : ''}>صيانة دورية</option>
          <option value="تغيير قطعة" ${f.type === 'تغيير قطعة' ? 'selected' : ''}>تغيير قطعة</option>
        </select>
        <input id="maintSearch" class="input" placeholder="بحث برقم البلاغ أو الموقع أو الوصف..." value="${escapeHtml(f.search)}" oninput="maintSetFilter('search', this.value)" />
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center">
        <select id="maintFilterCategory" class="input" style="width:200px" onchange="maintSetFilter('category', this.value)">
          <option value="">كل التصنيفات</option>
          ${['كهرباء','سباكة','إنشائية','تكييف','طابعات وآلات تصوير','تقنية','سلامة','أثاث','مرافق','أخرى'].map(c => `<option value="${c}" ${f.category === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;margin:0"><input type="checkbox" ${f.mine ? 'checked' : ''} onchange="maintSetFilter('mine', this.checked)" /> بلاغاتي فقط</label>
        <button class="btn-secondary" style="padding:6px 12px" onclick="maintFilter={status:'',type:'',category:'',search:'',mine:false};renderApp()">✕ مسح الفلاتر</button>
      </div>
    </div>` : '';

  const table = filtered.length
    ? `<div class="card table-card"><div class="table-wrap"><table class="data-table">
        <thead><tr><th>البلاغ</th><th>التاريخ</th><th>الموقع</th><th>نوع الطلب</th><th>التصنيف</th><th>الأولوية</th><th>الحالة</th><th>التكلفة</th><th>بواسطة</th><th>إجراء</th></tr></thead>
        <tbody>${filtered.map(r => {
          const by = userById(r.createdBy);
          return `<tr>
            <td><strong>${escapeHtml(r.id)}</strong></td>
            <td>${escapeHtml(r.date || '')}</td>
            <td>${escapeHtml(r.location || '')}</td>
            <td>${escapeHtml(r.type || '')}</td>
            <td>${escapeHtml(r.category || '')}</td>
            <td>${maintPriorityBadge(r.priority)}</td>
            <td>${maintStatusBadge(r.status)}</td>
            <td>${maintCost(r)} روبية</td>
            <td>${by ? escapeHtml(by.name) : '—'}</td>
            <td><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;align-items:center"><button class="btn-secondary" style="padding:4px 10px;font-size:12px" onclick="viewMaintReport('${r.id}')">عرض</button>${maintActionsFor(r, user)}</div></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div></div>`
    : `<div class="card"><p class="muted small">لا توجد بلاغات مطابقة${canCreate ? ' — سجّل بلاغًا جديدًا من الزر أعلاه' : ''}.</p></div>`;

  return `
  <div class="header-row">
    <h1 class="page-title">🔧 الصيانة والمرافق</h1>
    ${canCreate ? `<button class="btn-primary" onclick="openMaintForm()">+ تسجيل بلاغ</button>` : ''}
  </div>
  <p class="muted small" style="margin:0 0 14px">تسجيل ومتابعة أعمال الصيانة: المعلم يرفع البلاغ ← المساعد الإداري يتابع ← الوكيل يتخذ القرار ← التنفيذ والإغلاق بالتكلفة.</p>
  ${maintCanSeeStats(user) ? `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px">
    ${stat('إجمالي البلاغات', d.maintenance.length, '#0f4f88')}
    ${stat('جديدة', statusCount('جديد'), MAINT_STATUS_COLORS['جديد'])}
    ${stat('بانتظار اعتماد الوكيل', statusCount('بانتظار اعتماد الوكيل'), MAINT_STATUS_COLORS['بانتظار اعتماد الوكيل'])}
    ${stat('قيد التنفيذ', statusCount('قيد التنفيذ'), MAINT_STATUS_COLORS['قيد التنفيذ'])}
    ${stat('إجمالي التكلفة', totalCost.toLocaleString('ar-SA') + ' روبية', '#047857')}
  </div>` : ''}
  ${filterRow}
  ${table}`;
}

function viewMaintReport(id){
  const r = maintById(id);
  if(!r) return;
  const by = userById(r.createdBy);
  const img = r.image ? `<div style="margin-top:10px"><img src="${escapeHtml(r.image)}" alt="صورة قبل الصيانة" style="max-width:100%;max-height:300px;border-radius:12px;border:1px solid #e5e7eb" /></div>` : '';
  const reject = r.rejectReason ? `<div style="background:#fee2e2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:13px"><b>سبب الرفض:</b> ${escapeHtml(r.rejectReason)}</div>` : '';
  const tlSteps = MAINT_STATUS_ORDER.map((s, i) => {
    const idx = MAINT_STATUS_ORDER.indexOf(r.status);
    const done = i <= idx;
    const isRejected = r.status === 'مرفوض';
    return `<span style="font-size:12px;font-weight:${done ? '800' : '400'};color:${isRejected && i === 0 ? '#dc2626' : (done ? '#047857' : '#94a3b8')}">${done ? '✔ ' : ''}${s}</span>`;
  }).join(' <span style="color:#cbd5e1">←</span> ');
  const actions = maintActionsFor(r, currentUser());
  const rows = [
    dlRow('الرقم', r.id),
    dlRow('التاريخ', r.date || ''),
    dlRow('الموقع', r.location || ''),
    dlRow('نوع الطلب', r.type + (r.device ? ' — ' + r.device : '') + (r.inkType ? ' — حبر ' + r.inkType : '')),
    dlRow('التصنيف', r.category || ''),
    dlRow('الأولوية', r.priority || ''),
    dlRow('الحالة', r.status + (r.cost ? ' — التكلفة ' + maintCost(r) + ' روبية' : '')),
    dlRow('بواسطة', by ? by.name : '—'),
    dlRow('الوصف', r.description || '')
  ].join('');
  openDetails('تفاصيل البلاغ ' + r.id,
    rows + reject + img + (r.rejectReason || r.image ? '' : '') +
    `<li class="dl-item"><div style="font-size:12px;color:#64748b;font-weight:700;margin-bottom:6px">مسار البلاغ</div><div>${tlSteps}</div></li>` +
    (actions ? `<li class="dl-item"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${actions}</div></li>` : '')
  );
}

function maintResetCascades(){
  const f = document.getElementById('maintFloor');
  if(f) f.innerHTML = '<option value="">اختر المنطقة أولاً</option>';
  const l = document.getElementById('maintLoc');
  if(l) l.innerHTML = '<option value="">اختر الدور أولاً</option>';
}
function maintUpdateFloors(){
  const area = document.getElementById('maintArea').value;
  const floor = document.getElementById('maintFloor');
  floor.innerHTML = '<option value="">اختر الدور</option>';
  if(!area){ maintResetCascades(); return; }
  Object.keys(MAINT_LOCATIONS[area]).forEach(item => { const o = document.createElement('option'); o.value = item; o.textContent = item; floor.appendChild(o); });
  document.getElementById('maintLoc').innerHTML = '<option value="">اختر الدور أولاً</option>';
}
function maintUpdateLocations(){
  const area = document.getElementById('maintArea').value;
  const floor = document.getElementById('maintFloor').value;
  const loc = document.getElementById('maintLoc');
  loc.innerHTML = '<option value="">اختر الموقع</option>';
  if(!area || !floor) return;
  MAINT_LOCATIONS[area][floor].forEach(item => { const o = document.createElement('option'); o.value = item; o.textContent = item; loc.appendChild(o); });
}
function maintUpdateRequestFields(){
  const type = document.getElementById('maintType').value;
  const device = document.getElementById('maintDeviceField');
  const ink = document.getElementById('maintInkField');
  device.classList.toggle('hidden', !(type === 'تغيير حبر' || type === 'تغيير قطعة'));
  ink.classList.toggle('hidden', type !== 'تغيير حبر');
}

function openMaintForm(id){
  maintEditId = id || null;
  maintImageData = null;
  const d = loadDB();
  const isEdit = !!maintEditId;
  const r = isEdit ? maintById(maintEditId) : null;
  if(isEdit && !r){ maintEditId = null; }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box" style="max-width:760px">
    <div class="modal-head">
      <h3>${isEdit ? 'تعديل البلاغ ' + escapeHtml(r.id) : 'تسجيل بلاغ صيانة'}</h3>
      <button class="modal-close" onclick="closeMaintForm()">✕</button>
    </div>
    <div id="maintFormError" class="error-box" style="display:none"></div>
    <div style="background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:14px;margin-bottom:14px">

function saveMaintReport(){
  const err = document.getElementById('maintFormError');
  const showErr = m => { err.textContent = m; err.style.display = 'block'; };
  const area = document.getElementById('maintArea').value;
  const floor = document.getElementById('maintFloor').value;
  const loc = document.getElementById('maintLoc').value;
  const details = document.getElementById('maintLocDetails').value.trim();
  const type = document.getElementById('maintType').value;
  const category = document.getElementById('maintCategory').value;
  const priority = document.getElementById('maintPriority').value;
  const device = document.getElementById('maintDevice').value;
  const inkType = document.getElementById('maintInk').value;
  const description = document.getElementById('maintDesc').value.trim();
  if(!area || !floor || !loc){ showErr('يجب تحديد الموقع كاملًا (المنطقة والدور والموقع).'); return; }
  if(!type){ showErr('يجب اختيار نوع الطلب.'); return; }
  if(!category){ showErr('يجب اختيار التصنيف.'); return; }
  if(!description){ showErr('يجب كتابة وصف المشكلة أو الطلب.'); return; }
  if((type === 'تغيير حبر' || type === 'تغيير قطعة') && !device){ showErr('يجب اختيار الجهاز لهذا النوع من الطلبات.'); return; }

  const parts = [area, floor, loc]; if(details) parts.push(details);
  const d = loadDB();
  const user = currentUser();
  d.maintenance = d.maintenance || [];
  if(maintEditId){
    const r = d.maintenance.find(x => x.id === maintEditId);
    if(r){
      r.area = area; r.floor = floor; r.loc = loc; r.details = details;
      r.location = parts.join(' - ');
      r.type = type; r.category = category; r.priority = priority;
      r.device = device || undefined; r.inkType = (type === 'تغيير حبر') ? inkType : undefined;
      r.description = description;
      if(maintImageData) r.image = maintImageData;
      r.updatedAt = new Date().toISOString();
      if(r.status === 'مرفوض'){ r.status = 'جديد'; r.rejectReason = undefined; r.rejectedAt = undefined; r.rejectedBy = undefined; }
    }
  } else {
    d.maintenance.unshift({
      id: maintNextId(), date: todayStr(),
      area, floor, loc, details,
      location: parts.join(' - '),
      type, category, priority,
      device: device || undefined, inkType: (type === 'تغيير حبر') ? inkType : undefined,
      description,
      image: maintImageData || undefined,
      createdBy: user ? user.id : null, createdByName: user ? user.name : '',
      createdAt: new Date().toISOString(),
      status: 'جديد', cost: 0
    });
  }
  saveDB(d);
  closeMaintForm();
  renderApp();
}

function requestParticipation(id){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  const me = currentUser();
  if(!a || !me) return;
  const kind = document.getElementById('partKind').value.trim();
  if(!kind){ alert('اكتب نوع المشاركة المطلوبة (مثال: عمل مسابقة، لوحة جدارية)'); return; }
  a.requests = a.requests || [];
  if(a.requests.some(r => r.teacherId === me.id && r.status === 'PENDING')){ alert('لديك طلب قيد المراجعة بالفعل'); return; }
  a.requests.push({ id: uid(), teacherId: me.id, teacherName: me.name, kind, note: '', status: 'PENDING', createdAt: new Date().toISOString() });
  saveDB(d);
  renderApp();
}
function approveRequest(id, reqId){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  const r = (a?.requests || []).find(x => x.id === reqId);
  if(!a || !r) return;
  r.status = 'APPROVED';
  a.participants = a.participants || [];
  if(!a.participants.includes(r.teacherId)) a.participants.push(r.teacherId);
  saveDB(d);
  renderApp();
}
let rejectTarget = null;
function rejectRequest(id, reqId){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  const r = (a?.requests || []).find(x => x.id === reqId);
  if(!a || !r || r.status !== 'PENDING') return;
  rejectTarget = { id, reqId };
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box" style="max-width:420px">
    <div class="modal-head"><h3>✖ رفض طلب ${escapeHtml(r.teacherName || 'المعلم')}</h3><button class="modal-close" onclick="closeRejectModal()">✕</button></div>
    <div style="display:flex;flex-direction:column;gap:12px;padding:4px 0">
      <div><label style="display:block;font-weight:600;margin-bottom:6px">سبب الرفض (إلزامي)</label>
        <textarea id="rejReason" class="input" style="width:100%;min-height:80px;resize:vertical" maxlength="300" placeholder="اكتب سبب رفض طلب المشاركة — سيظهر للمعلم"></textarea></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn-primary" style="background:#dc2626;border-color:#dc2626" onclick="confirmReject()">✖ تأكيد الرفض</button>
        <button class="btn-secondary" onclick="closeRejectModal()">إلغاء</button>
      </div>
    </div>
  </div>`;
  overlay.onclick = e => { if(e.target === overlay) closeRejectModal(); };
  document.body.appendChild(overlay);
}
function closeRejectModal(){
  const ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
  rejectTarget = null;
}
function confirmReject(){
  if(!rejectTarget) return;
  const reason = document.getElementById('rejReason').value.trim();
  if(!reason){ alert('اكتب سبب الرفض أولاً'); return; }
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === rejectTarget.id);
  const r = (a?.requests || []).find(x => x.id === rejectTarget.reqId);
  if(!a || !r) return;
  r.status = 'REJECTED';
  r.reason = reason;
  saveDB(d);
  closeRejectModal();
  renderApp();
}
function pendingPartRequests(){
  const d = loadDB();
  return (d.activities || []).reduce((s, a) => s + (a.requests || []).filter(r => r.status === 'PENDING').length, 0);
}
function addParticipant(id){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  const pid = document.getElementById('partTeacher').value;
  if(!a || !pid) return;
  a.participants = a.participants || [];
  if(a.participants.includes(pid)) return;
  a.participants.push(pid);
  saveDB(d);
  renderApp();
}
function removeParticipant(id, pid){
  const d = loadDB();
  const a = (d.activities || []).find(x => x.id === id);
  if(!a) return;
  if(!confirm('إزالة هذا المعلم من قائمة المشاركين؟')) return;
  a.participants = (a.participants || []).filter(x => x !== pid);
  saveDB(d);
  renderApp();
}
// هل المعلم مشارك فعليًا في النشاط؟ (مضاف ضمن المشاركين، أو طلبه معتمد)
function isActivityParticipant(a, id){
  if(!a) return false;
  if((a.participants || []).includes(id)) return true;
  return (a.requests || []).some(r => r.teacherId === id && r.status === 'APPROVED');
}
// قائمة المشاركين الفعليين: من أُضيف مباشرة + من اعتُمد طلبهم
function activityPartIds(a){
  const ids = new Set(a.participants || []);
  (a.requests || []).forEach(r => { if(r.status === 'APPROVED') ids.add(r.teacherId); });
  return [...ids];
}

function computeReportRows(){

        return { 'التاريخ':a.date, 'الطالب':s?.fullName||'—', 'الرقم':s?.studentNo||'—', 'الصف':g?.name||'—', 'الفصل':c?.name||'—', 'الحالة':statusLabels[a.status] }; });

      .sort((a,b) => b.createdAt.localeCompare(a.createdAt))
      .map(n => { const s = studentById(n.studentId); const by = userById(n.createdBy);
        const pts = n.points ?? notePoints(n.type, n.category);
        return { 'التاريخ':n.createdAt.slice(0,10), 'الطالب':s?.fullName||'—', 'النوع':noteTypeLabels[n.type], 'الفئة':n.category, 'الوصف':n.description, 'بواسطة':by?.name||'—', 'النقاط':(pts>0?'+':'')+pts }; });
  } else if(type === 'transfers'){
    rows = d.transfers
      .filter(t => { const ss = studentIdsOf(t).map(id => studentById(id)).filter(Boolean); return ss.some(s => canSeeStudent(s.id) && (!classId || s?.classId===classId)) && (!from && !to || inRange(t.createdAt.slice(0,10))); })
      .sort((a,b) => b.createdAt.localeCompare(a.createdAt))
      .map(t => { const ss = studentIdsOf(t).map(id => studentById(id)).filter(Boolean); const by = userById(t.createdBy);
        return { 'التاريخ':t.createdAt.slice(0,10), 'الطالب': ss.map(s=>s?.fullName||'—').join('، ') || '—', 'إلى':targetLabel(t.target), 'الأولوية':priorityLabels[t.priority], 'السبب':t.reason, 'الحالة': t.status==='PENDING'?'قيد المتابعة':'تم الحل', 'بواسطة':by?.name||'—' }; });
  } else if(type === 'assignments'){
    const user = currentUser();
    const myClassIds = new Set(getClassesSorted().map(c => c.id));

    const rowsAll = clsAss.sort((a,b) => (b.created||0) - (a.created||0)).map(a => {

      const notDone = clsStudents.length - doneCount;
      const pct = clsStudents.length ? Math.round(doneCount/clsStudents.length*100) : 0;
      const notDoneNames = clsStudents.filter(s => !(a.completedBy||[]).includes(s.id)).map(s => s.fullName||'—').join('، ');
      return { 'التكليف': a.title||'—', 'المادة': a.subject||'—', 'النوع': a.type||'واجب', 'التاريخ': a.date||'—', 'الصف': g?.name||'—', 'الفصل': cls?.name||'—', 'العدد': clsStudents.length, 'نفّذوا': doneCount, 'لم ينفّذوا': notDone, 'النسبة': pct+'%', 'من لم ينفّذوا': notDoneNames || '—' };

      // الأصل الحضور: كل طالب حاضرة افتراضيًا ما لم يُسجَّل له غياب/تأخر في اليوم

        return { 'التاريخ': m.createdAt.slice(0,10), 'الوقت': fmtTime(m.createdAt), 'المرسل': m.senderName || tl(roleLabels[m.senderRole] || m.senderRole || '—'), 'المرسل إليه': m.teacherName || (m.teacherId==='ALL' ? tl('جميع المعلمين') : '—'), 'الرسالة': m.text, 'الاطلاع': Object.keys(m.seenBy||{}).length||0, 'الحالة': st, 'أخفاها': m.dismissedBy || '—' };
      });
  } else if(type === 'activities'){
    const inActs = (d.activities || []).filter(a => inRange(a.date));
    const total = inActs.length;
    const teachers = d.users.filter(u => (u.role === 'TEACHER' || u.role === 'COUNSELOR') && u.active).sort((a,b) => String(a.name).localeCompare(String(b.name)));
    rows = teachers.map(tc => {
      const mine = inActs.filter(a => isActivityParticipant(a, tc.id));
      const pct = total ? Math.round(mine.length / total * 100) : 0;
      return { 'المشارك': tc.name, 'عدد الأنشطة المشارك فيها': mine.length, 'الأنشطة المشارك فيها': mine.length ? mine.map(a => a.name).join('، ') : '—', 'إجمالي الأنشطة': total, 'نسبة المشاركة': pct + '%' };
    }).sort((a,b) => (parseInt(b['عدد الأنشطة المشارك فيها'])||0) - (parseInt(a['عدد الأنشطة المشارك فيها'])||0));
  } else if(type === 'maintenance'){
    rows = (d.maintenance || [])
      .filter(m => inRange(m.date))
      .sort((a,b) => String(b.date).localeCompare(String(a.date)))
      .map(m => ({
        'الرقم': m.id || '—',
        'التاريخ': m.date || (m.createdAt || '').slice(0,10),
        'الموقع': m.location || '—',
        'النوع': m.type || '—',
        'التصنيف': m.category || '—',
        'الأولوية': m.priority || '—',
        'الحالة': m.status || '—',
        'التكلفة': Number(m.cost || 0).toLocaleString('ar-SA') + ' روبية',
        'المبلِّغ': m.createdByName || '—',
        'الوصف': m.description || '—'
      }));
  } else if(type === 'teacher_engagement'){
    const pr = engagementPeriodRange(reportState.period);
    const eIn = ds => (!pr.from || ds >= pr.from) && (!pr.to || ds <= pr.to);
    const teachers = d.users.filter(u => u.role === 'TEACHER' && u.active).sort((a,b) => String(a.name).localeCompare(String(b.name),'ar'));
    rows = teachers.map(tc => {
      const id = tc.id;
      const att = d.attendance.filter(a => a.createdBy === id && eIn(a.date)).length;
      const notes = d.notes.filter(n => n.createdBy === id && eIn(n.createdAt.slice(0,10))).length;
      const trans = d.transfers.filter(t => t.createdBy === id && eIn(t.createdAt.slice(0,10))).length;
      const actsCreated = (d.activities || []).filter(a => a.createdBy === id && eIn((a.createdAt || '').slice(0,10))).length;
      const actsJoined = (d.activities || []).filter(a => isActivityParticipant(a, id) && eIn((a.createdAt || '').slice(0,10))).length;

      const esc = (d.escapeAlerts || []).filter(e => e.teacherId === id && eIn((e.createdAt || '').slice(0,10))).length;
      const total = att + notes*2 + trans*2 + actsCreated*3 + actsJoined*2 + vids + esc*2;
      return { 'المعلم': tc.name, 'الحضور المسجل': att, 'الملاحظات': notes, 'التحويلات': trans, 'أنشطة منشأة': actsCreated, 'مشاركة أنشطة': actsJoined, 'فيديوهات': vids, 'تنبيهات هروب': esc, 'إجمالي التفاعل': total };

  }

function engagementPeriodRange(period){
  const now = new Date();
  const today = localDateKey(now);
  const y = now.getFullYear(), m = now.getMonth();
  if(period === 'day') return { from: today, to: today };
  if(period === 'week'){
    const mon = new Date(now);
    mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    return { from: localDateKey(mon), to: today };
  }
  if(period === 'month') return { from: y + '-' + String(m+1).padStart(2,'0') + '-01', to: today };
  if(period === 'term'){
    let from;
    if(m >= 8) from = y + '-09-01';                 // الفصل الأول: سبتمبر–نوفمبر
    else if(m === 11) from = y + '-12-01';          // الفصل الثاني: ديسمبر–فبراير
    else if(m <= 1) from = (y-1) + '-12-01';        // يناير–فبراير: بداية الفصل الثاني
    else from = y + '-03-01';                       // الفصل الثالث: مارس–يونيو
    return { from, to: today };
  }
  return { from: (m >= 8 ? y : y-1) + '-09-01', to: today }; // من بداية العام الدراسي (سبتمبر)
}
function renderReportTable(rows){
  if(rows.length === 0) return `<div class="card" style="text-align:center;padding:32px;color:#9ca3af">لا توجد بيانات مطابقة</div>`;
  const cols = Object.keys(rows[0]);
  return `<div class="card table-card"><table class="data-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c=>`<td>${escapeHtml(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
// أي عمود يُجمَّع عليه الرسم البياني حسب نوع التقرير
const reportChartCol = { attendance:'الحالة', absence:'الصف', late:'الصف', notes:'الطالب', transfers:'إلى', class_summary:null, messages:'الحالة', activities:null, maintenance:'الحالة' };
function buildChartData(type, rows){
  if(type === 'class_summary'){
    return rows.map(r => ({ label:(r['الصف']||'')+' - '+(r['الفصل']||''), value:parseInt(r['نسبة الحضور'])||0, unit:'%' }));
  }
  if(type === 'activities'){
    return rows.map(r => ({ label: r['المشارك'], value: parseInt(r['عدد الأنشطة المشارك فيها']) || 0 }));
  }
  if(type === 'teacher_engagement'){
    return rows.map(r => ({ label: r['المعلم'], value: parseInt(r['إجمالي التفاعل']) || 0, unit:'' }));
  }
  if(type === 'notes'){
    const sums = {};
    rows.forEach(r => { const k = r['الطالب'] || '—'; const v = parseInt(r['النقاط']) || 0; sums[k] = (sums[k]||0) + v; });
    return Object.entries(sums).map(([label, value]) => ({ label, value, color: value >= 0 ? '#16a34a' : '#dc2626' }));
  }
  const col = reportChartCol[type];
  const counts = {};
  rows.forEach(r => { const k = r[col] || '—'; counts[k] = (counts[k]||0) + 1; });
  return Object.entries(counts).map(([label, value]) => ({ label, value }));
}
function renderBars(data){
  if(data.length === 0) return '<p class="muted small">لا توجد بيانات</p>';
  const vals = data.map(d => d.value);
  const max = Math.max(...vals, 1);
  const min = Math.min(...vals, 0);
  const span = (max - min) || 1;
  const barColor = (d,i) => d.color || chartColors[i%chartColors.length];
  const valColor = v => v >= 0 ? '#16a34a' : '#dc2626';
  return `<div class="card"><div style="padding:6px">` + data.map((d,i)=> {
    const w = Math.max(2, (d.value - min)/span*100);
    return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="width:150px;font-size:13px;color:#374151;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(d.label)}</span>
      <div style="flex:1;height:26px;background:#f3f4f6;border-radius:6px;overflow:hidden;position:relative">
        ${min < 0 ? `<div style="position:absolute;left:${(0-min)/span*100}%;top:0;bottom:0;width:2px;background:#d1d5db;z-index:2"></div>` : ''}
        <div style="width:${w}%;height:100%;background:${barColor(d,i)};border-radius:6px;transition:width .4s"></div>
      </div>
      <span style="width:64px;font-size:13px;font-weight:700;color:${valColor(d.value)};text-align:center">${d.value>0?'+':''}${d.value}${d.unit||''}</span>
    </div>`;
  }).join('') + `</div></div>`;
}
function renderPie(data){
  if(data.length === 0) return '<p class="muted small">لا توجد بيانات</p>';
  const total = data.reduce((s,d)=>s+Math.abs(d.value),0) || 1;
  let acc = 0;
  const stops = data.map((d,i)=>{
    const from = acc/total*100; acc += Math.abs(d.value);
    const to = acc/total*100;
    return `${d.color || chartColors[i%chartColors.length]} ${from}% ${to}%`;
  }).join(',');
  const legend = data.map((d,i)=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="width:14px;height:14px;border-radius:4px;background:${d.color || chartColors[i%chartColors.length]}"></span>
      <span style="font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(d.label)}</span>
      <span style="font-size:13px;font-weight:700;color:${d.value>=0?'#16a34a':'#dc2626'}">${d.value>0?'+':''}${d.value} (${Math.round(Math.abs(d.value)/total*100)}%)</span>
    </div>`).join('');
  return `<div class="card"><div style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:12px">
    <div style="width:180px;height:180px;border-radius:50%;background:conic-gradient(${stops});position:relative;flex-shrink:0">
      <div style="position:absolute;inset:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#374151;font-size:20px">${total}</div>
    </div>
    <div style="flex:1;min-width:220px">${legend}</div>
  </div></div>`;
}
function renderReportResult(rows){
  if(reportState.type === 'teacher_engagement') return renderColumns(buildChartData(reportState.type, rows));
  if(reportState.view === 'bars') return renderBars(buildChartData(reportState.type, rows));
  if(reportState.view === 'pie') return renderPie(buildChartData(reportState.type, rows));
  return renderReportTable(rows);
}
function renderColumns(data){
  if(data.length === 0) return '<p class="muted small">لا توجد بيانات</p>';

      const h = Math.round(d.value / max * 100);
      const color = d.color || chartColors[i % chartColors.length];

      <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:52px;flex:1">

        <div title="${escapeHtml(d.label)} — ${d.value}" style="width:80%;height:${h}%;min-height:2px;background:${color};border-radius:6px 6px 0 0"></div>
        <div style="font-size:11px;color:#374151;margin-top:6px;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(d.label)}">${escapeHtml(d.label)}</div>
      </div>`;
    }).join('')}
  </div></div>`;
}

function exportReport(){
  const rows = computeReportRows();
  if(rows.length === 0){ alert('لا توجد بيانات للتصدير'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  const title = tl(reportTypes.find(t => t.value===reportState.type)?.label || 'تقرير');

async function backupLoadList(){
  const el = document.getElementById('backupList');
  if(!el) return;
  try{
    const r = await fetch('/api/backups');
    const j = await r.json();
    if(!j || !j.recent){ el.innerHTML = 'تعذر تحميل القائمة'; return; }
    const block = school => {
      const rows = j.recent[school] || [];
      if(!rows.length) return `<div class="muted">لا توجد نسخ بعد — تُنشأ تلقائياً كل 30 دقيقة.</div>`;
      const campus = school === 'BOYS' ? 'بنين' : 'بنات';
      return rows.map(b => `
        <div style="display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #e2e8f0">
          <span>${campus} — ${(() => { try { return new Date(b.taken_at).toLocaleString('ar'); } catch(e){ return b.taken_at; } })()}</span>
          <button class="del-btn" style="color:#b91c1c" onclick="backupRestore(${b.id}, '${school}')">↩️ استرجاع</button>
        </div>`).join('');
    };
    el.innerHTML = `<div style="font-weight:700;color:#0d9488">البنين</div>` + block('BOYS') + `<div style="font-weight:700;color:#8b5cf6;margin-top:12px">البنات</div>` + block('GIRLS');
  }catch(e){
    el.innerHTML = 'تعذر الاتصال بالخادم';
  }
}
async function backupDownloadAll(){
  const pack = { meta:{ app:'nibras', takenAt:new Date().toISOString(), device:true, description:'نسخة كاملة (بنين + بنات)' }, BOYS:null, GIRLS:null };
  for(const s of ['BOYS','GIRLS']){
    try{
      const r = await fetch(SYNC_API + s);
      const j = await r.json();
      if(j && j.data) pack[s] = { ts: j.ts, data: j.data };
    }catch(e){}
  }
  if(!pack.BOYS && !pack.GIRLS){ alert('تعذر جلب البيانات'); return; }
  const blob = new Blob([JSON.stringify(pack, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nibras-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  try{ localStorage.setItem('nibras_lastBackup', new Date().toISOString()); }catch(e){}
}
async function backupRestore(id, school){
  if(!confirm('إعادة بيانات قسم ' + (school === 'BOYS' ? 'البنين' : 'البنات') + ' إلى هذه النسخة؟ ستُكتب فوق البيانات الحالية. هل تريد المتابعة؟')) return;
  if(!confirm('تأكيد أخير: أُعدت بيانات القسم فعلاً وستحل مكان الحالية نهائياً؟')) return;
  try{
    const r = await fetch('/api/backups/restore', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ id })
    });
    const j = await r.json();
    if(j.ok){
      alert('تم الاسترجاع — سيتحدّث الجميع تلقائياً بمجرد فتح التطبيق.');
      try{ if(window.__syncPull) __syncPull(school); }catch(e){}
      backupLoadList();
    }else{
      alert('فشل الاسترجاع: ' + (j.error || 'خطأ'));
    }
  }catch(e){
    alert('خطأ في الاتصال بالخادم');
  }
}
async function backupRestoreFromFile(input){
  const el = document.getElementById('backupFileMsg');
  const file = input && input.files && input.files[0];
  if(!file){ return; }
  try{
    const text = await file.text();
    const obj = JSON.parse(text);
    const schools = [];
    if(obj && obj.BOYS && obj.BOYS.data && Array.isArray(obj.BOYS.data.users)) schools.push('BOYS');
    if(obj && obj.GIRLS && obj.GIRLS.data && Array.isArray(obj.GIRLS.data.users)) schools.push('GIRLS');
    if(!schools.length){ el.textContent = '⚠️ الملف ليس نسخة احتياطية صحيحة (لا يحوي بيانات المستخدمين).'; return; }
    const names = schools.map(s => s === 'BOYS' ? 'البنين' : 'البنات').join(' و');
    if(!confirm('سيُعاد كل شيء (بما فيه الفصول والطلاب والجدول والغياب) لقسم ' + names + ' من هذا الملف، وتُستبدل البيانات الحالية. متابعة؟')){ input.value=''; return; }
    if(!confirm('تأكيد أخير قبل الكتابة فوق البيانات الحالية — متابعة؟')){ input.value=''; return; }
    const done = [];
    for(const s of schools){
      const r = await fetch('/api/backups/import', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ school: s, data: obj[s].data })
      });
      const j = await r.json();
      done.push((s === 'BOYS' ? 'البنين' : 'البنات') + (j.ok ? ' ✓' : ' ✗ ' + (j.error || 'خطأ')));
      if(j.ok){ try{ if(window.__syncPull) __syncPull(s); }catch(e){} }
    }
    el.textContent = 'النتيجة: ' + done.join(' — ') + '. أكمل على الأجهزة الأخرى تلقائياً بعد فتح التطبيق.';
    input.value = '';
  }catch(e){
    el.textContent = '⚠️ تعذّر قراءة الملف — تأكد أنه «nibras-backup-… .json» ولم يعدّل.';
  }
}

/* اقتراحات رسالة اليوم: المعلم/الوكيل يقترحون → المدير يوافق → تظهر للجميع */
function suggestionsKey(school){ return 'nibras_' + (school || getActiveSchool()) + '_suggestions_v1'; }
function loadSuggestions(school){
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(suggestionsKey(school)) || '[]'); } catch(e){ arr = []; }
  return Array.isArray(arr) ? arr : [];
}
// المدير يرى اقتراحات القسمين معًا (بنين وبنات)، وغيره يرى اقتراحات قسمه فقط
function loadSuggestionsAll(){
  const u = currentUser();
  if(u && u.role === 'ADMIN'){
    return [
      ...loadSuggestions('BOYS').map(s => ({ ...s, _school:'BOYS' })),
      ...loadSuggestions('GIRLS').map(s => ({ ...s, _school:'GIRLS' })),
    ];
  }
  return loadSuggestions().map(s => ({ ...s, _school: getActiveSchool() }));
}
function saveSuggestions(arr, school){ localStorage.setItem(suggestionsKey(school || getActiveSchool()), JSON.stringify(arr)); }
function wordCount(text){ return String(text||'').trim().split(/\s+/).filter(Boolean).length; }
function updateSugCount(){
  const el = document.getElementById('sugText');
  const cEl = document.getElementById('sugCount');
  if(!el || !cEl) return;
  const n = wordCount(el.value);
  cEl.textContent = n + ' / 30 كلمة';
  cEl.style.color = n > 30 ? '#dc2626' : '#6b7280';
}
function suggestAnnouncement(){
  const text = (document.getElementById('sugText')?.value || '').trim();
  if(!text){ alert('اكتب عبارة تحفيزية أولاً'); return; }
  const n = wordCount(text);
  if(n > 30){ alert('العبارة التحفيزية لا تزيد على 30 كلمة — كتبت ' + n + ' كلمة'); return; }
  const user = currentUser();
  const arr = loadSuggestions();
  if(arr.some(s => s.authorId === user.id && s.status === 'PENDING')){ alert('لديك اقتراح قيد المراجعة من المدير — انتظر الرد أولاً'); return; }
  arr.push({ id: uid(), authorId: user.id, authorName: user.name, authorRole: user.role, text, words: n, createdAt: new Date().toISOString(), status:'PENDING' });
  saveSuggestions(arr);
  renderApp();
  alert('تم إرسال اقتراحك إلى المدير للموافقة عليه ✅');
}
function approveSuggestion(id){
  const s = loadSuggestionsAll().find(x => x.id === id);
  if(!s || s.status !== 'PENDING') return;
  if(!confirm('اعتماد هذه العبارة كرسالة اليوم؟')) return;
  const school = s._school || getActiveSchool();
  localStorage.setItem(ANNOUNCEMENT_KEY(school), s.text);
  localStorage.setItem(ANNOUNCEMENT_SENDER_KEY(school), s.authorName + ' (' + roleLabel(s.authorRole) + ')');
  const arr = loadSuggestions(school);
  const t = arr.find(x => x.id === id);
  if(t){ t.status = 'APPROVED'; t.approvedAt = new Date().toISOString(); }
  saveSuggestions(arr, school);
  renderApp();
  alert('تم اعتماد العبارة وستظهر في رسالة اليوم للجميع ✅');
}
function rejectSuggestion(id){
  const s = loadSuggestionsAll().find(x => x.id === id);
  if(!s || s.status !== 'PENDING') return;
  if(!confirm('رفض هذا الاقتراح؟')) return;
  const school = s._school || getActiveSchool();
  const arr = loadSuggestions(school);
  const t = arr.find(x => x.id === id);
  if(t){ t.status = 'REJECTED'; t.rejectedAt = new Date().toISOString(); }
  saveSuggestions(arr, school);
  renderApp();
}
function fmtTime(iso){
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
  } catch(e){ return iso; }
}
function saveAnnouncement(){
  const text = document.getElementById('announceText').value.trim();
  const school = getActiveSchool();
  if(text){ localStorage.setItem(ANNOUNCEMENT_KEY(school), text); }
  else { localStorage.removeItem(ANNOUNCEMENT_KEY(school)); }
  localStorage.removeItem(ANNOUNCEMENT_SENDER_KEY(school));
  renderApp();
}

}
/* ============ لافتة تثبيت التطبيق على الجوال ============ */
var __deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  __deferredInstallPrompt = e;
  maybeShowInstallHint(true);
});
window.addEventListener('appinstalled', function(){
  __deferredInstallPrompt = null;
  removeInstallHint();
  try{ localStorage.setItem('nibrasInstallHintDismissed', '1'); }catch(err){}
});
function removeInstallHint(){
  var el = document.getElementById('installHintBar');
  if(el && el.parentNode) el.parentNode.removeChild(el);
}
function dismissInstallHint(){
  removeInstallHint();
  try{ localStorage.setItem('nibrasInstallHintDismissed', '1'); }catch(err){}
}
function doInstallApp(){
  if(__deferredInstallPrompt){
    __deferredInstallPrompt.prompt();
    __deferredInstallPrompt.userChoice.then(function(){ __deferredInstallPrompt = null; });
  } else {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if(isIOS){ openInstallGuide(); }
    else { alert('لا يمكن التثبيت من هذا المتصفح — استخدم Google Chrome أو Edge على الجوال.'); }
  }
}
function openInstallGuide(){
  if(!document.body){ setTimeout(openInstallGuide, 300); return; }
  removeInstallHint();
  var ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.alignItems = 'center';
  var step = function(n, t, d){ return '<div style="display:flex;gap:12px;align-items:flex-start;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px"><div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:linear-gradient(135deg,#0f4f88,#1d7fd6);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px">'+n+'</div><div><div style="font-weight:700;font-size:13.5px;color:#111827">'+t+'</div><div style="font-size:12.5px;color:#6b7280;margin-top:3px;line-height:1.6">'+d+'</div></div></div>'; };
  var html = '';
  if(isIOS){
    html = '<div class="modal-head"><h3>📲 إضافة نبراس إلى شاشة الآيفون</h3><button class="modal-close" onclick="closeInstallGuide()">✕</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «مشاركة» ⬆', 'في المتصفح (سفاري) أسفل الشاشة تجد زر المشاركة على شكل مربع مع سهم لأعلى — اضغط عليه.') +
      step('2', 'اختر «إضافة إلى الشاشة الرئيسية»', 'من القائمة المنبثقة ابحث عن خيار «إضافة إلى الشاشة الرئيسية» (Add to Home Screen) واضغط عليه.') +
      step('3', 'اضغط «إضافة»', 'سيُطلب منك تأكيد الاسم — اضغط «إضافة» أعلى اليمين، وستجد الأيقونة على شاشتك الرئيسية.') +
      '</div>';
  } else {
    html = '<div class="modal-head"><h3>📲 تثبيت نبراس على جهازك</h3><button class="modal-close" onclick="closeInstallGuide()">✕</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      step('1', 'اضغط زر «تثبيت» أدناه', 'سيعرض المتصفح نافذة تأكيد التثبيت.') +
      step('2', 'اضغط «تثبيت» في النافذة', 'ستضاف أيقونة نبراس إلى الشاشة الرئيسية.') +
      '<button class="btn-primary" style="margin-top:4px" onclick="doInstallApp()">⬇ تثبيت التطبيق الآن</button>' +
      '</div>';
  }
  overlay.innerHTML = '<div class="modal-box" style="max-width:460px">' + html + '</div>';
  overlay.onclick = function(e){ if(e.target === overlay) closeInstallGuide(); };
  document.body.appendChild(overlay);
}
function closeInstallGuide(){
  var ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
}
function maybeShowInstallHint(force){
  try{
    if(!force && localStorage.getItem('nibrasInstallHintDismissed')) return;
    var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(standalone) return;
    if(!document.body){ setTimeout(function(){ maybeShowInstallHint(force); }, 300); return; }
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isAndroid = /Android/.test(navigator.userAgent);
    var canInstall = __deferredInstallPrompt || isIOS || isAndroid;
    if(!canInstall) return;
    removeInstallHint();
    var d = document.createElement('div');
    d.id = 'installHintBar';
    d.className = 'install-hint';
    var tip = isIOS
      ? 'اضغط زر «مشاركة» ⬆ في المتصفح ثم «إضافة إلى الشاشة الرئيسية»'
      : 'ثبّت التطبيق على جهازك لفتحه من الشاشة الرئيسية';
    d.innerHTML = '<span style="font-size:20px">📲</span><span>' + tip + '</span><button class="btn-primary" style="padding:6px 14px;font-size:13px;flex-shrink:0" onclick="' + (isIOS ? 'openInstallGuide()' : 'doInstallApp()') + '">' + (isIOS ? 'كيف أثبّت؟' : 'تثبيت') + '</button><button class="close" title="إغلاق" onclick="dismissInstallHint()">✕</button>';
    document.body.appendChild(d);
  }catch(e){}
}
setTimeout(function(){ maybeShowInstallHint(false); }, 1200);
</script>
</body>
</html>

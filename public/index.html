/* ============ تفاصيل نقاط الطالب (نافذة منبثقة) ============ */
function studentNameLink(s, pts){
  if(!s) return '—';
  let badge = '';
  if(pts !== undefined){
    badge = ` <span style="display:inline-block;min-width:26px;text-align:center;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:800;background:${pts>=0?'#dcfce7':'#fee2e2'};color:${pts>=0?'#16a34a':'#dc2626'}" title="نقاط الطالب (ثواب/عقاب)">${pts>0?'+':''}${pts}</span>`;
  }
  return `<a href="javascript:void(0)" onclick="showStudentPoints('${s.id}')" style="color:inherit;text-decoration:none;border-bottom:1px dashed #cbd5e1;cursor:pointer" title="عرض تفاصيل النقاط">${escapeHtml(s.fullName)}</a>${badge}`;
}
function showStudentPoints(studentId){
  const d = loadDB();
  const s = studentById(studentId);
  if(!s) return;
  const cls = classById(s.classId);
  const items = pointItems(d).filter(it => it.studentId === studentId);
  items.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  let pos = 0, neg = 0;
  const rows = items.map(n => {
    const pts = n.points;
    if(pts >= 0) pos += pts; else neg += pts;
    const by = userById(n.createdBy);
    return `<tr>
      <td style="color:${n.type==='POSITIVE'?'#16a34a':'#dc2626'}">${n.type==='POSITIVE'?'🟢 إيجابية':'🔴 سلبية'}${n.kind==='att'?' ⏱':''}</td>
      <td>${escapeHtml(n.category)}</td>
      <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.description ? escapeHtml(n.description) : '—'}</td>
      <td>${escapeHtml(by?.name || '—')}</td>
      <td class="muted small">${new Date(n.createdAt).toLocaleDateString('ar-SA')}</td>
      <td style="font-weight:700;color:${pts>=0?'#16a34a':'#dc2626'}">${pts>0?'+':''}${pts}</td>
    </tr>`;
  }).join('');
  const net = pos + neg;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="card" style="width:min(720px,100%);max-height:86vh;overflow:auto;padding:20px">
      <div class="header-row">
        <h3 style="margin:0">${escapeHtml(s.fullName)} <span class="muted small">${cls ? escapeHtml(classLabel(cls)) : ''}${s.studentNo ? ' · ر. '+escapeHtml(s.studentNo) : ''}</span></h3>
        <button class="btn-secondary" onclick="this.closest('.card').parentElement.remove()">✕ إغلاق</button>
      </div>
      <div class="grid grid-3" style="margin-top:12px">
        <div class="card" style="padding:10px;text-align:center"><p class="muted small">نقاط الثواب</p><p class="stat-value green" style="font-size:20px">+${pos}</p></div>
        <div class="card" style="padding:10px;text-align:center"><p class="muted small">نقاط العقاب</p><p class="stat-value red" style="font-size:20px">${neg}</p></div>
        <div class="card" style="padding:10px;text-align:center"><p class="muted small">الصافي</p><p class="stat-value" style="font-size:20px;color:${net>=0?'#16a34a':'#dc2626'}">${net>0?'+':''}${net}</p></div>
      </div>
      <table class="data-table" style="margin-top:12px">
        <thead><tr><th>النوع</th><th>الفئة</th><th>الوصف</th><th>المعلم المانح</th><th>التاريخ</th><th>النقاط</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" style="text-align:center;padding:20px;color:#9ca3af">لا توجد سجلات نقاط لهذا الطالب</td></tr>`}</tbody>
      </table>
    </div>`;
  document.body.appendChild(overlay);
}

const MEMO_PHRASE = 'حان وقت تذكيرك — نسأل الله لك التوفيق 🌟';
function memoKey(){ return 'nibras_memo_' + (currentUser()?.id || 'guest') + '_v1'; }
function loadMemo(){
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(memoKey()) || '[]'); } catch(e){ arr = []; }
  return Array.isArray(arr) ? arr : [];
}
function saveMemo(arr){ try { localStorage.setItem(memoKey(), JSON.stringify(arr)); } catch(e){} }
/* ============ مفكرتي الشخصية ============ */
function notebookKey(){ return 'nibras_notebook_' + (currentUser()?.id || 'guest') + '_v1'; }
function loadNotebook(){
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(notebookKey()) || '[]'); } catch(e){ arr = []; }
  return Array.isArray(arr) ? arr : [];
}
function saveNotebook(arr){ try { localStorage.setItem(notebookKey(), JSON.stringify(arr)); } catch(e){} }
let notebookEditingId = null;
function notebookSaveBtnLabel(){ return notebookEditingId ? '💾 تحديث الملاحظة' : '💾 حفظ في المفكرة'; }
function notebookCancelBtnDisplay(){ return notebookEditingId ? '' : 'none'; }
function addNotebook(){
  const ta = document.getElementById('nbText');
  const text = (ta?.value || '').trim();
  if(!text){ alert('اكتب نص الملاحظة أولاً'); return; }
  const dateInp = document.getElementById('nbDate');
  const date = (dateInp?.value || todayStr());
  const arr = loadNotebook();
  if(notebookEditingId){
    const n = arr.find(x => x.id === notebookEditingId);
    if(n){ n.text = text; n.date = date; n.updatedAt = new Date().toISOString(); }
    notebookEditingId = null;
  } else {
    arr.push({ id: uid(), text, date, createdAt: new Date().toISOString(), updatedAt: null });
  }
  saveNotebook(arr);
  renderApp();
}
function startNotebookEdit(id){
  const arr = loadNotebook();
  const n = arr.find(x => x.id === id);
  if(!n) return;

/* فحص التذكيرات المستحقة: تُعرض في نافذة منبثقة مع صوت تنبيه */
function checkMemoReminders(){
  const user = currentUser();
  if(!user) return;
  const arr = loadMemo();
  const now = Date.now();
  const due = arr.filter(n => n.remindAt && !n.reminded && !n.done && new Date(n.remindAt).getTime() <= now);
  if(!due.length) return;
  due.forEach(n => { n.reminded = true; n.firstRemindAt = n.firstRemindAt || new Date().toISOString(); });

  try { playMsgAlert(); } catch(e){}
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const html = due.map(n => `<li style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;margin:6px 0"><strong>🔔</strong> ${escapeHtml(n.text)}</li>`).join('');

  document.body.appendChild(overlay);
  setTimeout(() => { try { playMsgAlert(); } catch(e){} }, 700);
}

/* ============ الطقس في إسلام آباد ============ */
const AR_DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const HIJRI_MONTHS = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
function hijriDateStr(){
  try{
    const now = new Date();
    for(const cal of ['islamic-umalqura', 'islamic', 'islamic-civil']){
      try{
        const fmt = new Intl.DateTimeFormat('en-u-ca-' + cal, { year:'numeric', month:'numeric', day:'numeric' });
        const parts = fmt.formatToParts(now);
        let y = 0, m = 0, d = 0;
        parts.forEach(p => { if(p.type === 'year') y = +p.value; else if(p.type === 'month') m = +p.value; else if(p.type === 'day') d = +p.value; });
        if(y && m >= 1 && m <= 12 && d) return `${d} ${HIJRI_MONTHS[m - 1]} ${y} هـ`;
      }catch(e){}
    }
  }catch(e){}
  return '';
}
function weatherCodeInfo(code){
  if(code === 0) return ['☀️', 'سماء صافية'];
  if(code <= 3) return ['⛅', 'غائم جزئيًا'];
  if(code <= 48) return ['🌫️', 'ضباب'];
  if(code <= 57) return ['🌦️', 'رذاذ خفيف'];
  if(code <= 67) return ['🌧️', 'مطر'];
  if(code <= 77) return ['🌨️', 'ثلوج'];
  if(code <= 82) return ['🌦️', 'زخات مطر'];
  if(code <= 99) return ['⛈️', 'عواصف رعدية'];
  return ['🌤️', 'طقس متغير'];
}
function clockTick(){
  const el = document.getElementById('clockLine');
  if(!el) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  el.innerHTML = `
    <div style="font-weight:800;color:var(--accent,#1d7fd6);font-size:16px;letter-spacing:1px;direction:ltr">🕐 ${hh}:${mm}:${ss}</div>
    <div style="font-size:10.5px;margin-top:1px">${AR_DAYS[now.getDay()]} ${now.getDate()} ${AR_MONTHS[now.getMonth()]} ${now.getFullYear()} — ${hijriDateStr()}</div>`;
}
function renderWeather(){
  const el = document.getElementById('weatherBox');
  if(!el) return;
  if(!window.__weatherClock){ window.__weatherClock = setInterval(clockTick, 1000); }
  const frame = inner => `
    <div class="info-card">
      <div class="muted small" id="clockLine" style="font-size:10.5px;line-height:1.4"></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px;flex-wrap:wrap">${inner}</div>
    </div>`;
  clockTick();
  fetch('https://api.open-meteo.com/v1/forecast?latitude=33.6844&longitude=73.0479&current_weather=true')
    .then(r => r.json())
    .then(d => {
      const cw = d && d.current_weather;
      if(!cw) throw new Error('no data');
      const [icon, label] = weatherCodeInfo(cw.weathercode);
      const t = Math.round(cw.temperature);
      el.innerHTML = frame(`
        <span style="font-size:26px">${icon}</span>
        <div>
          <div style="font-weight:800;font-size:19px;color:#eaf2fb">${t}°C</div>
          <div style="font-size:11px;color:rgba(255,255,255,.80)">${label} — إسلام آباد</div>
        </div>
        <span style="font-size:10.5px;color:rgba(255,255,255,.80)">💨 ${Math.round(cw.windspeed)} كم/س</span>`);
      clockTick();
    })
    .catch(() => { el.innerHTML = frame('<p class="muted small" style="margin:0">🌤 تعذر تحميل الطقس — تحقق من الاتصال بالإنترنت</p>'); });
}

/* ============ المتواجدون الآن من المعلمين/المعلمات (للمدير والوكلاء) ============ */
function presentNowInfo(school){
  const db = JSON.parse(localStorage.getItem('nibras_' + school + '_db_v1') || 'null');
  if(!db) return { n: 0, names: [], absentNames: [] };
  const cutoff = Date.now() - 3 * 60 * 1000;
  const teachers = (db.users || []).filter(u => u.role === 'TEACHER' && u.active);
  const present = teachers.filter(u => u.lastSeenAt && new Date(u.lastSeenAt).getTime() >= cutoff);
  const names = present.map(u => ({ name: u.name, online: true }));
  const absentNames = teachers.filter(u => !u.lastSeenAt || new Date(u.lastSeenAt).getTime() < cutoff).map(u => u.name);
  return { n: names.length, names, absentNames };
}
function touchTeacherPresence(){
  const user = currentUser();
  if(!user || user.role !== 'TEACHER') return;
  const school = getUserSchool();
  if(!school) return;
  const key = 'nibras_' + school + '_db_v1';
  const d = JSON.parse(localStorage.getItem(key) || 'null');
  if(!d) return;
  const t = d.users.find(u => u.id === user.id);
  if(t){
    t.lastSeenAt = new Date().toISOString();
    localStorage.setItem(key, JSON.stringify(d));
  }
}

/* ============ الرسوم البيانية ============ */
function renderCharts(d){
  const now = new Date();
  const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let att = d.attendance;
  // المعلم يرى إحصائيات فصوله فقط (المدير والوكيل يرون الكل)
  const user = currentUser();
  const visibleIds = new Set(getVisibleStudents().map(s => s.id));
  if(user && !isManager(user)){
    const classIds = new Set(getClassesSorted().map(c => c.id));
    att = att.filter(a => classIds.has(a.classId));
  }

  // 1) رسم بياني أسبوعي (الإثنين → الجمعة)
  const dayNames = {0:'الأحد',1:'الإثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة',6:'السبت'};
  const todayDow = now.getDay();
  // أقرب يوم إثنين
  const lastMon = new Date(now); lastMon.setDate(now.getDate() - ((todayDow + 6) % 7));
  const weekDays = [];
  for(let i=0; i<5; i++){
    const d = new Date(lastMon); d.setDate(lastMon.getDate() + i);
    const ds = fmt(d);
    const dayAtt = att.filter(a => a.date === ds);
    // الأصل الحضور: من لم يُسجَّل له غياب يُعتبر حاضرًا افتراضيًا
    const a = dayAtt.filter(a => a.status==='ABSENT').length;
    const l = dayAtt.filter(a => a.status==='LATE').length;
    const p = Math.max(0, visibleIds.size - a - l);
    const total = p + a + l;
    weekDays.push({ label:dayNames[d.getDay()], present:p, absent:a, late:l, total });
  }
  const maxDay = Math.max(...weekDays.map(w=>w.total||1));
  const weekChart = weekDays.map(w => {
    const pw = w.total>0 ? w.present/w.total : 0;
    const aw = w.total>0 ? w.absent/w.total : 0;
    const lw = w.total>0 ? w.late/w.total : 0;
    const barH = Math.max(18, w.total/maxDay*60);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="width:100%;max-width:26px;height:68px;display:flex;flex-direction:column;justify-content:flex-end;background:#f3f4f6;border-radius:4px 4px 0 0;overflow:hidden">
        <div style="height:${pw*barH}px;background:#16a34a;transition:height .3s"></div>
        <div style="height:${aw*barH}px;background:#dc2626;transition:height .3s"></div>
        <div style="height:${lw*barH}px;background:#d97706;transition:height .3s"></div>
      </div>
      <div style="font-size:10px;color:#6b7280">${w.label}</div>
      <div style="font-size:10px;color:#374151;font-weight:600">${w.present}/${w.absent}/${w.late}</div>
    </div>`;
  }).join('');

  // 2) رسم بياني شهري (مقارنة أسابيع الشهر)
  const year = now.getFullYear(), month = now.getMonth();
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month+1, 0);
  const weeks = [];
  let wkStart = new Date(monthStart);
  while(wkStart <= monthEnd){
    const wkEnd = new Date(wkStart); wkEnd.setDate(wkStart.getDate() + 6);
    if(wkEnd > monthEnd) wkEnd.setTime(monthEnd.getTime());
    const s = fmt(wkStart), e_ = fmt(wkEnd);
    const wAtt = att.filter(a => a.date >= s && a.date <= e_);
    const wP = wAtt.filter(a => a.status==='PRESENT').length;
    const wT = wAtt.length;
    weeks.push({ label:`${wkStart.getDate()}-${wkEnd.getDate()}`, rate:wT>0?Math.round(wP/wT*100):0, total:wT });
    wkStart.setDate(wkStart.getDate() + 7);
  }
  const maxWk = Math.max(...weeks.map(w=>w.rate||1));
  const monthChart = weeks.map(w => {
    const pct = w.rate;
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <span style="width:42px;font-size:11px;color:#6b7280;text-align:left">${w.label}</span>
      <div style="flex:1;height:14px;background:#f3f4f6;border-radius:999px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${pct>=75?'#16a34a':pct>=50?'#d97706':'#dc2626'};border-radius:999px;transition:width .3s"></div>
      </div>
      <span style="width:34px;font-size:11px;font-weight:600;color:#374151;text-align:center">${pct}%</span>
    </div>`;
  }).join('');

  // 3) رسم بياني فصلي (مقارنة أشهر الفصل الدراسي)
  const quarter = Math.floor(month / 3);
  const qMonths = [];
  for(let i=0; i<3; i++){
    const m = quarter*3 + i;
    const mStart = new Date(year, m, 1);
    const mEnd = new Date(year, m+1, 0);
    const s = fmt(mStart), e_ = fmt(mEnd);
    const mAtt = att.filter(a => a.date >= s && a.date <= e_);
    const mP = mAtt.filter(a => a.status==='PRESENT').length;
    const mT = mAtt.length;
    const mNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    qMonths.push({ label:mNames[m], rate:mT>0?Math.round(mP/mT*100):0, total:mT });
  }
  const maxQ = Math.max(...qMonths.map(m=>m.rate||1));
  const qChart = qMonths.map(m => {
    const pct = m.rate;
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <span style="width:48px;font-size:11px;color:#6b7280;text-align:left">${m.label}</span>
      <div style="flex:1;height:14px;background:#f3f4f6;border-radius:999px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${pct>=75?'#16a34a':pct>=50?'#d97706':'#dc2626'};border-radius:999px;transition:width .3s"></div>
      </div>
      <span style="width:34px;font-size:11px;font-weight:600;color:#374151;text-align:center">${pct}%</span>
    </div>`;
  }).join('');

  return `
  <div class="card" style="padding:14px">
    <p class="card-label" style="font-size:13px;margin-bottom:10px">📊 تحليلات مقارنة الغياب</p>
    <div class="grid grid-3" style="gap:12px">
      <div style="min-width:0">
        <div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:4px">📅 أسبوعي — آخر 5 أيام</div>
        <div style="display:flex;gap:3px;align-items:stretch;padding-top:6px">${weekChart}</div>
      </div>
      <div style="min-width:0">
        <div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:4px">📆 شهري — مقارنة الأسابيع</div>
        <div style="padding-top:6px">${monthChart||'<p class="muted small">لا توجد بيانات</p>'}</div>

// مصدر موحد لعناصر النقاط (ملاحظات + حضور) مع منع الازدواج:
// إذا سُجّل غياب/تأخر في الحضور فتُهمل الملاحظة اليدوية لنفس اليوم حتى لا تُخصم مرتين
const UNDONE_DEDUCTION = -4;
function pointItems(d){
  const items = [];
  const today = todayStr();
  d.notes.forEach(n => {
    items.push({ studentId:n.studentId, type:n.type, category:n.category, description:n.description, points:(n.points ?? notePoints(n.type, n.category)), createdBy:n.createdBy, createdAt:n.createdAt, kind:'note' });
  });
  d.attendance.forEach(a => {
    const pts = attendancePoints(a.status, a.lateMinutes);
    if(pts !== 0) items.push({ studentId:a.studentId, type:'NEGATIVE', category:a.status==='ABSENT'?'الغياب':'التأخر', description:'حسب سجل الحضور ('+a.date+')' + (a.lateMinutes ? ' — ' + a.lateMinutes + ' دقيقة' : ''), points:pts, createdBy:a.createdBy, createdAt:a.date+'T00:00:00.000Z', kind:'att' });
  });
  (d.assignments||[]).forEach(a => {
    if(!a.date || a.date > today) return;
    (d.students||[]).forEach(s => {
      if(!s.active || s.classId !== a.classId) return;
      const completed = (a.completedBy||[]).includes(s.id);
      if(completed) return;
      const existingNote = d.notes.find(n => n.studentId === s.id && n.category === 'عدم إنجاز الواجب' && n.assignmentId === a.id);
      if(!existingNote) items.push({ studentId:s.id, type:'NEGATIVE', category:'عدم إنجاز الواجب', description:'تكليف: ' + (a.title||'بدون عنوان') + ' (' + (a.date||'') + ')', points: UNDONE_DEDUCTION, createdBy:a.teacherId, createdAt:a.date+'T23:59:59.000Z', kind:'assign' });
    });
  });
  const attKeys = new Set(d.attendance.map(a => a.studentId + '|' + a.date + '|' + a.status));
  const doneAssignKeys = new Set((d.assignments||[]).flatMap(a => (a.completedBy||[]).map(sid => sid + '|' + a.id)));
  return items.filter(it => {
    if(it.kind === 'note' && (it.category === 'الغياب' || it.category === 'التأخر')){
      const date = it.createdAt ? String(it.createdAt).slice(0,10) : '';
      const status = it.category === 'الغياب' ? 'ABSENT' : 'LATE';
      if(date && attKeys.has(it.studentId + '|' + date + '|' + status)) return false;
    }
    if(it.kind === 'assign' && doneAssignKeys.has(it.studentId + '|' + (it.assignmentId||''))) return false;
    return true;
  });
}
function studentPointsMap(){
  const m = {};
  pointItems(loadDB()).forEach(it => {
    m[it.studentId] = (m[it.studentId]||0) + it.points;
  });
  return m;
}
function studentPointsSplit(){
  const m = {};
  pointItems(loadDB()).forEach(it => {
    if(!m[it.studentId]) m[it.studentId] = {pos:0, neg:0};
    if(it.points > 0) m[it.studentId].pos += it.points;
    else m[it.studentId].neg += it.points;
  });
  return m;
}
let studentsView = 'all';
let studentsSort = 'kashaf';
function setStudentsView(v){ studentsView = v; renderApp(); }
function setStudentsSort(v){ studentsSort = v; renderApp(); }
function sortStudentsForView(students){
  const ptsMap = studentPointsMap();
  return students.slice().sort((a,b) => {
    if(studentsSort === 'points'){
      const pa = ptsMap[a.id] || 0, pb = ptsMap[b.id] || 0;
      if(pb !== pa) return pb - pa;
    }
    const na = Number(a.studentNo) || 0, nb = Number(b.studentNo) || 0;
    if(na !== nb) return na - nb;
    return a.fullName.localeCompare(b.fullName,'ar');
  });
}

      ${isTeacher ? `<td style="font-size:12px;text-align:center"><span style="font-weight:700;color:${doneCount===totalAss&&totalAss>0?'#16a34a':doneCount>=totalAss*0.5?'#d97706':'#dc2626'}">${doneCount}/${totalAss}</span></td>` : ''}

function moveOneTeacher(id){

  if(idx === -1){ alert('المعلم غير موجود'); return; }

  fromDB.classes.forEach(c => {

  if(!toDB.users.some(x => x.email === u.email)){
    toDB.users.push(JSON.parse(JSON.stringify(u)));
  }
  fromDB.users.splice(idx, 1);
  localStorage.setItem('nibras_'+from+'_db_v1', JSON.stringify(fromDB));

function importTeachers(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);
    const d = loadDB();
    let created = 0, skipped = 0; const errors = []; const temps = [];

    if(__serverEnabled()){
      // وضع الخادم: كل سطر يُنشأ كحساب حقيقي بكلمة مرور مؤقتة تُعرض مرة واحدة
      for(const row of rows){
        const name = String(row['الاسم الكامل'] ?? '').trim();
        if(!name){ skipped++; errors.push('سطر بدون اسم'); continue; }
        let email = String(row['البريد الإلكتروني'] ?? '').trim();
        if(!email) email = name.replace(/\s+/g,'.').toLowerCase() + '@school.local';
        const genPw = 'IniT@' + Math.random().toString(36).slice(2,8) + 'Z';
        const prefUser = String(row['اسم المستخدم'] ?? row['اسم المستخدم (اختياري)'] ?? '').trim();
        const r = await __api('POST', 'admin/create-user', { name, email, role:'TEACHER', password: genPw, username: prefUser });
        if(r.status === 200 && r.j && r.j.ok){ created++; const uname = (r.j.user && r.j.user.username) || ''; temps.push(`${name} | دخول: ${uname} | ${genPw}`); }
        else { skipped++; errors.push(`تعذر إنشاء "${name}"`); }
      }
      await __refreshSchool(getActiveSchool());
    } else {
      rows.forEach((row, i) => {
        const name = String(row['الاسم الكامل'] ?? '').trim();
        if(!name){ skipped++; errors.push(`السطر ${i+2}: الاسم فارغ`); return; }
        let email = String(row['البريد الإلكتروني'] ?? '').trim();
        if(!email) email = name.replace(/\s+/g,'.').toLowerCase() + '@school.local';
        const password = String(row['كلمة المرور'] ?? '').trim() || '12345678';
        const prefUser = String(row['اسم المستخدم'] ?? row['اسم المستخدم (اختياري)'] ?? '').trim();
        d.users.push({ id:uid(), name, email, username: makeLocalUsername(prefUser || email.split('@')[0]), password, role:'TEACHER', active:true, firstLogin:true, whatsapp:'' });
        created++;
      });
      saveDB(d);
    }

    evt.target.value = '';
    renderApp();
    setTimeout(() => {
      const box = document.getElementById('importTeacherResult');
      if(box){
        box.innerHTML = `<div class="card mb"><p style="font-weight:600">تم استيراد ${created} معلم${skipped>0?` — تم تجاوز ${skipped} سطر`:''}</p>${temps.length?`<p style="font-size:12px;color:#b45309;margin:6px 0 0">كلمات المرور المؤقتة (تظهر مرة واحدة فقط):</p><div style="direction:ltr;font-size:12px;margin:4px 0 0;max-height:120px;overflow:auto">${temps.map(escapeHtml).join('<br>')}</div>`:''}${errors.length?`<ul class="small" style="color:#dc2626;margin:8px 0 0;padding-inline-start:18px">${errors.slice(0,20).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul>`:''}</div>`;
      }
    }, 0);
  };
  reader.readAsArrayBuffer(file);
}

function importStudents(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);
    if(rows.length === 0){ alert('الملف فارغ'); return; }
    const d = loadDB();
    // كشف أسماء الأعمدة الفعلية
    const cols = Object.keys(rows[0]);
    // دالة مساعدة للبحث عن عمود بأحد الأسماء المرشحة
    const col = (candidates) => { const c = cols.find(k => candidates.some(can => k.includes(can))); return c||''; };
    const nameCol = col(['الاسم','اسم','Name','name']);
    const gradeCol = col(['الصف','صف','Grade','grade']);
    if(!nameCol){ alert(`لم أجد عمود "الاسم" في الملف.\nالأعمدة الموجودة:\n${cols.join('، ')}`); return; }
    if(!gradeCol){ alert(`لم أجد عمود "الصف" في الملف.\nالأعمدة الموجودة:\n${cols.join('، ')}`); return; }
    let created = 0, skipped = 0; const errors = [];

    rows.forEach((row, i) => {
      const fullName = String(row[nameCol] ?? '').trim();
      const gradeName = String(row[gradeCol] ?? '').trim();
      if(!fullName || !gradeName){ skipped++; errors.push(`السطر ${i+2}: الاسم أو الصف فارغ`); return; }

      let grade = d.grades.find(g => g.name === gradeName);
      if(!grade){ grade = { id:uid(), name:gradeName, order: d.grades.length }; d.grades.push(grade); }
      const campus = getActiveSchool();
      let cls = d.classes.find(c => c.gradeId===grade.id && c.name==='أ');
      if(!cls){ cls = { id:uid(), gradeId:grade.id, name:'أ', campus, capacity:null, teacherIds:[] }; d.classes.push(cls); }

      const seq = (d.students.filter(s => s.classId === cls.id && s.active).length) + 1;
      const studentNo = String(seq).padStart(4,'0');

      const existing = d.students.find(s => s.studentNo === studentNo && s.classId === cls.id);
      if(existing){
        existing.fullName = fullName; existing.active = true;
      } else {
        d.students.push({ id:uid(), fullName, studentNo, classId:cls.id, guardianName:'', guardianPhone:'', active:true });
      }
      created++;
    });

    saveDB(d);
    evt.target.value = '';
    renderApp();
    setTimeout(() => {
      const box = document.getElementById('importResult');
      if(box){
        box.innerHTML = `<div class="card mb"><p style="font-weight:600">تم استيراد ${created} طالب${skipped>0?` — تم تجاوز ${skipped} سطر`:''}</p>${errors.length?`<ul class="small" style="color:#dc2626;margin:8px 0 0;padding-inline-start:18px">${errors.slice(0,20).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul>`:''}</div>`;
      }
    }, 0);
  };
  reader.readAsArrayBuffer(file);
}

let attendanceState = { classId:null, date: todayStr(), draft:{}, absenceType:{}, sLateType:{}, sLateMin:{}, tDraft:{}, tLateType:{}, tLateMin:{}, absencePrompted:false };

  const d = loadDB();

  if(!attendanceState.date || attendanceState.date < todayStr()) attendanceState.date = todayStr();
  const isTeachers = canManageTeachers(currentUser()) && attendanceState.classId === 'TEACHERS';
  if(classes.length === 0 && !isTeachers) attendanceState.classId = canManageTeachers(currentUser()) ? 'TEACHERS' : null;
  else if(!attendanceState.classId || (!isTeachers && !classes.some(c => c.id === attendanceState.classId))) attendanceState.classId = canManageTeachers(currentUser()) ? 'TEACHERS' : (classes[0] ? classes[0].id : null);
  const currentClass = classes.find(c => c.id === attendanceState.classId) || null;
  const isMgr = isManager(currentUser());
  const teacherList = isTeachers && isMgr ? d.users.filter(u => u.role === 'TEACHER' && u.active).sort((a,b)=>a.name.localeCompare(b.name,'ar')) : [];

  const students = !isTeachers && attendanceState.classId
    ? d.students.filter(s => s.active && s.classId === attendanceState.classId).sort((a,b)=>a.fullName.localeCompare(b.fullName,'ar'))
    : [];

  attendanceState.draft = attendanceState.draft || {};
  attendanceState.absenceType = attendanceState.absenceType || {};
  attendanceState.sLateType = attendanceState.sLateType || {};
  attendanceState.sLateMin = attendanceState.sLateMin || {};
  students.forEach(s => {
    if(attendanceState.draft[s.id] == null){
      const rec = d.attendance.find(a => a.studentId === s.id && a.date === attendanceState.date);
      attendanceState.draft[s.id] = rec ? rec.status : 'PRESENT';
      if(rec && rec.absenceType) attendanceState.absenceType[s.id] = rec.absenceType;
    }
    if(attendanceState.sLateType[s.id] == null) attendanceState.sLateType[s.id] = (s.lateType && s.lateType[attendanceState.date]) || 'MORNING';
  });
  attendanceState.tDraft = attendanceState.tDraft || {};
  attendanceState.tLateType = attendanceState.tLateType || {};
  attendanceState.tLateMin = attendanceState.tLateMin || {};
  teacherList.forEach(t => {
    if(attendanceState.tDraft[t.id] == null){
      const isAbsent = (t.absences||[]).includes(attendanceState.date);
      const isLate = (t.markedLate||[]).includes(attendanceState.date);
      attendanceState.tDraft[t.id] = isAbsent ? 'ABSENT' : (isLate ? 'LATE' : 'PRESENT');
    }
    if(attendanceState.tLateType[t.id] == null) attendanceState.tLateType[t.id] = (t.lateType && t.lateType[attendanceState.date]) || 'MORNING';
  });
  /* إذا كان الكشف يحتوي غيابًا سجّله معلم سابق (في حصة سابقة) نعرض رسالة تثبيت نفس الغياب أو إضافة غياب جديد */

/* نافذة نوع الغياب: تظهر بجانب زر «غائب» — مستأذن / هارب من الحصة / غياب عادي (بدون اختيار) */
let __absPopupEl = null, __absPopupSid = null;
function openAbsentPopup(ev, sid){
  ev.preventDefault();
  ev.stopPropagation();
  closeAbsentPopup();
  const rect = ev.currentTarget.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'abs-popup';
  pop.innerHTML = `
    <div class="abs-pop-title">اختر نوع الغياب</div>
    <div class="abs-pop-opt abs-pop-exc" onclick="chooseAbsentType('${sid}','EXCUSED')">🔵 مستأذن</div>
    <div class="abs-pop-opt abs-pop-esc" onclick="chooseAbsentType('${sid}','ESCAPE')">🔴 هارب من الحصة</div>
    <div class="abs-pop-opt abs-pop-nor" onclick="setNormalAbsence('${sid}')">⚪ غياب عادي</div>
    <div class="abs-pop-hint">بدون اختيار = غياب عادي من بداية اليوم</div>`;
  document.body.appendChild(pop);
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = rect.right - pw;
  if(x < 6) x = 6;
  if(x + pw > innerWidth - 6) x = innerWidth - pw - 6;
  let y = rect.bottom + 6;
  if(y + ph > innerHeight - 6) y = rect.top - ph - 6;
  if(y < 6) y = 6;
  pop.style.left = x + 'px';
  pop.style.top = y + 'px';
  __absPopupEl = pop;
  __absPopupSid = sid;
  setTimeout(() => document.addEventListener('mousedown', closeAbsentPopupOutside), 0);
  document.addEventListener('keydown', closeAbsentPopupEsc);
}
function closeAbsentPopupOutside(e){
  const pop = __absPopupEl;
  if(!pop) return;
  if(pop.contains(e.target)) return;
  const sid = __absPopupSid;
  const isRadio = e.target && e.target.tagName === 'INPUT' && e.target.type === 'radio';
  closeAbsentPopup();
  // إذا ضغط على زر/راديو آخر فلن نعيد الرسم هنا (يأخذ الراديو الجديد القرار)، وإلا غياب عادي تلقائي
  if(sid && !isRadio) setNormalAbsence(sid);
}
function closeAbsentPopupEsc(e){
  if(e.key === 'Escape'){
    const sid = __absPopupSid;
    closeAbsentPopup();
    if(sid) setNormalAbsence(sid);
  }
}
function setNormalAbsence(sid){
  closeAbsentPopup();
  if(attendanceState.absenceType) delete attendanceState.absenceType[sid];
  attendanceState.draft[sid] = 'ABSENT';
  rerenderAttendance();
}
function closeAbsentPopup(){
  if(__absPopupEl){
    __absPopupEl.remove();
    __absPopupEl = null;
  }
  __absPopupSid = null;
  document.removeEventListener('mousedown', closeAbsentPopupOutside);
  document.removeEventListener('keydown', closeAbsentPopupEsc);
}
function chooseAbsentType(sid, type){
  closeAbsentPopup();
  attendanceState.absenceType = attendanceState.absenceType || {};
  attendanceState.absenceType[sid] = type;
  attendanceState.draft[sid] = 'ABSENT';
  if(type === 'ESCAPE') notifyAgentEscape(sid);
  rerenderAttendance();
}
function notifyAgentEscape(sid){
  try{
    const d = loadDB();
    const s = studentById(sid);
    if(!s) return;
    const sName = s.fullName || s.name;
    const cls = s.classId ? classById(s.classId) : null;
    const clsLabelTxt = cls ? classLabel(cls) : '';
    const me = currentUser();
    const agents = d.users.filter(u => u.active && u.role === 'AGENT');
    const arr = loadAdminMsgs();
    const text = '🚨 هروب من الحصة: ' + sName + (clsLabelTxt ? ' — ' + clsLabelTxt : '') + (me ? ' (سجّله ' + me.name + ')' : '');
    agents.forEach(a => {
      arr.push({ id: uid(), teacherId: a.id, teacherName: a.name, text, createdAt: new Date().toISOString(), read:false, dismissed:false, revealed:true, views:0, senderRole:'ESCAPE', senderName: me?.name, senderId: me?.id });
    });
    saveAdminMsgs(arr);
    // تنبيه مشترك في قاعدة البيانات (متزامن عبر الخادم) ليصل الوكيل على أي جهاز
    d.escapeAlerts = Array.isArray(d.escapeAlerts) ? d.escapeAlerts : [];
    if(!d.escapeAlerts.some(e => e.date === todayStr() && e.studentId === sid && e.type === 'ESCAPE')){
      d.escapeAlerts.push({ id: uid(), studentId: sid, studentName: sName, className: clsLabelTxt, date: todayStr(), type: 'ESCAPE', teacherId: me?.id, teacherName: me?.name, createdAt: new Date().toISOString(), dismissed:false });
      saveDB(d);
    }
    // إصدار صوت الجرس فورًا مع بقاء تنبيه أحمر نابض للوكيل
    if(agents.length){
      startMsgBeepLoop();
      try { playMsgAlert(); }catch(e){}
      renderApp();
    }
  }catch(e){}
}
function markAllPresent(){

  Object.keys(attendanceState.tDraft||{}).forEach(id => attendanceState.tDraft[id] = 'PRESENT');
  attendanceState.absenceType = {};

function saveAttendance(){
  const d = loadDB();
  if(!isSchoolDay(attendanceState.date)){
    alert('أيام الدراسة من الاثنين إلى الجمعة فقط — لا يمكن تسجيل حضور في العطلة (الأحد/السبت)');
    return;
  }
  let lateCount = 0, latePoints = 0;
  Object.entries(attendanceState.draft).forEach(([studentId, status]) => {
    let rec = d.attendance.find(a => a.studentId === studentId && a.date === attendanceState.date);
    const realClassId = studentById(studentId)?.classId || attendanceState.classId;
    const at = (status === 'ABSENT' && attendanceState.absenceType && attendanceState.absenceType[studentId]) || undefined;
    let lateMins = 0;
    const st = d.students.find(x => x.id === studentId);
    if(st){
      st.lateMinutes = st.lateMinutes || {};
      st.lateType = st.lateType || {};
      const date = attendanceState.date;
      if(status === 'LATE'){
        const minsEl = document.getElementById('stLatMin-' + studentId);
        const mins = parseInt((minsEl && minsEl.value) || '0', 10);
        lateMins = isNaN(mins) || mins < 0 ? 0 : mins;
        st.lateMinutes[date] = lateMins;
        const typeEl = document.getElementById('stLatType-' + studentId);
        const stType = typeEl && typeEl.value ? typeEl.value : (attendanceState.sLateType && attendanceState.sLateType[studentId]);
        st.lateType[date] = (stType === 'MORNING' || stType === 'CLASS' || stType === 'EARLY_LEAVE') ? stType : 'MORNING';
        lateCount++; latePoints += attendancePoints('LATE', lateMins);
      }
      else { delete st.lateMinutes[date]; delete st.lateType[date]; }
    }
    const attObj = { id:uid(), studentId, classId:realClassId, date:attendanceState.date, status, absenceType: at, createdBy: currentUser()?.id, _t: Date.now() };
    if(status === 'LATE' && lateMins > 0) attObj.lateMinutes = lateMins;
    if(rec){ rec.status = status; rec.classId = realClassId; rec.absenceType = at; rec._t = Date.now(); rec.createdBy = currentUser()?.id || rec.createdBy; if(status === 'LATE' && lateMins > 0) rec.lateMinutes = lateMins; else delete rec.lateMinutes; }
    else { d.attendance.push(attObj); }
  });
  Object.entries(attendanceState.tDraft || {}).forEach(([teacherId, status]) => {
    const u = d.users.find(x => x.id === teacherId);
    if(!u) return;
    u.absences = u.absences || [];
    u.markedLate = u.markedLate || [];
    u.lateMinutes = u.lateMinutes || {};
    u.lateType = u.lateType || {};
    const date = attendanceState.date;
    if(status === 'ABSENT'){ if(!u.absences.includes(date)) u.absences.push(date); u.markedLate = u.markedLate.filter(x => x !== date); delete u.lateMinutes[date]; delete u.lateType[date]; }
    else if(status === 'LATE'){
      if(!u.markedLate.includes(date)) u.markedLate.push(date);
      u.absences = u.absences.filter(x => x !== date);
      const minsEl = document.getElementById('latMin-' + teacherId);
      const mins = parseInt((minsEl && minsEl.value) || '0', 10);
      u.lateMinutes[date] = isNaN(mins) || mins < 0 ? 0 : mins;
      const typeEl = document.getElementById('latType-' + teacherId);
      const tType = typeEl && typeEl.value ? typeEl.value : (attendanceState.tLateType && attendanceState.tLateType[teacherId]);
      u.lateType[date] = (tType === 'MORNING' || tType === 'CLASS' || tType === 'EARLY_LEAVE') ? tType : 'MORNING';
    }
    else { u.absences = u.absences.filter(x => x !== date); u.markedLate = u.markedLate.filter(x => x !== date); delete u.lateMinutes[date]; delete u.lateType[date]; }
  });
  saveDB(d);
  attendanceState.draft = {};
  attendanceState.absenceType = {};
  attendanceState.sLateMin = {};
  attendanceState.sLateType = {};
  attendanceState.tDraft = {};
  attendanceState.tLateMin = {};
  attendanceState.tLateType = {};
  const msg = document.getElementById('attSaveMsg');
  if(msg){
    let txt = 'تم حفظ الحضور بنجاح';
    if(lateCount > 0) txt += ' — تأخر ' + lateCount + ' طالب (خصم ' + latePoints + ' نقطة)';
    if(lateCount > 0) msg.style.color = '#dc2626'; else { msg.style.color = '#16a34a'; }
    msg.textContent = txt;
  }
}

let noteType = 'POSITIVE';
let savingNote = false;
function setNoteType(t){
  noteType = t;
  document.getElementById('nTypePos').classList.toggle('active', t==='POSITIVE');
  document.getElementById('nTypeNeg').classList.toggle('active', t==='NEGATIVE');
  const cats = t === 'POSITIVE' ? noteCategoriesPositive : noteCategoriesNegative;
  document.getElementById('nCategory').innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');

function updateNoteCategoryUI(){

  if(other) other.style.display = val==='أخرى' ? '' : 'none';

  if(ptsEl){ ptsEl.textContent = (pts>0?'+':'')+pts; ptsEl.style.color = pts>=0 ? '#16a34a' : '#dc2626'; }
}
function addNote(){
  const ids = getCheckedStudentIds('n');
  let category = document.getElementById('nCategory').value;
  const description = document.getElementById('nDescription').value.trim();
  if(!ids.length){ alert('اختر طالبًا واحدًا على الأقل'); return; }
  if(category === 'أخرى'){
    const otherVal = document.getElementById('nOther').value.trim();
    if(!otherVal){ alert('اكتب المخالفة أو الملاحظة في خانة "أخرى"'); return; }
    category = otherVal;
  }
  if(category === 'تحرير' && !description){ alert('اكتب تعليقك في خانة الوصف'); return; }
  if(savingNote) return;
  savingNote = true;
  try {
    const d = loadDB();
    // اشتقاق نوع الملاحظة من الفئة المختارة تلقائياً حتى لا يحدث خلل بأن تكون
    // ملاحظة سلبية بفئة موجبة (أو العكس) فتُخصم الإيجابية أو تُضاف السلبية.
    let effType = noteType;
    if(category && category !== 'أخرى' && category !== 'تحرير'){
      if(noteCategoriesPositive.includes(category)) effType = 'POSITIVE';
      else if(noteCategoriesNegative.includes(category)) effType = 'NEGATIVE';
    }
    const points = notePoints(effType, category);
    const batchId = uid();
    ids.forEach(sid => {
      d.notes.push({ id:uid(), studentId:sid, type:effType, category, description, points, createdBy: currentUser().id, createdAt: new Date().toISOString(), batchId });
    });
    saveDB(d);
  } finally {
    savingNote = false;
  }
  noteType = 'POSITIVE';
  renderApp();
}

/* ============ التحويلات ============ */
function renderTransfers(){
  const user = currentUser();
  const isAdmin = user?.role === 'ADMIN';
  const isStudent = user?.role === 'STUDENT';
  const active = getActiveSchool();
  const sources = [{ school: active, d: loadDB() }];
  if(isAdmin && active){
    const other = active === 'BOYS' ? 'GIRLS' : 'BOYS';
    sources.push({ school: other, d: loadSchoolDB(other) });
  }
  const canResolve = (t) => t.status === 'PENDING' && (
    (t.target === 'AGENT' && user?.role === 'AGENT') || (t.target === 'COUNSELOR' && user?.role === 'COUNSELOR')
  );
  const priorityColor = { LOW:'#6b7280', MEDIUM:'#1d4ed8', HIGH:'#d97706', URGENT:'#dc2626' };

  const all = [];
  sources.forEach(({ school, d }) => {
    const pts = {};
    pointItems(d).forEach(it => { pts[it.studentId] = (pts[it.studentId]||0) + it.points; });
    d.transfers.slice().reverse().forEach(t => {
      if(isStudent){
        const ids = studentIdsOf(t);
        if(!ids.includes(user.id)) return;
      }
      if(transferForMe(t)) all.push({ t, school, d, pts });
    });
  });
  const schoolBadge = (school) => `<span class="badge ${school === 'BOYS' ? 'badge-boys' : 'badge-girls'}" style="margin-left:6px">${campusLabels[school] || school}</span>`;

  const rows = all.length === 0 ? `<tr><td colspan="7" style="text-align:center;padding:24px;color:#9ca3af">لا توجد تحويلات بعد</td></tr>` :
    all.map(({ t, school, d, pts }) => {
      const ss = studentIdsOf(t).map(id => d.students.find(st => st.id === id)).filter(Boolean);
      const nameCell = ss.length ? ss.map(s => studentNameLink(s, s ? (pts[s.id] || 0) : undefined)).join('<br>') : '<span class="muted">—</span>';
      return `<tr>
        <td style="font-weight:600">${isAdmin ? schoolBadge(school) : ''}${nameCell}</td>
        <td>${targetLabel(t.target)}</td>
        <td style="color:${priorityColor[t.priority]};font-weight:600">${priorityLabels[t.priority]}</td>
        <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(t.reason)}</td>
        <td style="text-align:center">${t.deductedPoints ? `<span style="color:#dc2626;font-weight:700">${t.deductedPoints} نقطة</span>` : '<span class="muted">—</span>'}</td>
        <td>${t.status==='PENDING' ? '<span style="color:#d97706">قيد المتابعة</span>' : '<span style="color:#16a34a">تم الحل</span>'}</td>
        <td>${t.status==='PENDING' ? (canResolve(t) ? `<button class="del-btn" style="color:#1d7fd6" onclick="openTransferSolve('${t.id}')">حل المشكلة</button>` : '<span class="muted" style="font-size:12px">بانتظار الجهة المعنية</span>') : (t.solution ? `<div style="max-width:280px;white-space:pre-wrap"><span style="font-weight:700;color:#16a34a">الحل:</span> ${escapeHtml(t.solution)}</div><div class="muted small">بواسطة ${escapeHtml(t.resolvedByName || '—')}</div>` : '<span style="color:#16a34a">تم الحل</span>')}</td>
      </tr>`;
    }).join('');

  return `
  <div class="header-row"><h1 class="page-title">${isStudent ? 'تحويلاتي' : 'التحويلات'}</h1>${isStudent ? '' : '<button class="btn-primary" onclick="toggleEl(\'transferForm\')">+ تحويل طالب</button>'}</div>
  ${isStudent ? '' : `<div id="transferForm" class="card mb" style="display:none">
    <div class="form-grid-3">
      <select id="tClassId" class="input" onchange="fillStudentMulti('tClassId','tStudentList','t')" data-tip="اختر الفصل الذي يدرس فيه الطلاب المطلوب تحويلهم"><option value="">اختر الفصل</option>${getClassesSorted().map(c=>`<option value="${c.id}">${escapeHtml(classLabel(c))}</option>`).join('')}</select>
      <div id="tStudentList" class="student-multi-box" data-tip="اختر طالبًا أو أكثر للتحويل دفعة واحدة — يُنشأ طلب واحد للجميع"><div class="muted small" style="padding:4px 0">اختر الفصل أولًا</div></div>
      <select id="tTarget" class="input" data-tip="إلى من يُرسَل طلب التحويل للمراجعة والاعتماد (الوكيل، الموجه الطلابي، أو المدير)">${Object.entries(targetLabels).map(([v,l])=>`<option value="${v}">إلى: ${targetLabel(v)}</option>`).join('')}</select>
    </div>
    <select id="tPriority" class="input" style="margin:12px 0" data-tip="أولوية الطلب من حيث السرعة: منخفضة، متوسطة، مرتفعة، أو عاجلة">${Object.entries(priorityLabels).map(([v,l])=>`<option value="${v}" ${v==='MEDIUM'?'selected':''}>الأولوية: ${l}</option>`).join('')}</select>
    <select id="tReason" class="input" style="margin-bottom:12px" onchange="updateReasonUI()" data-tip="اختر سبب التحويل المناسب من القائمة الجاهزة">${transferReasons.map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
    <input id="tOther" class="input" style="display:none;margin-bottom:12px" placeholder="✍ اكتب سبب التحويل..." data-tip="اكتب سبب التحويل إذا اخترت (أخرى) من قائمة الأسباب" />
    <div id="tFreeHint" class="card mb" style="display:none;background:#fffbeb;border:1px solid #fde68a;padding:10px;font-size:13px">✍️ اكتب سبب التحويل حرًا في الخانة أدناه</div>
    <textarea id="tReasonComment" class="input" rows="3" style="display:none;margin-bottom:12px" placeholder="اكتب سبب التحويل هنا..." data-tip="اشرح سبب التحويل بتفصيل أكبر — يظهر لجهة المراجعة عند معالجة الطلب"></textarea>
    <button class="btn-primary" onclick="addTransfer()">إرسال</button>
  </div>`}
  <div class="card table-card">
    <table class="data-table"><thead><tr><th>الطالب</th><th>إلى</th><th>الأولوية</th><th>السبب</th><th>خصم النقاط</th><th>الحالة</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}
function updateReasonUI(){
  const val = document.getElementById('tReason').value;
  const other = document.getElementById('tOther');
  const hint = document.getElementById('tFreeHint');
  const comment = document.getElementById('tReasonComment');
  if(other) other.style.display = val==='أخرى' ? '' : 'none';
  if(hint) hint.style.display = val==='تحرير' ? '' : 'none';
  if(comment) comment.style.display = val==='تحرير' ? '' : 'none';
}
function addTransfer(){
  const ids = getCheckedStudentIds('t');
  const target = document.getElementById('tTarget').value;
  const priority = document.getElementById('tPriority').value;
  let reason = document.getElementById('tReason').value;
  if(!ids.length){ alert('اختر طالبًا واحدًا على الأقل'); return; }
  if(reason === 'أخرى'){
    const otherVal = document.getElementById('tOther').value.trim();
    if(!otherVal){ alert('اكتب سبب التحويل في خانة "أخرى"'); return; }
    reason = otherVal;
  }
  if(reason === 'تحرير'){
    const freeVal = document.getElementById('tReasonComment').value.trim();
    if(!freeVal){ alert('اكتب سبب التحويل في خانة التحرير'); return; }
    reason = freeVal;
  }
  const d = loadDB();
  const tr = { id:uid(), studentIds:ids, studentId:ids[0], target, priority, reason, status:'PENDING', createdBy: currentUser().id, createdAt: new Date().toISOString() };
  d.transfers.push(tr);
  // خصم نقاط تلقائي حسب سبب التحويل (عند التحويل للوكيل أو المدير أو الموجه الطلابي) — لكل طالب مخصومة
  const ded = transferDeductionMap[reason] != null ? transferDeductionMap[reason] : -3;
  if(ded !== 0){
    tr.deductedPoints = ded;
    ids.forEach(sid => {
      d.notes.push({ id:uid(), studentId:sid, type:'NEGATIVE', category: reason, description: 'تحويل إلى ' + targetLabel(target) + ' (خصم تلقائي)', points: ded, createdBy: currentUser().id, createdAt: new Date().toISOString(), transferId: tr.id, batchId: tr.id });
    });
  }
  saveDB(d);
  notifyTransferReceivers(d, tr);
  renderApp();
}
function notifyTransferReceivers(d, tr){
  const me = currentUser();
  const arr = loadAdminMsgs();
  const ids = studentIdsOf(tr);
  const sNames = ids.map(id => { const s = studentById(id); return s ? s.fullName : 'طالب/طالبة'; });
  const sName = sNames.join('، ');
  const isGirls = getActiveSchool() === 'GIRLS';
  const studentLabel = isGirls ? 'الطالبات' : 'الطلاب';
  const text = `📨 تحويل ${studentLabel}: ${sName} — إلى: ${targetLabel(tr.target)} — السبب: ${tr.reason}`;
  d.users.filter(u => u.active && u.role === tr.target).forEach(r => {
    arr.push({
      id: uid(), teacherId: r.id, teacherName: r.name,
      text, createdAt: new Date().toISOString(), read:false, dismissed:false, views:0,
      senderRole: 'TRANSFER', senderName: me?.name, senderId: me?.id, transferId: tr.id, studentName: sName
    });
  });
  saveAdminMsgs(arr);
}
/* من يرى التحويل؟ — كل شخص يرى تحويله فقط، والمدير يشاهد الجميع (قراءة فقط) */
/* هل يرى المدير إشعار التحويل؟ — يرى فقط ما وُجّه إليه فعليًا (إلى: المدير) أو تحويلًا أنشأه بنفسه */
function adminSeesTransferMsg(m){
  const me = currentUser();
  if(m.senderRole !== 'TRANSFER') return true;
  const school = m._school || getActiveSchool();
  try {
    const d = loadSchoolDB(school);
    const t = d.transfers.find(x => x.id === m.transferId);
    if(!t) return false;
    return t.target === 'ADMIN' || t.createdBy === me?.id;
  } catch(e){ return false; }
}
function transferForMe(t){
  const u = currentUser();
  if(!u) return false;
  if(u.role === 'ADMIN') return t.target === 'ADMIN' || t.createdBy === u.id;
  if(u.role === 'AGENT' || u.role === 'COUNSELOR') return t.target === u.role || t.createdBy === u.id;
  const visible = new Set(getVisibleStudents().map(s => s.id));
  return t.createdBy === u.id || studentIdsOf(t).some(id => visible.has(id));
}
function openTransferSolve(id){
  const d = loadDB();
  const t = d.transfers.find(x => x.id === id);
  if(!t) return;
  const sNames = studentIdsOf(t).map(id => { const s = studentById(id); return s ? s.fullName : '—'; }).join('، ');
  const isGirls = getActiveSchool() === 'GIRLS';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head"><h3>حل المشكلة</h3><button class="modal-close" onclick="closeDetails()">✕</button></div>
      <div style="padding:4px 2px 12px">
        <p style="font-weight:700">${escapeHtml(sNames)}</p>
        <p class="muted small" style="margin-top:4px">إلى: ${targetLabel(t.target)} — السبب: ${escapeHtml(t.reason)}</p>
        <label style="display:block;font-weight:600;margin:12px 0 6px">✍️ ${isGirls ? 'كيف كان الحل؟' : 'كيف كان الحل؟'}</label>
        <textarea id="trSolveText" class="input" style="width:100%;min-height:90px;resize:vertical;padding:12px;font-size:14px" maxlength="500" placeholder="اكتب وصف الحل الذي تم — يطّلع عليه ${isGirls ? 'المعلمة' : 'المعلم'} فورًا..." data-tip="اكتب تفاصيل الحل الذي اتخذته لمعالجة حالة التحويل"></textarea>
        <button class="btn-primary" style="width:100%;margin-top:12px" onclick="saveTransferSolution('${t.id}')">✔ حفظ الحل</button>
      </div>
    </div>`;
  overlay.onclick = e => { if(e.target === overlay) closeDetails(); };
  document.body.appendChild(overlay);
  const ta = document.getElementById('trSolveText');
  if(ta) ta.focus();
}
function saveTransferSolution(id){
  const text = (document.getElementById('trSolveText')?.value || '').trim();
  if(!text){ alert('اكتب كيف كان الحل أولاً'); return; }
  const d = loadDB();
  const t = d.transfers.find(x => x.id === id);
  if(!t) return;
  const me = currentUser();
  t.status = 'RESOLVED';
  t.solution = text;
  t.resolvedBy = me?.id;
  t.resolvedByName = me?.name;
  t.resolvedAt = new Date().toISOString();
  saveDB(d);
  closeDetails();
  renderApp();
  alert('تم حفظ الحل ✅ سيظهر للمعلم فورًا');
}

/* ============ الفصول ============ */
const stages = [
  { name:'الأول الابتدائي', order:0 }, { name:'الثاني الابتدائي', order:1 }, { name:'الثالث الابتدائي', order:2 },
  { name:'الرابع الابتدائي', order:3 }, { name:'الخامس الابتدائي', order:4 }, { name:'السادس الابتدائي', order:5 },
  { name:'الأول المتوسط', order:6 }, { name:'الثاني المتوسط', order:7 }, { name:'الثالث المتوسط', order:8 },
  { name:'الأول الثانوي', order:9 }, { name:'الثاني الثانوي', order:10 }, { name:'الثالث الثانوي', order:11 },
];
function renderClasses(){
  const d = loadDB();
  const user = currentUser();
  const isAdmin = user?.role === 'ADMIN';
  const canManage = isManager(user);
  const canAssign = canManageTeachers(user);
  // إصلاح تلقائي: إكمال الصفوف الناقصة (المتوسط والثانوي) عند الحاجة
  let addedMsg = '';
  if(canManage){
    const campus = getActiveSchool();
    let added = 0;
    stages.forEach(stage => {
      let grade = d.grades.find(g => g.name === stage.name);
      if(!grade){ grade = { id:uid(), name:stage.name, order:stage.order }; d.grades.push(grade); }
      if(!d.classes.some(c => c.gradeId===grade.id && c.name==='أ')){
        d.classes.push({ id:uid(), gradeId:grade.id, name:'أ', campus, capacity:null, teacherIds:[] });
        added++;
      }
    });
    if(added > 0){ saveDB(d); addedMsg = `<div class="card mb" style="color:#16a34a;font-weight:600">تمت إضافة ${added} صف ناقص (3 متوسط + 3 ثانوي) بنجاح</div>`; }
  }
  const classes = getClassesSorted();
  const grades = d.grades.slice().sort((a,b)=>a.order-b.order);

  const teacherOpts = d.users.filter(u => u.active && u.role === 'TEACHER').sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const teacherAssign = (classId, currentIds) => `
    <div style="display:flex;flex-direction:column;gap:4px;max-width:280px">
      <div style="display:flex;gap:4px">
        <select id="tSel-${classId}" class="input" style="padding:4px 8px;font-size:12px;min-width:150px" data-tip="اختر معلمًا لإسناده لهذا الفصل — يظهر المعلم بعدها في شارات الفصل ويظهر الفصل في صفحة متابعة المعلم ضمن (الفصول المسندة)">
          <option value="">اختر معلمًا...</option>
          ${teacherOpts.filter(t => !currentIds.includes(t.id)).map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
        </select>
        <button class="btn-secondary" style="padding:4px 10px;font-size:13px;flex-shrink:0" onclick="addTeacherToClass('${classId}')" title="إضافة">+</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${currentIds.map(id => {
          const t = userById(id);
          return t ? `<span style="display:inline-flex;align-items:center;gap:4px;background:#dbeafe;border:1px solid #93c5fd;padding:2px 8px;border-radius:999px;font-size:12px">${escapeHtml(t.name)}<a href="javascript:void(0)" onclick="removeTeacherFromClass('${classId}','${id}')" style="color:#b91c1c;font-weight:700;text-decoration:none" title="إزالة">✕</a></span>` : '';
        }).join('')}
      </div>
    </div>`;

  const ptsMapClass = studentPointsMap();

    classes.map(c => {
      const g = gradeById(c.gradeId);
      const students = d.students.filter(s => s.active && s.classId === c.id).sort((a,b)=>a.fullName.localeCompare(b.fullName,'ar'));
      const count = students.length;
      const teachersOf = (c.teacherIds||[]).map(id => userById(id)?.name).filter(Boolean);
      const studentsHtml = students.length === 0 ? '<span class="muted">لا يوجد طلاب</span>' :
        `<div style="display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow-y:auto">${students.map(s => `<span style="background:#f3f4f6;padding:2px 8px;border-radius:4px;font-size:12px;white-space:nowrap">${studentNameLink(s, ptsMapClass[s.id] || 0)}</span>`).join('')}</div>`;
      return `<tr>
        <td style="font-weight:600">${g?escapeHtml(g.name):'—'}</td>
        <td>${escapeHtml(c.name)}${c.capacity?`<span class="muted small"> (سعة ${c.capacity})</span>`:''}</td>
        <td>${canAssign ? teacherAssign(c.id, c.teacherIds||[]) : `<span style="font-size:12px">${teachersOf.length ? teachersOf.map(n=>escapeHtml(n)).join('، ') : '—'}</span>`}</td>
        <td><a href="javascript:void(0)" onclick="toggleEl('classStudents-${c.id}')" style="font-weight:600;color:#2563eb">${count}</a></td>
        <td>${isAdmin ? `<button class="del-btn" onclick="deleteClass('${c.id}')">🗑 حذف</button>` : ''}</td>

      <tr id="classStudents-${c.id}" style="display:none"><td colspan="5" style="padding:8px 16px;background:#f9fafb">${studentsHtml}</td></tr>`;

    </div>

  <div id="genMsg">${addedMsg}</div>
  <div id="classForm" class="card mb form-grid-3" style="display:none">

    <input id="cName" class="input" placeholder="اسم الفصل (مثال: أ)" value="أ" data-tip="اسم الفصل داخل المرحلة — مثال: أ، ب، ج" />
    <input id="cCapacity" type="number" class="input" placeholder="السعة (اختياري)" data-tip="الحد الأقصى لعدد الطلاب في الفصل (اختياري — يُترك فارغًا إذا لم تكن هناك سعة محددة)" />
    <button class="btn-primary" onclick="addClass()">حفظ</button>
  </div>
  <div class="card table-card">
    <table class="data-table"><thead><tr><th>الصف</th><th>الفصل</th><th>${tl('معلمو الفصل')}</th><th>${tl('عدد الطلاب')}</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}
function addClass(){
  const gradeId = document.getElementById('cGradeId').value;
  const name = document.getElementById('cName').value.trim();
  const capacity = document.getElementById('cCapacity').value ? Number(document.getElementById('cCapacity').value) : null;
  if(!gradeId || !name){ alert('اختر الصف واكتب اسم الفصل'); return; }
  const d = loadDB();
  const campus = getActiveSchool();
  if(d.classes.some(c => c.gradeId===gradeId && c.name===name)){ alert('هذا الفصل موجود مسبقًا لنفس الصف'); return; }
  d.classes.push({ id:uid(), gradeId, name, campus, capacity, teacherIds:[] });
  saveDB(d);
  renderApp();
}
function deleteClass(id){
  const d = loadDB();
  const count = d.students.filter(s => s.active && s.classId === id).length;
  if(count > 0){ alert('لا يمكن حذف فصل يحتوي على طلاب — انقل الطلاب أولًا'); return; }
  if(!confirm('هل تريد حذف هذا الفصل؟')) return;
  d.classes = d.classes.filter(c => c.id !== id);
  saveDB(d);
  renderApp();
}
function addTeacherToClass(classId){
  if(!canManageTeachers(currentUser())) return;
  const sel = document.getElementById('tSel-'+classId);
  const teacherId = sel ? sel.value : '';
  if(!teacherId) return;
  const d = loadDB();
  const cls = d.classes.find(c => c.id === classId);
  if(!cls) return;
  if(!Array.isArray(cls.teacherIds)) cls.teacherIds = [];
  if(!cls.teacherIds.includes(teacherId)) cls.teacherIds.push(teacherId);
  saveDB(d);
  renderApp();
}
function removeTeacherFromClass(classId, teacherId){
  if(!canManageTeachers(currentUser())) return;
  const d = loadDB();
  const cls = d.classes.find(c => c.id === classId);
  if(!cls) return;
  if(Array.isArray(cls.teacherIds)) cls.teacherIds = cls.teacherIds.filter(t => t !== teacherId);
  saveDB(d);
  renderApp();
}
function generateDefaultStructure(){
  if(!confirm('سيتم إنشاء الهيكل الافتراضي: 12 فصل (6 ابتدائي + 3 متوسط + 3 ثانوي). المتابعة؟')) return;
  const d = loadDB();
  const campus = getActiveSchool();
  let createdCount = 0;
  stages.forEach(stage => {
    let grade = d.grades.find(g => g.name === stage.name);
    if(!grade){ grade = { id:uid(), name:stage.name, order:stage.order }; d.grades.push(grade); }

function makeLocalUsername(base){  let candidate = String(base||'').toLowerCase().replace(/[^a-z0-9._-]/g,'').replace(/^[._-]+|[._-]+$/g,'') || 'user';
  let i = 1;
  const used = new Set();
  ['BOYS','GIRLS'].forEach(s => { try{ (loadDBFor(s).users||[]).forEach(u => { if(u.username) used.add(String(u.username).toLowerCase()); }); }catch(e){} });
  while(used.has(candidate)){ i++; candidate = String(base||'').toLowerCase().replace(/[^a-z0-9._-]/g,'').replace(/^[._-]+|[._-]+$/g,'') + i; }
  return candidate;
}

function thisMonday(now){
  const m = new Date(now);
  m.setDate(m.getDate() - ((now.getDay()+6)%7)); // 0 = الاثنين
  return m;
}
function schoolWeekInfo(){

  let start = getAcademicStart();
  if(!start){
    start = thisMonday(now);
    setAcademicStart(localDateKey(start));
  }
  const mon = thisMonday(now);
  const diff = Math.floor((mon.getTime() - start.getTime()) / (7*24*3600*1000));
  const weeks = diff + 1;
  if(weeks < 1) return { label:'الأسبوع التمهيدي', kind:'break' };
  return { label:'الأسبوع ' + weeks, kind:'week' };
}

}

function schoolDaysInRange(from, to){
  if(!from || !to) return 0;
  let count = 0;
  const d = new Date(from + 'T00:00:00');
  const end = new Date(to + 'T00:00:00');
  if(isNaN(d) || isNaN(end) || d > end) return 0;
  while(d <= end){ if(isSchoolDay(localDateKey(d))) count++; d.setDate(d.getDate()+1); }
  return count;
}
function teacherStats(u){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  // السنة الدراسية: سبتمبر → يونيو
  const yearStart = month >= 8 ? new Date(year, 8, 1) : new Date(year-1, 8, 1);
  const yearEnd = month >= 8 ? new Date(year+1, 5, 30) : new Date(year, 5, 30);
  const startKey = localDateKey(yearStart);
  const todayKey = localDateKey(now);
  const absDates = (u.absences || []).filter(x => x >= startKey && x <= todayKey);
  const absent = absDates.length;
  const lateDaysSet = new Set(); let lateMin = 0, firstLoginToday = null;
  // أيام التأخر المسجلة يدويًا من المدير/الوكيل
  (u.markedLate || []).forEach(x => {
    if(x >= startKey && x <= todayKey) lateDaysSet.add(x);
  });
  // دقائق التأخر المدخلة يدويًا من شاشة الحضور
  Object.entries(u.lateMinutes || {}).forEach(([date, mins]) => {
    if(date >= startKey && date <= todayKey){ lateDaysSet.add(date); if(mins) lateMin += Number(mins); }
  });
  // أول دخول اليوم
  const logins = (u.loginHistory || []).map(iso => new Date(iso));
  logins.forEach(d => {
    if(localDateKey(d) === localDateKey(now) && !firstLoginToday) firstLoginToday = d;
  });
  return {
    loginCount: u.loginCount||0,
    lastLogin: u.lastLogin,
    firstLoginToday,
    absent, lateDays: lateDaysSet.size, lateMin,
    absDates,
  };
}

  } else if(type === 'ACTIVITIES'){

function toggleTeacherAbsToday(teacherId, checked){

/* يحسم إن كان معلم معين مُشرِفًا اليوم، ويعيد بقية زملاء نوبته */
function supervisionForUser(user){
  if(!user || user.role !== 'TEACHER') return null;
  const day = TIMETABLE_DAYS.find(x => x.dow === new Date().getDay());
  if(!day) return null;
  const slot = SUPERVISION_DAYS.find(s => s.key === day.key);
  if(!slot) return null;
  const d = typeof loadDB === 'function' ? loadDB() : null;
  const users = (d && d.users) ? d.users : [];
  const resolve = ref => {
    if(ref === (user.id || '')) return user;                       // الهوية نفسها
    const byId = users.find(u => u.id === ref);
    if(byId) return byId;
    const byName = users.find(u => (u.name||'').includes(String(ref)));
    return byName || null;
  };
  const roster = slot.refs.map(resolve).filter(Boolean);
  const me = roster.find(u => u.id === user.id);
  if(!me) return null;
  return { dayKey:day.key, label:slot.label, roster };
}

        <button class="btn-secondary" onclick="closeTtForm()">إلغاء</button>
      </div>
    </div>
  </div>`;
  overlay.onclick = e => { if(e.target === overlay) closeTtForm(); };

}
function closeTtForm(){
  const ov = document.querySelector('.modal-overlay');
  if(ov) ov.remove();
  ttEdit = null;
}
function saveTtCell(){
  const subject = document.getElementById('ttSubject').value.trim();
  const classId = document.getElementById('ttClass').value;
  if(!subject){ alert('اختر المادة من القائمة'); return; }
  if(!classId){ alert('اختر الفصل'); return; }
  const user = currentUser();
  const d = loadDB();
  d.timetable = d.timetable || {};
  d.timetable[user.id] = d.timetable[user.id] || {};
  d.timetable[user.id][ttEdit.day] = d.timetable[user.id][ttEdit.day] || {};
  const prevCell = (d.timetable[user.id][ttEdit.day][ttEdit.period]) || {};
  d.timetable[user.id][ttEdit.day][ttEdit.period] = { subject, classId, _v: (((prevCell && typeof prevCell._v === 'number') ? prevCell._v : 0) + 1) };
  saveDB(d);
  mirrorTtToOther(user.email, ttEdit.day, ttEdit.period, { subject, classId });
  closeTtForm();
  renderApp();
}
function deleteTtCell(period){
  const user = currentUser();
  if(!confirm('حذف هذه الحصة؟')) return;
  const d = loadDB();
  const cell = (d.timetable[user.id][timetableDay] && d.timetable[user.id][timetableDay][period]) || {};
  if(d.timetable && d.timetable[user.id] && d.timetable[user.id][timetableDay]) d.timetable[user.id][timetableDay][period] = { _del: true, _v: (((cell && typeof cell._v === 'number') ? cell._v : 0) + 1) };
  saveDB(d);
  mirrorTtDelete(user.email, timetableDay, period);
  renderApp();
}
// انعكاس الجدول للمدرسة الأخرى لنفس المعلم (نفس البريد) مع الخصوصية لكل قسم
function mirrorTtToOther(teacherEmail, day, period, cell){
  const other = getActiveSchool() === 'BOYS' ? 'GIRLS' : 'BOYS';
  const od = loadDBFor(other);
  const u = (od.users || []).find(x => x.email === teacherEmail);
  if(!u) return;
  let classId = cell.classId;
  const src = loadDB().classes.find(c => c.id === cell.classId);
  if(src && src.name){
    const oc = (od.classes || []).find(c => c.name === src.name);
    if(oc) classId = oc.id;
  }
  od.timetable = od.timetable || {};
  od.timetable[u.id] = od.timetable[u.id] || {};
  od.timetable[u.id][day] = od.timetable[u.id][day] || {};
  od.timetable[u.id][day][period] = { subject: cell.subject, classId };
  localStorage.setItem(dbKeyFor(other), JSON.stringify(od));
}
function mirrorTtDelete(teacherEmail, day, period){
  const other = getActiveSchool() === 'BOYS' ? 'GIRLS' : 'BOYS';
  const od = loadDBFor(other);
  const u = (od.users || []).find(x => x.email === teacherEmail);
  if(!u || !od.timetable || !od.timetable[u.id] || !od.timetable[u.id][day]) return;
  const cell = od.timetable[u.id][day][period] || {};
  od.timetable[u.id][day][period] = { _del: true, _v: (((cell && typeof cell._v === 'number') ? cell._v : 0) + 1) };
  localStorage.setItem(dbKeyFor(other), JSON.stringify(od));
}

/* ============ التكليفات ============ */
function getTeacherSubjects(user, d){
  const tt = (d.timetable || {})[user.id] || {};
  const map = {};
  Object.values(tt).forEach(day => {
    Object.values(day).forEach(cell => {
      if(cell && cell.subject && cell.classId){
        const cls = d.classes.find(c => c.id === cell.classId);
        if(cls){
          const key = cell.classId + '|' + cell.subject;
          if(!map[key]) map[key] = { classId: cell.classId, subject: cell.subject, className: cls.name, gradeId: cls.gradeId };
        }
      }
    });
  });
  return Object.values(map);
}

function toggleStudentDone(aid, sid, isDone){
  const d = loadDB();
  const a = (d.assignments||[]).find(x => x.id === aid);
  if(!a) return;
  if(!a.completedBy) a.completedBy = [];
  const idx = a.completedBy.indexOf(sid);
  if(isDone && idx < 0) a.completedBy.push(sid);
  if(!isDone && idx >= 0) a.completedBy.splice(idx, 1);
  saveDB(d);
  renderApp();
}
function deleteAssignment(aid){
  const user = currentUser();
  if(!user) return;
  const d = loadDB();
  const a = (d.assignments||[]).find(x => x.id === aid);
  if(!a) return;
  // صلاحية: المعلم هو من أنشأ التكليف (أو مدير/وكيل)
  if(user.role !== 'ADMIN' && user.role !== 'AGENT' && a.teacherId !== user.id){
    alert('لا يمكنك حذف هذا التكليف — أنشأه معلم آخر');
    return;
  }
  if(!confirm('هل تريد حذف التكليف «' + (a.title||'') + '» نهائياً؟')){
    return;
  }
  // أسفين حذف (deleted) بدل الحذف الفعلي: يتنشر عبر دمج الخادم دون أن يُعاد إحياؤه
  a.deleted = true;
  a.deletedAt = Date.now();
  saveDB(d);
  const params = new URLSearchParams((location.hash.split('?')[1]||''));
  const step = params.get('step') || 'list';
  const classId = params.get('cid') || '';
  if(step === 'detail') location.hash = '#/assignments?step=list&cid=' + classId;
  renderApp();
  alert('🗑 تم حذف التكليف');
}

function saveAssignment(){
  const user = currentUser();
  if(!user) return;
  const d = loadDB();
  const params = new URLSearchParams((location.hash.split('?')[1]||''));
  const title = (document.getElementById('assTitle')||{}).value||'';
  const desc = (document.getElementById('assDesc')||{}).value||'';
  const date = (document.getElementById('assDate')||{}).value||'';
  const subject = decodeURIComponent(params.get('sub')||'');
  const classId = params.get('cid')||'';
  const type = decodeURIComponent(params.get('type')||'واجب');
  if(!title){ alert('اكتب عنوان التكليف'); return; }
  d.assignments = d.assignments || [];
  const clsStudents = (d.students||[]).filter(s => s.active && s.classId === classId).map(s => s.id);
  d.assignments.push({ id: uid(), teacherId: user.id, classId, subject, type, title, desc, date, created: Date.now(), completedBy: clsStudents.slice() });
  saveDB(d);
  alert('✅ تم حفظ التكليف');
  location.hash = '#/assignments?step=type&cid=' + classId + '&sub=' + encodeURIComponent(subject);
}

function actTypeChanged(){
  const sel = document.getElementById('actType');
  const val = sel.value;
  const nameInput = document.getElementById('actName');
  const hint = document.getElementById('actOtherHint');
  if(hint) hint.style.display = (val === 'OTHER' || val.startsWith('OTHER::')) ? '' : 'none';
  if(val.startsWith('OTHER::')){
    const n = val.slice('OTHER::'.length);
    sel.value = 'OTHER';
    if(nameInput){ nameInput.value = n; }
    const dt = document.getElementById('actDate');
    if(dt) dt.focus();
    return;
  }
  if(val === 'OTHER'){
    if(nameInput) nameInput.focus();
    return;
  }
  const t = activityTypes.find(x => x.value === val);
  if(t && nameInput) nameInput.value = t.label;
}
function openActivityForm(){
  activityEditId = null;

  if(f){ f.style.display=''; f.scrollIntoView({behavior:'smooth'}); }
}
function closeActivityForm(){
  activityEditId = null;
  document.getElementById('activityForm').style.display = 'none';
  document.getElementById('actType').value = '';
  document.getElementById('actName').value = '';
  document.getElementById('actDate').value = '';
  document.getElementById('actDesc').value = '';

}
function saveActivity(){
  const type = document.getElementById('actType').value;
  const name = document.getElementById('actName').value.trim();
  const date = document.getElementById('actDate').value;
  const description = document.getElementById('actDesc').value.trim();
  if(!type){ alert('اختر المناسبة'); return; }
  if(!name){ alert('اكتب اسم النشاط'); return; }
  if(!date){ alert('اختر التاريخ'); return; }
  const d = loadDB();
  d.activities = d.activities || [];
  const otherSchool = getActiveSchool() === 'BOYS' ? 'GIRLS' : 'BOYS';
  if(activityEditId){
    const a = d.activities.find(x => x.id === activityEditId);
    if(a){ a.type = type; a.name = name; a.date = date; a.description = description; }
    const od = loadDBFor(otherSchool);
    const oa = (od.activities || []).find(x => x.id === activityEditId);
    if(oa){ oa.type = type; oa.name = name; oa.date = date; oa.description = description; localStorage.setItem(dbKeyFor(otherSchool), JSON.stringify(od)); }
  } else {
    const id = uid();
    d.activities.push({ id, type, name, date, description, createdBy: currentUser()?.id, createdAt: new Date().toISOString() });
    const od = loadDBFor(otherSchool);
    od.activities = od.activities || [];
    if(!(od.activities || []).some(x => x.id === id)) od.activities.push({ id, type, name, date, description, createdBy: currentUser()?.id, createdAt: new Date().toISOString() });
    localStorage.setItem(dbKeyFor(otherSchool), JSON.stringify(od));
  }
  saveDB(d);
  if(type === 'OTHER') saveCustomActName(name);
  activityEditId = null;
  renderApp();
}
function editActivity(id){
  const d = loadDB();
  const a = (d.activities||[]).find(x => x.id === id);
  if(!a) return;
  activityEditId = id;
  const f = document.getElementById('activityForm');
  if(f) f.style.display = '';
  document.getElementById('actType').value = a.type;
  document.getElementById('actName').value = a.name;
  document.getElementById('actDate').value = a.date;
  document.getElementById('actDesc').value = a.description || '';
  if(f) f.scrollIntoView({behavior:'smooth'});
}
function deleteActivity(id){
  const d = loadDB();
  if(!(d.activities||[]).some(x => x.id === id)) return;
  if(!confirm('حذف هذا النشاط؟')) return;
  d.activities = (d.activities||[]).filter(x => x.id !== id);
  saveDB(d);
  const otherSchool = getActiveSchool() === 'BOYS' ? 'GIRLS' : 'BOYS';
  const od = loadDBFor(otherSchool);
  if((od.activities||[]).some(x => x.id === id)){ od.activities = (od.activities||[]).filter(x => x.id !== id); localStorage.setItem(dbKeyFor(otherSchool), JSON.stringify(od)); }

}

function previewSaPartFile(input){

  reader.onload = e => {
    saBase64 = e.target.result;

    if(preview){ preview.src = saBase64; preview.style.display = ''; }

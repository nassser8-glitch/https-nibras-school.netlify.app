function __attWinner(a, b){
  if(!a) return b;
  if(!b) return a;
  if(!!a.deleted !== !!b.deleted) return a.deleted ? a : b;
  const infA = (a.status === 'ABSENT' || a.status === 'LATE') ? 1 : 0;

const DEMO_MODE = false; // true = ‰”Œ… «·⁄—÷ «· Ã—Ì»Ì

const PERSIST_FIRST_SEED = true; // √Ê·  ‘€Ì· ›ﬁÿ: “—⁄ «·»Ì«‰«  «·„ Ê›—… (DEMO_SEED ≈‰ ÊıÃœ) ›Ì «· Œ“Ì‰ «·ÕﬁÌﬁÌ
function __demoYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function __demoIsSchool(d){ const w = d.getDay(); return w>=1 && w<=5; }
function __demoShiftDate(ymd, delta){
  const d = new Date(ymd+'T12:00:00');
  d.setDate(d.getDate()+delta);
  while(!__demoIsSchool(d)) d.setDate(d.getDate()+1);
  return __demoYmd(d);
}
function __demoShiftIso(isoStr, delta){
  const d = new Date(isoStr);
  if(isNaN(d.getTime())) return isoStr;
  d.setDate(d.getDate()+delta);
  return d.toISOString();
}
function __demoResolve(obj, delta){
  if(Array.isArray(obj)){ obj.forEach(x => __demoResolve(x, delta)); return; }
  if(obj && typeof obj === 'object'){
    Object.keys(obj).forEach(k => {
      const v = obj[k];
      if(typeof v === 'string'){
        if(/^\d{4}-\d{2}-\d{2}$/.test(v)) obj[k] = __demoShiftDate(v, delta);
        else if(/^\d{4}-\d{2}-\d{2}T/.test(v)) obj[k] = __demoShiftIso(v, delta);
      } else if(v && typeof v === 'object'){ __demoResolve(v, delta); }
    });
  }
}
function seedPersistentData(){
  // “—⁄ «·»Ì«‰«  «·„ Ê›—… ›Ì «· Œ“Ì‰ «·ÕﬁÌﬁÌ ··ﬁ”„Ì‰ („—… Ê«Õœ… ⁄‰œ √Ê·  ‘€Ì· √Ê »⁄œ „”Õ «·»Ì«‰« )
  let __delta = 0;
  if(DEMO_ANCHOR){
    const __ref = new Date(DEMO_ANCHOR+'T12:00:00');
    if(!isNaN(__ref.getTime())){
      let __now = new Date();
      while(!__demoIsSchool(__now)) __now.setDate(__now.getDate()-1);
      __delta = Math.round((__now - __ref)/86400000);
    }
  }
  Object.keys(DEMO_SEED || {}).forEach(school => {
    const key = 'nibras_'+school+'_db_v1';
    if(!localStorage.getItem(key)){
      const d = JSON.parse(JSON.stringify(DEMO_SEED[school]));
      if(__delta !== 0) __demoResolve(d, __delta);
      localStorage.setItem(key, JSON.stringify(d));
    }
  });
}

function __normName(s){ return String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[√≈¬]/g,'«').replace(/…/g,'Â').replace(/Ï/g,'Ì').replace(/\s+/g,' ').trim(); }
function dedupeTeacherAccounts(){
  if(__serverEnabled()) return;
  let changedAny = false;
  ['BOYS','GIRLS'].forEach(school => {
    const key = 'nibras_'+school+'_db_v1';
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){}
    if(!d || !Array.isArray(d.users)) return;
    const groups = {};
    (d.users||[]).forEach(u => { if(u && u.role === 'TEACHER'){ const n = __normName(u.name); (groups[n] = groups[n] || []).push(u); } });
    const dupNames = Object.keys(groups).filter(n => groups[n].length > 1);
    if(!dupNames.length) return;
    const removed = [];
    dupNames.forEach(n => {
      const list = groups[n];
      const score = u =>
        (u.email && /@nibras\.local$/i.test(u.email) ? 4 : 0) +
        (u.active !== false ? 2 : 0) +
        ((d.classes||[]).some(c => (c.teacherIds||[]).includes(u.id)) ? 3 : 0) +
        ((d.timetable||{})[u.id] ? 2 : 0) +
        ((d.notes||[]).some(x => x.createdBy === u.id) ? 1 : 0);
      list.sort((a,b) => (score(b)-score(a)) || (a.id < b.id ? 1 : -1));
      const keep = list[0];
      list.slice(1).forEach(dup => {
        (d.classes||[]).forEach(c => {
          if(!Array.isArray(c.teacherIds)) return;
          const before = c.teacherIds;
          c.teacherIds = before.map(t => t === dup.id ? keep.id : t);
          if(c.teacherIds.some((t,i) => t === keep.id && before[i] === dup.id)) c.teacherIds = [...new Set(c.teacherIds)];
        });
        if(d.timetable && d.timetable[dup.id]){
          d.timetable[keep.id] = d.timetable[keep.id] || {};
          for(const day of Object.keys(d.timetable[dup.id])) d.timetable[keep.id][day] = Object.assign(d.timetable[keep.id][day] || {}, d.timetable[dup.id][day]);
          delete d.timetable[dup.id];
        }
        (d.notes||[]).forEach(x => { if(x.createdBy === dup.id) x.createdBy = keep.id; });
        removed.push(dup.id);
      });
    });
    if(!removed.length) return;
    d.users = d.users.filter(u => !removed.includes(u.id));
    __origSetItem(key, JSON.stringify(d));
    changedAny = true;
  });
  return changedAny;
}

function loadDB(){
  let raw = localStorage.getItem(dbKey());
  if(!raw){ const d = seedDB(); saveDB(d); return d; }
  const d = JSON.parse(raw);
  //  —ﬁÌ…:  ÕÊÌ· teacherId «·„›—œ ≈·Ï teacherIds „ ⁄œœ (⁄œ… „⁄·„Ì‰ ·ﬂ· ›’·)
  if(Array.isArray(d.classes)){
    d.classes.forEach(c => {
      if(!Array.isArray(c.teacherIds)){
        c.teacherIds = c.teacherId ? [c.teacherId] : [];
        delete c.teacherId;
      }
    });
  }
  //  ‰ŸÌ›  ·ﬁ«∆Ì: ”Ã· Õ÷Ê— Ê«Õœ ·ﬂ· ÿ«·» ›Ì «·ÌÊ„ (Õ–› «·„ﬂ——)
  let cleaned = false;
  if(Array.isArray(d.attendance) && d.attendance.length > 1){
    const seen = new Set();
    const uniq = [];
    d.attendance.forEach(a => {
      const key = a.studentId + '|' + a.date;
      if(seen.has(key)){ cleaned = true; return; }
      seen.add(key); uniq.push(a);
    });
    if(cleaned) d.attendance = uniq;
  }
  //  ‰ŸÌ›  ·ﬁ«∆Ì: Õ–› ﬂ· «·≈œŒ«·«  ›Ì √Ì«„ «·⁄ÿ·… («·√Õœ Ê«·”» ) ó «·œ—«”… «·«À‰Ì‰-«·Ã„⁄… ›ﬁÿ
  if(Array.isArray(d.attendance)) d.attendance = d.attendance.filter(a => isSchoolDay(a.date));
  if(Array.isArray(d.users)){
    d.users.forEach(u => {
      if(Array.isArray(u.absences)) u.absences = u.absences.filter(isSchoolDay);
      if(Array.isArray(u.markedLate)) u.markedLate = u.markedLate.filter(isSchoolDay);
      if(u.lateMinutes && typeof u.lateMinutes === 'object'){
        Object.keys(u.lateMinutes).forEach(k => { if(!isSchoolDay(k)) delete u.lateMinutes[k]; });
      }
      if(u.lateType && typeof u.lateType === 'object'){
        Object.keys(u.lateType).forEach(k => { if(!isSchoolDay(k)) delete u.lateType[k]; });
      }
    });
  }
  if(Array.isArray(d.students)){
    d.students.forEach(s => {
      if(s.lateMinutes && typeof s.lateMinutes === 'object'){
        Object.keys(s.lateMinutes).forEach(k => { if(!isSchoolDay(k)) delete s.lateMinutes[k]; });
      }
      if(s.lateType && typeof s.lateType === 'object'){
        Object.keys(s.lateType).forEach(k => { if(!isSchoolDay(k)) delete s.lateType[k]; });
      }
    });
  }
  //  ‰ŸÌ›  ·ﬁ«∆Ì: „·«ÕŸ«  „ ÿ«»ﬁ… „ﬂ——… Œ·«· œﬁÌﬁ Ì‰ (÷€ÿ „“œÊÃ ⁄·Ï “— «·Õ›Ÿ)
  if(Array.isArray(d.notes) && d.notes.length > 1){
    const seenNotes = new Map();
    const uniqNotes = [];
    d.notes.forEach(n => {
      const key = n.studentId + '|' + n.type + '|' + n.category + '|' + (n.description||'') + '|' + n.createdBy + '|' + (n.points ?? '');
      const t = n.createdAt ? new Date(n.createdAt).getTime() : 0;
      const prev = seenNotes.get(key);
      if(prev !== undefined && Math.abs(t - prev) < 120000){ cleaned = true; return; }
      seenNotes.set(key, prev !== undefined ? Math.min(prev, t) : t);
      uniqNotes.push(n);
    });
    if(cleaned) d.notes = uniqNotes;
  }
  //  ‰ŸÌ›  ·ﬁ«∆Ì: »Ì«‰«  œŒÊ· «·„⁄·„Ì‰ ó ·« —ﬁ„ ”—Ì∫ „‰ ·« ﬂ·„… „—Ê— ·Â ÌıÃ»— ⁄·Ï  ⁄ÌÌ‰Â« ⁄‰œ √Ê· œŒÊ·
  if(Array.isArray(d.users)){
    d.users.forEach(u => {
      if(u.role === 'TEACHER'){
        if(u.whatsapp === undefined){ u.whatsapp = ''; cleaned = true; }
        if(u.email === undefined && !u.email){ u.email = ''; cleaned = true; }
        if(u.secret !== undefined || u.initialSecret !== undefined){ delete u.secret; delete u.initialSecret; cleaned = true; }
        if(!u.password){ u.firstLogin = true; cleaned = true; }
      }
    });
  }
  //  —ﬁÌ…: »·«€«  «·’Ì«‰…
  if(!Array.isArray(d.maintenance)){ d.maintenance = []; cleaned = true; }
  // √”«›Ì‰ «·Õ–› ·· ﬂ·Ì›« :  ı»ﬁÌ ›Ì «· Œ“Ì‰ «·„Õ·Ì (·«  ı„”Õ Â‰«) Õ Ï Ì—›⁄Â« «·„ ’›Õ
  // ··Œ«œ„ › ‰ ‘— «·Õ–› ›⁄·Ì«. „Ã—œ ⁄—÷Ú Õ–› «·‘ÊÂœ „‰ «·ﬁ«∆„… ·« Ìı›ﬁœÂ«.
  (function(){})(); // (·«  ’›Ì… ·√‘Ã«— «·Õ–› ›Ì loadDB ó  ı’›¯Ï ⁄‰œ «·⁄—÷ ›ﬁÿ)
  if(cleaned) saveDB(d);
  return d;
}

  // «·‰”Œ… «·„Õ·Ì… (⁄—÷/„·› „»«‘—)

async function login(login, password){
  if(__serverEnabled()){
    try{
      const r = await __api('POST', 'login', { login, password });
      if(r.status === 200 && r.j && r.j.user){
        __sessionUser = r.j.user;
        __mirrorSet(r.j.user);
        if(r.j.user.role === 'ADMIN'){
          localStorage.removeItem(SCHOOL_KEY);
        } else {
          localStorage.setItem(SCHOOL_KEY, r.j.user.school);
        }
        return { ok:true };
      }
      if(r.status === 429) return { ok:false, error:'rate_limited' };
      if(r.status === 403 && r.j && r.j.error === 'not_granted') return { ok:false, error:'not_granted' };
      return { ok:false };
    }catch(e){}
    return { ok:false };
  }
  // «·‰”Œ… «·„Õ·Ì…
  const SCHOOLS = ['BOYS','GIRLS'];
  for(const s of SCHOOLS){
    localStorage.setItem(SCHOOL_KEY, s);
    const d = loadDB();
    const l = login.trim().toLowerCase();
    const u = d.users.find(u => ((u.username && u.username.toLowerCase() === l) || u.email === l) && u.password === password && u.active);
    if(u){
      u.lastLogin = new Date().toISOString();
      u.loginCount = (u.loginCount || 0) + 1;
      u.loginHistory = u.loginHistory || [];
      u.loginHistory.push(new Date().toISOString());
      if(u.loginHistory.length > 300) u.loginHistory = u.loginHistory.slice(-300);
      saveDB(d);
      localStorage.setItem(LOCAL_SESSION_KEY, u.id);
      if(u.role === 'ADMIN'){
        localStorage.removeItem(SCHOOL_KEY);
      } else {
        localStorage.setItem(SCHOOL_KEY, s);
      }
      return { ok:true };
    }
  }
  return { ok:false };
}

function getClassesSorted(){
  const d = loadDB();
  const user = currentUser();
  let classes = d.classes;
  // €Ì— «·‘„Ê·ÌÌ‰ („⁄·„ ›ﬁÿ) Ì—Ê‰ «·›’Ê· «·„”‰œ… ≈·ÌÂ„∫ «·„œÌ—/«·ÊﬂÌ·/«·„—‘œ…/«·≈œ«—Ì Ì—Ê‰ «·ﬂ·
  if(user && !seesAllClasses(user)){
    classes = classes.filter(c => (c.teacherIds||[]).includes(user.id));
  }
  return classes.slice().sort((a,b) => {
    const ga = gradeById(a.gradeId), gb = gradeById(b.gradeId);
    return ((ga?.order??0) - (gb?.order??0)) || a.name.localeCompare(b.name,'ar');
  });
}
function getVisibleStudents(){
  const d = loadDB();
  const user = currentUser();
  let students = d.students.filter(s => s.active);
  if(user && !seesAllClasses(user)){
    const classIds = getClassesSorted().map(c => c.id);
    students = students.filter(s => s.classId && classIds.includes(s.classId));
  }
  return students.sort((a,b) => a.fullName.localeCompare(b.fullName,'ar'));
}

function setupPasswordToggles(){
  const scan = (el) => {
    if(!el || !el.querySelectorAll) return;
    el.querySelectorAll('input[type="password"]').forEach((inp) => {
      if(inp.closest('.pw-wrap')) return;
      const wrap = document.createElement('span');
      wrap.className = 'pw-wrap';
      inp.parentNode.insertBefore(wrap, inp);
      wrap.appendChild(inp);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pw-toggle';
      btn.textContent = '??';
      btn.setAttribute('aria-label', '≈ŸÂ«—/≈Œ›«¡ ﬂ·„… «·„—Ê—');
      btn.setAttribute('tabindex', '-1');
      btn.onclick = function(e){ e.preventDefault(); e.stopPropagation(); __togglePw(this); };
      wrap.appendChild(btn);
    });
  };
  scan(document.body);
  if(window.__pwObserver) return;
  try{
    window.__pwObserver = new MutationObserver((muts) => {
      for(const m of muts){
        if(m.type === 'childList'){
          for(const n of m.addedNodes){ if(n.nodeType === 1) scan(n); }
        }
      }
    });
    window.__pwObserver.observe(document.body, { childList:true, subtree:true });
  }catch(e){}
}

function donutChart(present, absent, late){
  const total = present + absent + late;
  const r = 36, circ = 2 * Math.PI * r, cx = 50, cy = 50;
  if(total === 0){
    return `<svg width="120" height="120" viewBox="0 0 100 100"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="14"/><text x="50" y="52" text-anchor="middle" fill="#9ca3af" font-size="9">·«  ÊÃœ »Ì«‰« </text></svg>`;
  }
  const segs = [
    { v: present, c: '#16a34a' },
    { v: absent, c: '#dc2626' },
    { v: late, c: '#d97706' },
  ];
  let off = 0, arcs = '';
  segs.forEach(s => {
    if(s.v === 0) return;
    const d = (s.v / total) * circ;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="14" stroke-dasharray="${d} ${circ - d}" stroke-dashoffset="${-off}"/>`;
    off += d;
  });
  return `<svg width="120" height="120" viewBox="0 0 100 100"><g transform="rotate(-90 ${cx} ${cy})"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f3f4f6" stroke-width="14"/>${arcs}</g><text x="50" y="46" text-anchor="middle" fill="#1f2937" font-size="20" font-weight="800">${present+absent}</text><text x="50" y="58" text-anchor="middle" fill="#6b7280" font-size="9">Õ÷Ê—</text></svg>`;
}

  const pct = max > 0 ? Math.min(value / max * 100, 100) : 0;

}

function ensureUserInDB(school, sessionId){
  setActiveSchool(school);
  const d = loadDB();
  if(sessionId && !d.users.find(u => u.id === sessionId)){
    const other = school === 'BOYS' ? 'GIRLS' : 'BOYS';
    const prevKey = localStorage.getItem(SCHOOL_KEY);
    localStorage.setItem(SCHOOL_KEY, other);
    const otherDB = loadDB();
    const existing = otherDB.users.find(u => u.id === sessionId);
    if(existing){ d.users.push({ ...existing }); }
    localStorage.setItem(SCHOOL_KEY, school);
    saveDB(d);
  }
}
function enterSchool(school){
  setActiveSchool(school);
  const d = loadDB();
  const sessionId = localStorage.getItem(LOCAL_SESSION_KEY);
  // ≈‰ ﬂ«‰  «·»‰«  ›«—€… Ê«·»‰Ì‰ ›ÌÂ« »Ì«‰«  ? ‰”Œ  ·ﬁ«∆Ì
  if(school === 'GIRLS' && d.students.length === 0 && d.grades.length === 0){
    const prevKey = localStorage.getItem(SCHOOL_KEY);
    localStorage.setItem(SCHOOL_KEY, 'BOYS');
    const boysDB = loadDB();
    localStorage.setItem(SCHOOL_KEY, school);

      copyBoysToGirls();
      ensureUserInDB('GIRLS', sessionId);
      setActiveSchool('GIRLS');
      location.hash = '#/';
      renderApp();
      return;
    }
  }
  ensureUserInDB(school, sessionId);
  if(d.classes.length === 0 && d.grades.length === 0 && d.students.length === 0){
    stages.forEach(stage => {
      let grade = d.grades.find(g => g.name === stage.name);
      if(!grade){ grade = { id:uid(), name:stage.name, order:stage.order }; d.grades.push(grade); }
      if(!d.classes.some(c => c.gradeId===grade.id && c.name==='√')){
        d.classes.push({ id:uid(), gradeId:grade.id, name:'√', campus:school, capacity:null, teacherIds:[] });
      }
    });
    saveDB(d);
    ensureUserInDB(school, sessionId);
  }
  location.hash = '#/';
  renderApp();
}

let __audioCtx = null;
function ensureAudio(){
  try{
    if(!__audioCtx) __audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(__audioCtx && __audioCtx.state === 'suspended') __audioCtx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown', ensureAudio, { once:true });
document.addEventListener('keydown', ensureAudio, { once:true });
function playNotifSound(){
  try{
    ensureAudio();
    if(!__audioCtx) return;
    const t = __audioCtx.currentTime;
    [[880,0],[660,0.18]].forEach(([f,d]) => {
      const o = __audioCtx.createOscillator(), g = __audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.25);
      o.connect(g); g.connect(__audioCtx.destination);
      o.start(t + d); o.stop(t + d + 0.3);
    });
  }catch(e){}
}

  const items = notifItemsFor(u);
  const fresh = items.filter(x => x.ts > __notifLastPoll);
  if(fresh.length){

function checkMsgBeep(){
  const user = currentUser();
  if(!user || user.role === 'ADMIN') return;
  if(window.__msgBeepUser !== user.id || !window.__msgBeepIds || !window.__msgBeepIds[user.id]){
    window.__msgBeepUser = user.id;
    window.__msgBeepIds = window.__msgBeepIds || {};
    window.__msgBeepIds[user.id] = {};
  }
  const rung = window.__msgBeepIds[user.id];
  const msgs = adminMsgsFor(user.id).filter(m => !m.dismissed && !m.revealed && m.senderRole !== 'TRANSFER' && !(m.clearedBy && user.id && (user.id in m.clearedBy)));
  const fresh = msgs.filter(m => !rung['m:' + m.id]);
  if(fresh.length){
    fresh.forEach(m => rung['m:' + m.id] = 1);
    try { playMsgAlert(); }catch(e){}
  }
  //  ‰»ÌÂ Â—Ê» „‰ «·Õ’… („‰ ﬁ«⁄œ… «·»Ì«‰«  «·„ “«„‰…) ó Ìﬁ—⁄ «·Ã—” „—… Ê«Õœ… ·ﬂ·  ‰»ÌÂ ÃœÌœ ··ÊﬂÌ·
  if(user.role === 'AGENT'){

      const freshE = alerts.filter(a => !rung['e:' + a.id]);

        freshE.forEach(a => rung['e:' + a.id] = 1);
        try { playMsgAlert(); }catch(e){}
      }
    }catch(e){}
  }
}
function startMsgBeepLoop(){
  if(window.__msgBeepTimer) return;
  checkMsgBeep();
  window.__msgBeepTimer = setInterval(checkMsgBeep, 3000);
}
function unlockMsgAudio(){
  try {
    if(window.__audioCtx && window.__audioCtx.state === 'suspended') window.__audioCtx.resume();
    if(window.__pendingMsgBeep){ window.__pendingMsgBeep = false; playMsgAlert(); }
  }catch(e){}
}
function playMsgAlert(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!window.__audioCtx) window.__audioCtx = new AC();
    const ctx = window.__audioCtx;
    if(ctx.state === 'suspended'){ ctx.resume(); window.__pendingMsgBeep = true; }
    const t0 = ctx.currentTime;
    [0, 0.3, 0.6].forEach((off, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i % 2 ? 'triangle' : 'square';
      osc.frequency.setValueAtTime(i % 2 ? 990 : 880, t0 + off);
      gain.gain.setValueAtTime(0.0001, t0 + off);
      gain.gain.exponentialRampToValueAtTime(0.2, t0 + off + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.16);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0 + off);
      osc.stop(t0 + off + 0.2);
    });
  }catch(e){}
}

const AR_MONTHS = ['Ì‰«Ì—','›»—«Ì—','„«—”','√»—Ì·','„«ÌÊ','ÌÊ‰ÌÊ','ÌÊ·ÌÊ','√€”ÿ”','”» „»—','√ﬂ Ê»—','‰Ê›„»—','œÌ”„»—'];
const HIJRI_MONTHS = ['„Õ—„','’›—','—»Ì⁄ «·√Ê·','—»Ì⁄ «·¬Œ—','Ã„«œÏ «·√Ê·Ï','Ã„«œÏ «·¬Œ—…','—Ã»','‘⁄»«‰','—„÷«‰','‘Ê«·','–Ê «·ﬁ⁄œ…','–Ê «·ÕÃ…'];
function hijriDateStr(){
  try{
    const now = new Date();
    for(const cal of ['islamic-umalqura', 'islamic', 'islamic-civil']){
      try{
        const fmt = new Intl.DateTimeFormat('en-u-ca-' + cal, { year:'numeric', month:'numeric', day:'numeric' });
        const parts = fmt.formatToParts(now);
        let y = 0, m = 0, d = 0;
        parts.forEach(p => { if(p.type === 'year') y = +p.value; else if(p.type === 'month') m = +p.value; else if(p.type === 'day') d = +p.value; });
        if(y && m >= 1 && m <= 12 && d) return `${d} ${HIJRI_MONTHS[m - 1]} ${y} Â‹`;
      }catch(e){}
    }
  }catch(e){}
  return '';
}

function presentNowInfo(school){
  const db = JSON.parse(localStorage.getItem('nibras_' + school + '_db_v1') || 'null');
  if(!db) return { n: 0, names: [], absentNames: [] };
  const cutoff = Date.now() - 3 * 60 * 1000;
  const teachers = (db.users || []).filter(u => u.role === 'TEACHER' && u.active);
  const present = teachers.filter(u => u.lastSeenAt && new Date(u.lastSeenAt).getTime() >= cutoff);
  const names = present.map(u => ({ name: u.name, online: true }));
  const absentNames = teachers.filter(u => !u.lastSeenAt || new Date(u.lastSeenAt).getTime() < cutoff).map(u => u.name);
  return { n: names.length, names, absentNames };
}

// ≈–« ”ıÃ¯· €Ì«»/ √Œ— ›Ì «·Õ÷Ê— › ıÂ„· «·„·«ÕŸ… «·ÌœÊÌ… ·‰›” «·ÌÊ„ Õ Ï ·«  ıŒ’„ „— Ì‰
const UNDONE_DEDUCTION = -4;
function pointItems(d){
  const items = [];
  const today = todayStr();
  d.notes.forEach(n => {
    items.push({ studentId:n.studentId, type:n.type, category:n.category, description:n.description, points:(n.points ?? notePoints(n.type, n.category)), createdBy:n.createdBy, createdAt:n.createdAt, kind:'note' });
  });
  d.attendance.forEach(a => {
    const pts = attendancePoints(a.status, a.lateMinutes);
    if(pts !== 0) items.push({ studentId:a.studentId, type:'NEGATIVE', category:a.status==='ABSENT'?'«·€Ì«»':'«· √Œ—', description:'Õ”» ”Ã· «·Õ÷Ê— ('+a.date+')' + (a.lateMinutes ? ' ó ' + a.lateMinutes + ' œﬁÌﬁ…' : ''), points:pts, createdBy:a.createdBy, createdAt:a.date+'T00:00:00.000Z', kind:'att' });
  });
  (d.assignments||[]).forEach(a => {
    if(a && a.deleted) return;
    if(!a.date || a.date > today) return;
    (d.students||[]).forEach(s => {
      if(!s.active || s.classId !== a.classId) return;
      const completed = (a.completedBy||[]).includes(s.id);
      if(completed) return;
      const existingNote = d.notes.find(n => n.studentId === s.id && n.category === '⁄œ„ ≈‰Ã«“ «·Ê«Ã»' && n.assignmentId === a.id);
      if(!existingNote) items.push({ studentId:s.id, type:'NEGATIVE', category:'⁄œ„ ≈‰Ã«“ «·Ê«Ã»', description:' ﬂ·Ì›: ' + (a.title||'»œÊ‰ ⁄‰Ê«‰') + ' (' + (a.date||'') + ')', points: UNDONE_DEDUCTION, createdBy:a.teacherId, createdAt:a.date+'T23:59:59.000Z', kind:'assign' });
    });
  });
  const attKeys = new Set(d.attendance.map(a => a.studentId + '|' + a.date + '|' + a.status));
  const doneAssignKeys = new Set((d.assignments||[]).filter(a => !(a && a.deleted)).flatMap(a => (a.completedBy||[]).map(sid => sid + '|' + a.id)));
  const cut = pointsCutoffDate();
  return items.filter(it => {
    if(it.type === 'NEGATIVE' && cut){
      const dt = it.createdAt ? String(it.createdAt).slice(0,10) : '';
      if(dt && dt < cut) return false;
    }
    if(it.kind === 'note' && (it.category === '«·€Ì«»' || it.category === '«· √Œ—')){
      const date = it.createdAt ? String(it.createdAt).slice(0,10) : '';
      const status = it.category === '«·€Ì«»' ? 'ABSENT' : 'LATE';
      if(date && attKeys.has(it.studentId + '|' + date + '|' + status)) return false;
    }
    if(it.kind === 'assign' && doneAssignKeys.has(it.studentId + '|' + (it.assignmentId||''))) return false;
    return true;
  });
}
function studentPointsMap(){
  const m = {};
  pointItems(loadDB()).forEach(it => {
    m[it.studentId] = (m[it.studentId]||0) + it.points;
  });
  return m;
}
function studentPointsSplit(){
  const m = {};
  pointItems(loadDB()).forEach(it => {
    if(!m[it.studentId]) m[it.studentId] = {pos:0, neg:0};
    if(it.points > 0) m[it.studentId].pos += it.points;
    else m[it.studentId].neg += it.points;
  });
  return m;
}

function sortStudentsForView(students){
  const ptsMap = studentPointsMap();
  return students.slice().sort((a,b) => {
    if(studentsSort === 'points'){
      const pa = ptsMap[a.id] || 0, pb = ptsMap[b.id] || 0;
      if(pb !== pa) return pb - pa;

let __absPopupEl = null, __absPopupSid = null;
function openAbsentPopup(ev, sid){
  ev.preventDefault();
  ev.stopPropagation();
  closeAbsentPopup();
  const rect = ev.currentTarget.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'abs-popup';
  pop.innerHTML = `
    <div class="abs-pop-title">«Œ — ‰Ê⁄ «·€Ì«»</div>
    <div class="abs-pop-opt abs-pop-exc" onclick="chooseAbsentType('${sid}','EXCUSED')">?? „” √–‰</div>
    <div class="abs-pop-opt abs-pop-esc" onclick="chooseAbsentType('${sid}','ESCAPE')">?? Â«—» „‰ «·Õ’…</div>
    <div class="abs-pop-opt abs-pop-nor" onclick="setNormalAbsence('${sid}')">? €Ì«» ⁄«œÌ</div>
    <div class="abs-pop-hint">»œÊ‰ «Œ Ì«— = €Ì«» ⁄«œÌ „‰ »œ«Ì… «·ÌÊ„</div>`;
  document.body.appendChild(pop);
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = rect.right - pw;
  if(x < 6) x = 6;
  if(x + pw > innerWidth - 6) x = innerWidth - pw - 6;
  let y = rect.bottom + 6;
  if(y + ph > innerHeight - 6) y = rect.top - ph - 6;
  if(y < 6) y = 6;
  pop.style.left = x + 'px';
  pop.style.top = y + 'px';
  __absPopupEl = pop;
  __absPopupSid = sid;
  setTimeout(() => document.addEventListener('mousedown', closeAbsentPopupOutside), 0);
  document.addEventListener('keydown', closeAbsentPopupEsc);
}
function closeAbsentPopupOutside(e){
  const pop = __absPopupEl;
  if(!pop) return;
  if(pop.contains(e.target)) return;
  const sid = __absPopupSid;
  const isRadio = e.target && e.target.tagName === 'INPUT' && e.target.type === 'radio';
  closeAbsentPopup();
  // ≈–« ÷€ÿ ⁄·Ï “—/—«œÌÊ ¬Œ— ›·‰ ‰⁄Ìœ «·—”„ Â‰« (Ì√Œ– «·—«œÌÊ «·ÃœÌœ «·ﬁ—«—)° Ê≈·« €Ì«» ⁄«œÌ  ·ﬁ«∆Ì
  if(sid && !isRadio) setNormalAbsence(sid);
}
function closeAbsentPopupEsc(e){
  if(e.key === 'Escape'){
    const sid = __absPopupSid;

function saveAttendance(){
  const d = loadDB();
  if(!isSchoolDay(attendanceState.date)){
    alert('√Ì«„ «·œ—«”… „‰ «·«À‰Ì‰ ≈·Ï «·Ã„⁄… ›ﬁÿ ó ·« Ì„ﬂ‰  ”ÃÌ· Õ÷Ê— ›Ì «·⁄ÿ·… («·√Õœ/«·”» )');
    return;
  }
  let lateCount = 0, latePoints = 0;
  Object.entries(attendanceState.draft).forEach(([studentId, status]) => {
    let rec = d.attendance.find(a => a.studentId === studentId && a.date === attendanceState.date);
    const realClassId = studentById(studentId)?.classId || attendanceState.classId;
    const at = (status === 'ABSENT' && attendanceState.absenceType && attendanceState.absenceType[studentId]) || undefined;
    let lateMins = 0;
    const st = d.students.find(x => x.id === studentId);
    if(st){
      st.lateMinutes = st.lateMinutes || {};
      st.lateType = st.lateType || {};
      const date = attendanceState.date;
      if(status === 'LATE'){
        const minsEl = document.getElementById('stLatMin-' + studentId);
        const mins = parseInt((minsEl && minsEl.value) || '0', 10);
        lateMins = isNaN(mins) || mins < 0 ? 0 : mins;
        st.lateMinutes[date] = lateMins;
        const typeEl = document.getElementById('stLatType-' + studentId);
        const stType = typeEl && typeEl.value ? typeEl.value : (attendanceState.sLateType && attendanceState.sLateType[studentId]);
        st.lateType[date] = (stType === 'MORNING' || stType === 'CLASS' || stType === 'EARLY_LEAVE') ? stType : 'MORNING';
        lateCount++; latePoints += attendancePoints('LATE', lateMins);
      }
      else { delete st.lateMinutes[date]; delete st.lateType[date]; }
    }
    const attObj = { id:uid(), studentId, classId:realClassId, date:attendanceState.date, status, absenceType: at, createdBy: currentUser()?.id, _t: Date.now() };
    if(status === 'LATE' && lateMins > 0) attObj.lateMinutes = lateMins;
    if(rec){ rec.status = status; rec.classId = realClassId; rec.absenceType = at; rec._t = Date.now(); rec.createdBy = currentUser()?.id || rec.createdBy; if(status === 'LATE' && lateMins > 0) rec.lateMinutes = lateMins; else delete rec.lateMinutes; }
    else { d.attendance.push(attObj); }
  });
  Object.entries(attendanceState.tDraft || {}).forEach(([teacherId, status]) => {
    const u = d.users.find(x => x.id === teacherId);
    if(!u) return;
    u.absences = u.absences || [];
    u.markedLate = u.markedLate || [];
    u.lateMinutes = u.lateMinutes || {};
    u.lateType = u.lateType || {};
    const date = attendanceState.date;
    if(status === 'ABSENT'){ if(!u.absences.includes(date)) u.absences.push(date); u.markedLate = u.markedLate.filter(x => x !== date); delete u.lateMinutes[date]; delete u.lateType[date]; }
    else if(status === 'LATE'){
      if(!u.markedLate.includes(date)) u.markedLate.push(date);
      u.absences = u.absences.filter(x => x !== date);
      const minsEl = document.getElementById('latMin-' + teacherId);
      const mins = parseInt((minsEl && minsEl.value) || '0', 10);
      u.lateMinutes[date] = isNaN(mins) || mins < 0 ? 0 : mins;
      const typeEl = document.getElementById('latType-' + teacherId);
      const tType = typeEl && typeEl.value ? typeEl.value : (attendanceState.tLateType && attendanceState.tLateType[teacherId]);
      u.lateType[date] = (tType === 'MORNING' || tType === 'CLASS' || tType === 'EARLY_LEAVE') ? tType : 'MORNING';
    }
    else { u.absences = u.absences.filter(x => x !== date); u.markedLate = u.markedLate.filter(x => x !== date); delete u.lateMinutes[date]; delete u.lateType[date]; }
  });
  saveDB(d);
  attendanceState.draft = {};
  attendanceState.absenceType = {};
  attendanceState.sLateMin = {};
  attendanceState.sLateType = {};
  attendanceState.tDraft = {};
  attendanceState.tLateMin = {};
  attendanceState.tLateType = {};
  const msg = document.getElementById('attSaveMsg');
  if(msg){
    let txt = ' „ Õ›Ÿ «·Õ÷Ê— »‰Ã«Õ';
    if(lateCount > 0) txt += ' ó  √Œ— ' + lateCount + ' ÿ«·» (Œ’„ ' + latePoints + ' ‰ﬁÿ…)';
    if(lateCount > 0) msg.style.color = '#dc2626'; else { msg.style.color = '#16a34a'; }
    msg.textContent = txt;
  }
}

function makeLocalUsername(base){  let candidate = String(base||'').toLowerCase().replace(/[^a-z0-9._-]/g,'').replace(/^[._-]+|[._-]+$/g,'') || 'user';
  let i = 1;
  const used = new Set();
  ['BOYS','GIRLS'].forEach(s => { try{ (loadDBFor(s).users||[]).forEach(u => { if(u.username) used.add(String(u.username).toLowerCase()); }); }catch(e){} });
  while(used.has(candidate)){ i++; candidate = String(base||'').toLowerCase().replace(/[^a-z0-9._-]/g,'').replace(/^[._-]+|[._-]+$/g,'') + i; }
  return candidate;

function getAcademicStart(){
  const school = getActiveSchool();
  if(__serverEnabled()){
    const s = (__schoolSettingsCache[school] || {}).academicStart;
    if(s){
      const d = new Date(String(s).slice(0,10) + 'T00:00:00');
      if(!isNaN(d.getTime())) return d;
    }
  }
  try{
    const s = localStorage.getItem(academicStartKey());
    if(s){
      const d = new Date(String(s).slice(0,10) + 'T00:00:00');
      if(!isNaN(d.getTime())) return d;
    }
  }catch(e){}

}
function setAcademicStart(isoOrNull){
  const school = getActiveSchool();

}
function thisMonday(now){
  const m = new Date(now);
  m.setDate(m.getDate() - ((now.getDay()+6)%7)); // 0 = «·«À‰Ì‰
  return m;
}
function schoolWeekInfo(){
  const now = new Date();
  let start = getAcademicStart();
  if(!start){
    start = thisMonday(now);
    setAcademicStart(localDateKey(start));
  }
  const mon = thisMonday(now);
  const diff = Math.floor((mon.getTime() - start.getTime()) / (7*24*3600*1000));
  const weeks = diff + 1;
  if(weeks < 1) return { label:'«·√”»Ê⁄ «· „ÂÌœÌ', kind:'break' };
  return { label:'«·√”»Ê⁄ ' + weeks, kind:'week' };
}
function nudgeAcademicStart(weekDelta){
  let start = getAcademicStart();
  const now = new Date();
  if(!start || isNaN(start.getTime())) start = thisMonday(now);
  const shifted = new Date(start);
  shifted.setDate(shifted.getDate() - weekDelta * 7);
  setAcademicStart(localDateKey(shifted));
  renderApp();
}

function schoolDaysInRange(from, to){
  if(!from || !to) return 0;
  let count = 0;
  const d = new Date(from + 'T00:00:00');
  const end = new Date(to + 'T00:00:00');
  if(isNaN(d) || isNaN(end) || d > end) return 0;
  while(d <= end){ if(isSchoolDay(localDateKey(d))) count++; d.setDate(d.getDate()+1); }
  return count;
}
function teacherStats(u){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  // «·”‰… «·œ—«”Ì…: ”» „»— ? ÌÊ‰ÌÊ
  const yearStart = month >= 8 ? new Date(year, 8, 1) : new Date(year-1, 8, 1);
  const yearEnd = month >= 8 ? new Date(year+1, 5, 30) : new Date(year, 5, 30);
  const startKey = localDateKey(yearStart);
  const todayKey = localDateKey(now);
  const absDates = (u.absences || []).filter(x => x >= startKey && x <= todayKey);
  const absent = absDates.length;
  const lateDaysSet = new Set(); let lateMin = 0, firstLoginToday = null;
  // √Ì«„ «· √Œ— «·„”Ã·… ÌœÊÌ« „‰ «·„œÌ—/«·ÊﬂÌ·
  (u.markedLate || []).forEach(x => {
    if(x >= startKey && x <= todayKey) lateDaysSet.add(x);
  });
  // œﬁ«∆ﬁ «· √Œ— «·„œŒ·… ÌœÊÌ« „‰ ‘«‘… «·Õ÷Ê—
  Object.entries(u.lateMinutes || {}).forEach(([date, mins]) => {
    if(date >= startKey && date <= todayKey){ lateDaysSet.add(date); if(mins) lateMin += Number(mins); }
  });
  // √Ê· œŒÊ· «·ÌÊ„
  const logins = (u.loginHistory || []).map(iso => new Date(iso));
  logins.forEach(d => {
    if(localDateKey(d) === localDateKey(now) && !firstLoginToday) firstLoginToday = d;
  });
  return {
    loginCount: u.loginCount||0,
    lastLogin: u.lastLogin,
    firstLoginToday,
    absent, lateDays: lateDaysSet.size, lateMin,
    absDates,
  };
}

function supervisionForUser(user){
  if(!user || user.role !== 'TEACHER') return null;
  const day = TIMETABLE_DAYS.find(x => x.dow === new Date().getDay());
  if(!day) return null;
  const slot = SUPERVISION_DAYS.find(s => s.key === day.key);
  if(!slot) return null;
  const d = typeof loadDB === 'function' ? loadDB() : null;
  const users = (d && d.users) ? d.users : [];
  const resolve = ref => {
    if(ref === (user.id || '')) return user;                       // «·ÂÊÌ… ‰›”Â«
    const byId = users.find(u => u.id === ref);
    if(byId) return byId;
    const byName = users.find(u => (u.name||'').includes(String(ref)));
    return byName || null;
  };
  const roster = slot.refs.map(resolve).filter(Boolean);
  const me = roster.find(u => u.id === user.id);
  if(!me) return null;
  return { dayKey:day.key, label:slot.label, roster };
}

function mirrorTtToOther(teacherEmail, day, period, cell){
  const other = getActiveSchool() === 'BOYS' ? 'GIRLS' : 'BOYS';
  const od = loadDBFor(other);
  const u = (od.users || []).find(x => x.email === teacherEmail);
  if(!u) return;
  let classId = cell.classId;
  const src = loadDB().classes.find(c => c.id === cell.classId);
  if(src && src.name){
    const oc = (od.classes || []).find(c => c.name === src.name);
    if(oc) classId = oc.id;
  }
  od.timetable = od.timetable || {};
  od.timetable[u.id] = od.timetable[u.id] || {};
  od.timetable[u.id][day] = od.timetable[u.id][day] || {};
  od.timetable[u.id][day][period] = { subject: cell.subject, classId };
  localStorage.setItem(dbKeyFor(other), JSON.stringify(od));
}
function mirrorTtDelete(teacherEmail, day, period){
  const other = getActiveSchool() === 'BOYS' ? 'GIRLS' : 'BOYS';
  const od = loadDBFor(other);
  const u = (od.users || []).find(x => x.email === teacherEmail);
  if(!u || !od.timetable || !od.timetable[u.id] || !od.timetable[u.id][day]) return;
  const cell = od.timetable[u.id][day][period] || {};
  od.timetable[u.id][day][period] = { _del: true, _v: (((cell && typeof cell._v === 'number') ? cell._v : 0) + 1) };
  localStorage.setItem(dbKeyFor(other), JSON.stringify(od));
}

function getTeacherSubjects(user, d){
  const tt = (d.timetable || {})[user.id] || {};
  const map = {};
  Object.values(tt).forEach(day => {
    Object.values(day).forEach(cell => {
      if(cell && cell.subject && cell.classId){
        const cls = d.classes.find(c => c.id === cell.classId);
        if(cls){
          const key = cell.classId + '|' + cell.subject;
          if(!map[key]) map[key] = { classId: cell.classId, subject: cell.subject, className: cls.name, gradeId: cls.gradeId };
        }
      }
    });
  });
  return Object.values(map);
}

function engagementPeriodRange(period){
  const now = new Date();
  const today = localDateKey(now);
  const y = now.getFullYear(), m = now.getMonth();
  if(period === 'day') return { from: today, to: today };
  if(period === 'week'){
    const mon = new Date(now);
    mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    return { from: localDateKey(mon), to: today };
  }
  if(period === 'month') return { from: y + '-' + String(m+1).padStart(2,'0') + '-01', to: today };
  if(period === 'term'){
    let from;
    if(m >= 8) from = y + '-09-01';                 // «·›’· «·√Ê·: ”» „»—ñ‰Ê›„»—
    else if(m === 11) from = y + '-12-01';          // «·›’· «·À«‰Ì: œÌ”„»—ñ›»—«Ì—
    else if(m <= 1) from = (y-1) + '-12-01';        // Ì‰«Ì—ñ›»—«Ì—: »œ«Ì… «·›’· «·À«‰Ì
    else from = y + '-03-01';                       // «·›’· «·À«·À: „«—”ñÌÊ‰ÌÊ
    return { from, to: today };
  }
  return { from: (m >= 8 ? y : y-1) + '-09-01', to: today }; // „‰ »œ«Ì… «·⁄«„ «·œ—«”Ì (”» „»—)
}

function buildChartData(type, rows){

function renderBars(data){
  if(data.length === 0) return '<p class="muted small">·«  ÊÃœ »Ì«‰« </p>';
  const vals = data.map(d => d.value);
  const max = Math.max(...vals, 1);
  const min = Math.min(...vals, 0);
  const span = (max - min) || 1;
  const barColor = (d,i) => d.color || chartColors[i%chartColors.length];
  const valColor = v => v >= 0 ? '#16a34a' : '#dc2626';
  return `<div class="card"><div style="padding:6px">` + data.map((d,i)=> {
    const w = Math.max(2, (d.value - min)/span*100);
    return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">

      <div style="flex:1;height:26px;background:#f3f4f6;border-radius:6px;overflow:hidden;position:relative">

        <div style="width:${w}%;height:100%;background:${barColor(d,i)};border-radius:6px;transition:width .4s"></div>
      </div>
      <span style="width:64px;font-size:13px;font-weight:700;color:${valColor(d.value)};text-align:center">${d.value>0?'+':''}${d.value}${d.unit||''}</span>
    </div>`;
  }).join('') + `</div></div>`;
}
function renderPie(data){
  if(data.length === 0) return '<p class="muted small">·«  ÊÃœ »Ì«‰« </p>';

}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع تحت الصيانة | مدرسة النبراس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #2563eb;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #1e293b;
        }
        p {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .status {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛠️</div>
        <h1>الموقع قيد الصيانة حالياً</h1>
        <p>نعمل حالياً على إجلاء بعض التحديثات وتحسين جودة الخدمة. سنعود للعمل قريباً جداً، شكراً لتفهمكم.</p>
        <div class="status">سنعود خلال وقت قصير</div>
    </div>
</body>
</html>
